<style>
:root{--bg:#F6EFE4;--card:#FFFBF4;--line:#E8DCC8;--fg:#3E3833;--mut:#958A7C;--gold:#E3A33B;
 --f:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f)}
body{background-image:radial-gradient(circle at 8% 12%,#FBE3D6 0,transparent 28%),radial-gradient(circle at 92% 30%,#E6EFD8 0,transparent 26%),radial-gradient(circle at 70% 95%,#F7E7C4 0,transparent 30%);background-attachment:fixed;
 padding:calc(28px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px));min-height:100vh}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:22px}
header{display:grid;justify-items:center;text-align:center;gap:8px}
header img{width:72px;height:72px;image-rendering:pixelated}
h1{margin:0;font-size:clamp(26px,6vw,36px);font-weight:900}
.sub{color:var(--mut);font-size:15px;margin:0}
.list{display:grid;gap:14px}
a.game{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px;color:inherit;text-decoration:none;box-shadow:0 8px 22px rgba(160,125,80,.08);transition:transform .15s}
a.game:hover{transform:translateY(-2px);border-color:var(--gold)}
a.game:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.ico{width:52px;height:52px;border-radius:14px;background:#F3EADB;display:grid;place-items:center;font-size:26px}
.game b{display:block;font-size:18px}
.game small{color:var(--mut);font-size:13.5px;line-height:1.5}
.go{background:var(--gold);color:#fff;font-weight:800;border-radius:999px;padding:8px 16px;font-size:14px;white-space:nowrap}
.soon{opacity:.6;pointer-events:none}
.soon .go{background:#CDBFA8}
.disc{font-size:12px;color:var(--mut);background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:10px 14px;line-height:1.7}
footer{text-align:center;color:var(--mut);font-size:12.5px}
@media (prefers-reduced-motion: reduce){a.game{transition:none}}
</style>
</head>
