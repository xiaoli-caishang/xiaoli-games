<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>小梨工作台 · 向阳花园（设计原型）</title>
<style>
:root{
  --cream:#FBF3DF;--paper:#FFFBF1;--paper-2:#FFF5DC;--line:#EADFC4;--line-2:#DCCBA4;
  --ink:#2B2117;--sub:#7D6E58;--faint:#A89878;
  --sun:#F2A91F;--sun-2:#FFD45C;--sun-3:#FFF0B8;
  --seed:#3E2716;--seed-2:#6B4325;--husk:#A9794A;--pale:#EBCB8B;
  --leaf:#4F7A3A;--leaf-2:#8FB36B;--leaf-3:#E3EDCF;
  --sky:#DCEBEA;--bad:#C2462E;--bad-2:#FBE3DA;--warn:#D98A1C;
  --display:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --body:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
  --num:"DIN Alternate","Bahnschrift","DIN Condensed",Georgia,sans-serif;
  --r:18px;--shadow:0 1px 0 #fff inset,0 14px 34px -22px rgba(92,60,18,.45);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font:14px/1.65 var(--body);display:grid;grid-template-columns:256px 1fr;min-height:100vh;
  background-image:radial-gradient(circle at 92% -8%,#FFE29A 0,rgba(255,226,154,0) 38%),radial-gradient(circle at 10% 110%,#E8EFD6 0,rgba(232,239,214,0) 35%)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.28;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .32 0 0 0 0 .15 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* ---------- 侧栏：茎秆 ---------- */
aside{position:sticky;top:0;height:100vh;overflow:auto;background:#2E1F12;color:#F4E6C6;padding:22px 16px 18px;display:flex;flex-direction:column;gap:18px;
  background-image:radial-gradient(circle at 50% 0,#4A3019 0,rgba(74,48,25,0) 60%)}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px}
.brand svg{width:46px;height:46px;flex:none;animation:spin 90s linear infinite}
.brand b{display:block;font:700 18px/1.2 var(--display);letter-spacing:.04em;color:#FFF3CF}
.brand small{display:block;font-size:10px;letter-spacing:.22em;color:#C9AE7C;margin-top:3px}
@keyframes spin{to{transform:rotate(360deg)}}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;color:#E6D3AC;position:relative;transition:background .2s}
.nav button:hover{background:#3C2917}
.nav button .t{font-weight:600;font-size:14px;line-height:1.25}
.nav button .f{display:block;font-size:11px;color:#A88E62;font-weight:400}
.nav button.on{background:linear-gradient(90deg,#F2A91F,#FFC94A);color:#2B1A0B}
.nav button.on .f{color:#6B4325}
.nav button.on::before{content:"";position:absolute;left:-16px;top:50%;width:10px;height:18px;margin-top:-9px;background:var(--leaf-2);border-radius:0 18px 0 18px}
.tag{font-size:10px;padding:1px 7px;border-radius:99px;border:1px solid currentColor;opacity:.75;white-space:nowrap}
.dot{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--bad);color:#fff;font:700 11px/20px var(--num);text-align:center}
.plan{margin-top:auto;background:#3A2715;border:1px solid #4E3720;border-radius:16px;padding:14px 14px 10px}
.plan h4{margin:0 0 2px;font:700 13px var(--display);color:#FFE7A8;letter-spacing:.06em}
.plan p{margin:0 0 10px;font-size:11px;color:#A88E62}
.stem{list-style:none;margin:0;padding:0 0 0 14px;position:relative}
.stem::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:linear-gradient(#8FB36B,#4F7A3A 60%,#5C4428)}
.stem li{position:relative;padding:3px 0 3px 12px;font-size:12px;color:#BFA67A;display:flex;justify-content:space-between;gap:6px}
.stem li::before{content:"";position:absolute;left:-13px;top:8px;width:10px;height:8px;border-radius:0 10px 0 10px;background:#5C4428;transform:rotate(-20deg)}
.stem li.done{color:#DCE8C4}.stem li.done::before{background:var(--leaf-2)}
.stem li.now{color:#FFE7A8;font-weight:700}
.stem li.now::before{background:var(--sun-2);border-radius:50%;width:10px;height:10px;left:-14px;top:7px;box-shadow:0 0 0 4px rgba(255,212,92,.25);animation:bud 1.8s ease-in-out infinite}
@keyframes bud{50%{box-shadow:0 0 0 8px rgba(255,212,92,0)}}
.stem li span{font-family:var(--num);opacity:.8}

/* ---------- 主区 ---------- */
main{padding:26px 34px 70px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.top h1{margin:0;font:700 30px/1.15 var(--display);letter-spacing:.02em}
.top h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--sun-2) 62%)}
.top .meta{color:var(--sub);font-size:13px;margin-top:6px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--paper);border-radius:12px;padding:7px 13px;font-weight:600;font-size:13px;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px -10px rgba(92,60,18,.6)}
.btn.sun{background:var(--sun);border-color:#D9930F;color:#2B1A0B}
.btn.dark{background:var(--seed);border-color:var(--seed);color:#FFE7A8}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:10px}
.demo{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--sun-3);color:#7A5410;border:1px dashed #E0B04A}
.alert{display:none;align-items:center;gap:12px;background:linear-gradient(90deg,#5A6670,#7B8790);color:#fff;border-radius:16px;padding:12px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.alert.show{display:flex;animation:drop .4s ease}
.alert b{font:700 15px var(--display)}
.alert .btn{margin-left:auto;background:#fff;color:var(--ink);border:0}
@keyframes drop{from{transform:translateY(-8px);opacity:0}}

.grid{display:grid;gap:16px;grid-template-columns:repeat(12,1fr)}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);position:relative;min-width:0;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.grid>.card:nth-child(2){animation-delay:.05s}.grid>.card:nth-child(3){animation-delay:.1s}.grid>.card:nth-child(4){animation-delay:.15s}.grid>.card:nth-child(5){animation-delay:.2s}.grid>.card:nth-child(6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.card h3{margin:0;font:700 16px var(--display);letter-spacing:.03em;display:flex;align-items:center;gap:8px}
.card h3 small{font:400 12px var(--body);color:var(--faint);letter-spacing:0}
.card .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sub{color:var(--sub);font-size:12px}
.big{font:700 40px/1 var(--num)}
.muted{color:var(--sub)}

/* hero 花盘 */
.hero{display:grid;grid-template-columns:1fr 380px;gap:10px;align-items:center;overflow:hidden;
  background:radial-gradient(circle at 78% 50%,#FFF0B8 0,rgba(255,240,184,0) 55%),var(--paper)}
.hero::after{content:"";position:absolute;right:-120px;top:-120px;width:620px;height:620px;pointer-events:none;opacity:.35;
  background:repeating-conic-gradient(from 0deg,rgba(242,169,31,.25) 0 4deg,transparent 4deg 12deg);border-radius:50%;
  -webkit-mask:radial-gradient(circle,#000 20%,transparent 70%);mask:radial-gradient(circle,#000 20%,transparent 70%)}
.hero h2{margin:6px 0 10px;font:700 28px/1.3 var(--display)}
.hero h2 .num{font-size:56px;color:var(--seed-2);vertical-align:-6px;margin:0 4px}
.eyebrow{font-size:11px;letter-spacing:.24em;color:var(--husk);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:14px 0 4px;font-size:12px;color:var(--sub)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.seg{display:inline-flex;background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:4px 12px;border-radius:9px;font-size:12px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--seed);color:#FFE7A8}
.head{width:100%;max-width:380px;aspect-ratio:1;position:relative;z-index:1}
.head .petal{transform-box:fill-box;transform-origin:50% 100%;animation:open .9s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:var(--d)}
.head .s{transform-box:fill-box;transform-origin:center;animation:pop .35s ease-out both;animation-delay:var(--d)}
.head .s:hover{stroke:#fff;stroke-width:2}
@keyframes open{from{transform:scaleY(0)}}
@keyframes pop{from{transform:scale(0)}}
.kpis{display:flex;gap:22px;margin-top:12px;flex-wrap:wrap}
.kpis div{display:flex;flex-direction:column}
.kpis b{font:700 24px/1.1 var(--num)}
.kpis small{color:var(--sub);font-size:12px}

/* 天气 */
.weather{display:flex;gap:14px;align-items:center;cursor:pointer}
.weather .sky{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(160deg,#BFE0E6,#F7EBC1);flex:none}
.weather.cloudy .sky{background:linear-gradient(160deg,#9AA7B0,#D6DCDF)}
.weather .sky svg{width:44px;height:44px}
.weather b{font:700 22px var(--display)}
.chk{display:flex;flex-direction:column;gap:2px;margin-top:10px;font-size:12px}
.chk span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--leaf);margin-right:7px;vertical-align:1px}
.chk span.x::before{background:var(--bad)}

/* 蜜蜂 */
.bees{display:flex;align-items:center;gap:14px}
.bees .hive{width:72px;height:72px;border-radius:20px;background:var(--sun-3);display:grid;place-items:center;position:relative;flex:none}
.bees .hive svg{width:40px;height:40px;color:var(--seed);animation:buzz 2.4s ease-in-out infinite}
@keyframes buzz{25%{transform:translate(2px,-3px) rotate(6deg)}75%{transform:translate(-2px,2px) rotate(-5deg)}}

/* 撒种子 */
.sow .row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line-2);background:var(--paper);border-radius:99px;padding:3px 11px;font-size:12px;font-weight:600}
.chip.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.link{display:flex;gap:6px;align-items:center;background:var(--paper-2);border:1px dashed var(--line-2);border-radius:12px;padding:8px 10px;font:12px ui-monospace,Consolas,monospace;word-break:break-all}
.link code{flex:1}
select,.inp{border:1px solid var(--line-2);background:var(--paper);border-radius:10px;padding:6px 10px;font-size:13px}
.inp{min-width:0}

/* 漏斗：生长链 */
.funnel{display:flex;align-items:stretch;gap:0;margin:6px 0 4px}
.stage{flex:1;text-align:center;padding:12px 6px 10px;border-radius:16px;background:var(--paper-2);border:1px solid var(--line);min-width:0}
.stage svg.ic{width:26px;height:26px;color:var(--leaf)}
.stage:nth-child(5) svg.ic,.stage:nth-child(7) svg.ic{color:var(--sun)}
.stage b{display:block;font:700 26px/1.1 var(--num);margin-top:4px}
.stage small{color:var(--sub);font-size:12px}
.vine{width:44px;flex:none;display:flex;align-items:center;justify-content:center;position:relative}
.vine::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed var(--leaf-2)}
.vine span{position:relative;background:var(--paper);border:1px solid var(--leaf-2);color:var(--leaf);font:700 11px/1 var(--num);padding:4px 5px;border-radius:99px}
.game-row{padding:12px 0;border-top:1px dashed var(--line)}
.game-row:first-of-type{border-top:0;padding-top:0}
.game-row h4{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between}

/* 渠道：阳光条 */
.ray{display:grid;grid-template-columns:72px 1fr 64px;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.ray .bar{height:14px;border-radius:2px 99px 99px 2px;transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.ray .v{text-align:right;color:var(--sub);font-size:12px}
@keyframes grow{from{transform:scaleX(0)}}

/* 飞轮 */
.wheel{display:grid;grid-template-columns:1fr 120px 1fr;grid-template-rows:auto 120px auto;gap:8px;align-items:center;justify-items:center;position:relative;margin-top:4px}
.wheel .core{grid-area:2/2;width:120px;height:120px;position:relative}
.wheel .core svg{width:100%;height:100%;animation:spin 60s linear infinite}
.wheel .n{background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:8px 12px;text-align:center;min-width:120px}
.wheel .n b{display:block;font:700 18px var(--num)}
.wheel .n small{font-size:11px;color:var(--sub)}
.wheel .n span{display:block;font:700 13px var(--display)}
.wheel .n1{grid-area:1/2}.wheel .n2{grid-area:2/3;justify-self:start}.wheel .n3{grid-area:3/2}.wheel .n4{grid-area:2/1;justify-self:end}
.wheel .ring{position:absolute;inset:0;pointer-events:none}

/* 看板 */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:rgba(255,251,241,.6);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:280px}
.col>header{display:flex;align-items:center;gap:8px;margin:0 2px 10px;font:700 14px var(--display)}
.col>header small{font:400 11px var(--body);color:var(--faint)}
.col>header .n{margin-left:auto;font:700 13px var(--num);color:var(--sub)}
.col>header svg.ic{width:20px;height:20px}
.tk{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:9px;box-shadow:0 6px 14px -12px rgba(92,60,18,.6);animation:rise .35s ease both}
.tk b{display:block;font-size:13px;line-height:1.45}
.tk p{margin:6px 0;font-size:12px;color:var(--sub);white-space:pre-wrap}
.tk .ft{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-top:6px}
.tk .ft .btn{margin-left:auto}
.type{font-size:11px;padding:1px 8px;border-radius:99px;font-weight:700}
.t-设计{background:#FCE3C2;color:#8A4F0B}.t-拍摄{background:#DCEBEA;color:#2D6470}.t-文案{background:var(--leaf-3);color:#3C5E2B}.t-剪辑{background:#EEDCF0;color:#6A3B72}
.t-AI{background:#FCE3C2;color:#8A4F0B}.t-数据{background:#DCEBEA;color:#2D6470}.t-内容{background:var(--leaf-3);color:#3C5E2B}
.late{color:var(--bad);font-weight:700}

/* 园丁 */
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.ag{display:flex;flex-direction:column;gap:8px}
.ag .face{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--sun-3);color:var(--seed)}
.ag .face svg.ic{width:30px;height:30px}
.ag .st{position:absolute;right:16px;top:16px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px}
.st.ok{background:var(--leaf-3);color:var(--leaf)}.st.fail{background:var(--bad-2);color:var(--bad)}.st.idle{background:#EFE8DA;color:var(--sub)}
.ag dl{display:grid;grid-template-columns:64px 1fr;gap:2px 8px;margin:0;font-size:12px}
.ag dt{color:var(--faint)}.ag dd{margin:0}
.ag .acts{display:flex;gap:6px;margin-top:auto;padding-top:6px}
.ag.add{border-style:dashed;background:transparent;box-shadow:none;align-items:center;justify-content:center;text-align:center;color:var(--sub);min-height:220px}

/* 种子包 */
.packets{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.pk{background:var(--paper);border:1px solid var(--line);border-radius:6px 6px 16px 16px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;animation:rise .4s ease both;position:relative}
.pk::before{content:"";height:10px;background:repeating-linear-gradient(90deg,var(--line-2) 0 6px,transparent 6px 10px);opacity:.7}
.pk .band{height:84px;display:grid;place-items:center;position:relative}
.pk .band svg{width:64px;height:64px}
.pk .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.pk b{font:700 14px/1.35 var(--display)}
.pk .ft{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--sub);margin-top:auto;padding-top:6px}
.stamp{position:absolute;right:10px;top:18px;font:700 11px var(--display);padding:2px 8px;border:2px solid;border-radius:6px;transform:rotate(8deg);background:rgba(255,251,241,.85)}
.stamp.ok{color:var(--leaf)}.stamp.cand{color:var(--warn);border-style:dashed}

/* 表格 */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px dashed var(--line)}
th{font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.06em}
tr:last-child td{border-bottom:0}
code{font:12px ui-monospace,Consolas,monospace;background:var(--paper-2);padding:1px 6px;border-radius:6px;border:1px solid var(--line)}
.pair{display:grid;grid-template-columns:72px 1fr;gap:4px 10px;align-items:center;margin:10px 0}
.pair .bars{display:flex;flex-direction:column;gap:3px}
.pair .bars i{display:block;height:9px;border-radius:2px 99px 99px 2px;animation:grow .8s ease both}
.roots{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.rt{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--paper-2)}
.rt b{font:700 14px var(--display)}
.ph{border:1px dashed var(--line-2);color:var(--faint)}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--seed);color:#FFE7A8;padding:10px 18px;border-radius:99px;font-weight:600;opacity:0;transition:.3s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1180px){.hero{grid-template-columns:1fr}.head{margin:auto}.c3,.c4,.c5{grid-column:span 6}.c7,.c8{grid-column:span 12}}
@media (max-width:860px){
  body{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}
  .nav{flex-direction:row;overflow-x:auto;width:100%}.nav button{grid-template-columns:20px auto auto;white-space:nowrap}.nav button .f,.nav .tag{display:none}.nav button.on::before{display:none}
  .plan{display:none}main{padding:18px 14px 60px}
  .grid{grid-template-columns:minmax(0,1fr)}.grid>*{grid-column:1/-1!important}
  .board{grid-template-columns:repeat(4,240px)}
  .hero h2{font-size:22px}.hero h2 .num{font-size:42px}
  .card{padding:16px}.vine{width:26px}.stage b{font-size:20px}.stage small{font-size:11px}
  .wheel{grid-template-columns:1fr 90px 1fr;grid-template-rows:auto 90px auto}.wheel .core{width:90px;height:90px}.wheel .n{min-width:0;padding:6px 8px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<svg width="0" height="0" style="position:absolute">

function seedhead(list,mode){
  const N=list.length,Rd=118,c=Rd/Math.sqrt(N+1),sr=Math.min(6.5,Math.max(2.4,c*.46));
  const done=list.filter(s=>s.stage!=='start').length/Math.max(1,N),L=40+56*done;
  let petals='';
  for(let l=0;l<2;l++)for(let i=0;i<34;i++){const a=i*360/34+l*180/34,len=L*(l?.82:1);
    petals+=`<g transform="rotate(${a.toFixed(2)})"><ellipse class="petal" style="--d:${(i*14+l*120)}ms" cx="0" cy="${-(Rd+len/2-8)}" rx="${l?9:11.5}" ry="${len/2}" fill="${l?'#FFD45C':'#F2A91F'}"/></g>`}
  const seeds=list.map((s,i)=>{const r=c*Math.sqrt(i+.5),t=i*2.39996;
    const fill=mode==='src'?SRC_COLOR[s.src]:STAGE_COLOR[s.stage];
    const tip=`${hm(s.ts)} · ${s.g==='fp'?'金融人格':'量化生存录'} · ${SRC_NAME[s.src]} · ${({start:'只开始',end:'已完成',poster:'生成了海报'})[s.stage]}`;
    return `<circle class="s" style="--d:${300+i*7}ms" cx="${(r*Math.cos(t)).toFixed(1)}" cy="${(r*Math.sin(t)).toFixed(1)}" r="${sr}" fill="${fill}"${mode==='stage'&&s.stage==='poster'?' stroke="#FFD45C" stroke-width="1.2"':''}><title>${esc(tip)}</title></circle>`}).join('');
  const lim=Rd+L+10;
  return `<svg class="head" viewBox="${-lim} ${-lim} ${lim*2} ${lim*2}" role="img" aria-label="今日游戏局数花盘">${petals}<circle r="${Rd+6}" fill="#4A2E18"/><circle r="${Rd+6}" fill="none" stroke="#6B4325" stroke-width="3"/>${seeds}</svg>`;
}

}

function weekField(){

    const x=50+i*83,h=26+v/max*112,y=B-h,r=9+v/max*9,last=i===6;

    return `<path d="M${x} ${B} Q ${x+(i%2?6:-6)} ${(B+y)/2} ${x} ${y}" stroke="#4F7A3A" stroke-width="3" fill="none"/>
      <ellipse cx="${x+(i%2?-9:9)}" cy="${B-h*.42}" rx="9" ry="4" fill="#8FB36B" transform="rotate(${i%2?30:-30} ${x+(i%2?-9:9)} ${B-h*.42})"/>

    <path d="M10 ${B} H ${W-10}" stroke="#DCCBA4" stroke-width="2" stroke-dasharray="2 6"/></svg>`;
}

sys(){
  const P=[['r_','量化每局',1],['e_fp_','金融人格每局',1],['lead_','咨询线索',1],['c_','计数器',1],['task_','工作流',0],['asset_','资产索引',0],['agent_','Agent 注册',0],['metric_','渠道指标',0]];
  return `<div class="grid">
    <section class="card c5"><div class="hd"><h3>${ic('root')}根系体检 <small>/api/health</small></h3><button class="btn sm" id="sim">${S.alert?'恢复晴天':'模拟乌云'}</button></div>
      <div class="roots" style="grid-template-columns:1fr">
        <div class="rt"><b>KV 存储 xl_kv</b><div class="chk"><span class="${S.alert?'x':''}">${S.alert?'无响应 · 检查项目绑定':'已绑定到 xiaoli-kingdom-web'}</span></div></div>
        <div class="rt"><b>管理员口令 ADMIN_TOKEN</b><div class="chk"><span>已配置（只存在 EdgeOne 环境变量）</span></div></div>
        <div class="rt"><b>部署</b><div class="chk"><span>main 分支自动部署</span></div></div>
      </div>
      <p class="sub">根扎得深，花才向阳：顶栏只在这里出问题时才变成乌云。</p></section>
    <section class="card c7"><div class="hd"><h3>${ic('down')}按前缀导出 <small>/api/export?prefix=</small></h3></div>
      <table><tr><th>前缀</th><th>含义</th><th>状态</th><th></th></tr>${P.map(([p,n,on])=>`<tr><td><code>${p}</code></td><td>${n}</td><td>${on?'<span class="st ok" style="padding:2px 8px;border-radius:99px;font-size:11px">在用</span>':'<span class="st idle" style="padding:2px 8px;border-radius:99px;font-size:11px">规划</span>'}</td><td>${on?`<button class="btn sm" data-toast="导出 ${p}（原型）">导出 JSON</button>`:''}</td></tr>`).join('')}</table></section>
  </div>`;
},
};

/* ================= 交互绑定 ================= */
function packets(){
  const q=S.q.trim().toLowerCase();
  const list=ASSETS.filter(a=>(S.assetType==='all'||a.type===S.assetType)&&(!q||a.t.toLowerCase().includes(q)));
  $('packets').innerHTML=list.map((a,i)=>{const [,n,c]=ASSET_TYPES.find(t=>t[0]===a.type);return `<article class="pk" style="animation-delay:${i*40}ms">
    <div class="band" style="background:linear-gradient(160deg,${c}22,${c}55)"><svg viewBox="-60 -60 120 120">${sunflower(48,13)}</svg><span class="stamp ${a.ok?'ok':'cand'}">${a.ok?'已批准':'候选'}</span></div>
    <div class="bd"><span class="type" style="background:${c}22;color:${c};align-self:flex-start">${n}</span><b>${esc(a.t)}</b><div class="ft"><span>${esc(a.by)} · ${md(a.d)}</span><span class="num">${esc(a.v)}</span></div></div></article>`}).join('')||'<div class="card sub" style="grid-column:1/-1;text-align:center">仓里还没有这颗种子</div>';
}
const BIND={
  home(){
    document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;render()});
    $('wx').onclick=()=>{S.alert=!S.alert;render();toast(S.alert?'已模拟：KV 异常':'天晴了')};
    $('game').onchange=e=>{S.game=e.target.value;$('lk').textContent=link()};
    document.querySelectorAll('#froms .chip').forEach(b=>b.onclick=()=>{S.from=b.dataset.f;$('fromIn').value='';document.querySelectorAll('#froms .chip').forEach(x=>x.classList.toggle('on',x===b));$('lk').textContent=link()});
    $('fromIn').oninput=e=>{const v=e.target.value.replace(/[^a-zA-Z0-9-]/g,'').slice(0,24);e.target.value=v;S.from=v||'wx';document.querySelectorAll('#froms .chip').forEach(x=>x.classList.toggle('on',!v&&x.dataset.f==='wx'));$('lk').textContent=link()};
    $('cp').onclick=()=>copy(link());
  },
  lead(){document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{const l=LEADS.find(x=>x.id==b.dataset.mv);l.status=b.dataset.to;render();toast(({contacted:'蜜蜂开始授粉了',closed:'结出一颗籽',spam:'已拔掉杂草'})[l.status])})},
  flow(){document.querySelectorAll('[data-tk]').forEach(b=>b.onclick=()=>{const t=TASKS.find(x=>x.id==b.dataset.tk);t.st=b.dataset.to;render();if(t.st==='done')toast('又开了一朵')})},
  asset(){
    packets();
    $('q').oninput=e=>{S.q=e.target.value;packets()};
    document.querySelectorAll('#types .chip').forEach(b=>b.onclick=()=>{S.assetType=b.dataset.ty;document.querySelectorAll('#types .chip').forEach(x=>x.classList.toggle('on',x===b));packets()});
  },
  sys(){$('sim').onclick=()=>{S.alert=!S.alert;render()}},
};
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g)return go(g.dataset.go);
  const t=e.target.closest('[data-toast]');if(t)toast(t.dataset.toast);
});
$('rf').onclick=()=>{render();toast('已刷新')};
$('out').onclick=()=>toast('原型里不会真的退出');
$('alertFix').onclick=()=>go('sys');
render();
</script>
</body>
</html>
