<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>小梨工作台 · 向阳花园（设计母版 v2）</title>
<style>
:root{
  --cream:#FBF3DF;--paper:#FFFBF1;--paper-2:#FFF5DC;--line:#EADFC4;--line-2:#DCCBA4;
  --ink:#2B2117;--sub:#7D6E58;--faint:#A89878;
  --sun:#F2A91F;--sun-2:#FFD45C;--sun-3:#FFF0B8;
  --seed:#3E2716;--seed-2:#6B4325;--husk:#A9794A;--pale:#EBCB8B;
  --leaf:#4F7A3A;--leaf-2:#8FB36B;--leaf-3:#E3EDCF;
  --sky:#DCEBEA;--bad:#C2462E;--bad-2:#FBE3DA;--warn:#D98A1C;--info:#2D6470;
  --display:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --body:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
  --num:"DIN Alternate","Bahnschrift","DIN Condensed",Georgia,sans-serif;
  --r:18px;--shadow:0 1px 0 #fff inset,0 14px 34px -22px rgba(92,60,18,.45);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font:14px/1.65 var(--body);display:grid;grid-template-columns:256px 1fr;min-height:100vh;
  background-image:radial-gradient(circle at 92% -8%,#FFE29A 0,rgba(255,226,154,0) 38%),radial-gradient(circle at 10% 110%,#E8EFD6 0,rgba(232,239,214,0) 35%)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.28;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .32 0 0 0 0 .15 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* ---------- 侧栏：茎秆 ---------- */
aside{position:sticky;top:0;height:100vh;overflow:auto;background:#2E1F12;color:#F4E6C6;padding:22px 16px 18px;display:flex;flex-direction:column;gap:18px;
  background-image:radial-gradient(circle at 50% 0,#4A3019 0,rgba(74,48,25,0) 60%)}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px}
.brand svg{width:46px;height:46px;flex:none;animation:spin 90s linear infinite}
.brand b{display:block;font:700 18px/1.2 var(--display);letter-spacing:.04em;color:#FFF3CF}
.brand small{display:block;font-size:10px;letter-spacing:.22em;color:#C9AE7C;margin-top:3px}
@keyframes spin{to{transform:rotate(360deg)}}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;color:#E6D3AC;position:relative;transition:background .2s}
.nav button:hover{background:#3C2917}
.nav button .t{font-weight:600;font-size:14px;line-height:1.25}
.nav button .f{display:block;font-size:11px;color:#A88E62;font-weight:400}
.nav button.on{background:linear-gradient(90deg,#F2A91F,#FFC94A);color:#2B1A0B}
.nav button.on .f{color:#6B4325}
.nav button.on::before{content:"";position:absolute;left:-16px;top:50%;width:10px;height:18px;margin-top:-9px;background:var(--leaf-2);border-radius:0 18px 0 18px}
.tag{font-size:10px;padding:1px 7px;border-radius:99px;border:1px solid currentColor;opacity:.75;white-space:nowrap}
.dot{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--bad);color:#fff;font:700 11px/20px var(--num);text-align:center}
.shout{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;background:#3A2715;border:1px solid #4E3720;border-radius:12px;padding:8px 12px;color:#C9AE7C;font-size:12px}
.shout:hover{background:#45301b}
.kbd{margin-left:auto;font:700 11px/1 var(--num);padding:3px 6px;border-radius:6px;background:#2E1F12;border:1px solid #5C4428;color:#E6D3AC}
.plan{margin-top:auto;background:#3A2715;border:1px solid #4E3720;border-radius:16px;padding:14px 14px 10px}
.plan h4{margin:0 0 2px;font:700 13px var(--display);color:#FFE7A8;letter-spacing:.06em}
.plan p{margin:0 0 10px;font-size:11px;color:#A88E62}
.stem{list-style:none;margin:0;padding:0 0 0 14px;position:relative}
.stem::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:linear-gradient(#8FB36B,#4F7A3A 60%,#5C4428)}
.stem li{position:relative;padding:3px 0 3px 12px;font-size:12px;color:#BFA67A;display:flex;justify-content:space-between;gap:6px}
.stem li::before{content:"";position:absolute;left:-13px;top:8px;width:10px;height:8px;border-radius:0 10px 0 10px;background:#5C4428;transform:rotate(-20deg)}
.stem li.done{color:#DCE8C4}.stem li.done::before{background:var(--leaf-2)}
.stem li.now{color:#FFE7A8;font-weight:700}
.stem li.now::before{background:var(--sun-2);border-radius:50%;width:10px;height:10px;left:-14px;top:7px;box-shadow:0 0 0 4px rgba(255,212,92,.25);animation:bud 1.8s ease-in-out infinite}
@keyframes bud{50%{box-shadow:0 0 0 8px rgba(255,212,92,0)}}
.stem li span{font-family:var(--num);opacity:.8}

/* ---------- 主区 ---------- */
main{padding:26px 34px 70px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.top h1{margin:0;font:700 30px/1.15 var(--display);letter-spacing:.02em}
.top h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--sun-2) 62%)}
.top .meta{color:var(--sub);font-size:13px;margin-top:6px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--paper);border-radius:12px;padding:7px 13px;font-weight:600;font-size:13px;transition:transform .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px -10px rgba(92,60,18,.6)}
.btn.sun{background:var(--sun);border-color:#D9930F;color:#2B1A0B}
.btn.dark{background:var(--seed);border-color:var(--seed);color:#FFE7A8}
.btn.leaf{background:var(--leaf);border-color:var(--leaf);color:#fff}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:10px}
.btn.ghost{background:transparent;border-style:dashed}
.demo{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--sun-3);color:#7A5410;border:1px dashed #E0B04A}
.alert{display:none;align-items:center;gap:12px;background:linear-gradient(90deg,#5A6670,#7B8790);color:#fff;border-radius:16px;padding:12px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.alert.show{display:flex;animation:drop .4s ease}
.alert b{font:700 15px var(--display)}
.alert .btn{margin-left:auto;background:#fff;color:var(--ink);border:0}
@keyframes drop{from{transform:translateY(-8px);opacity:0}}

.grid{display:grid;gap:16px;grid-template-columns:repeat(12,1fr)}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);position:relative;min-width:0;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.grid>.card:nth-child(2){animation-delay:.05s}.grid>.card:nth-child(3){animation-delay:.1s}.grid>.card:nth-child(4){animation-delay:.15s}.grid>.card:nth-child(5){animation-delay:.2s}.grid>.card:nth-child(6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.card h3{margin:0;font:700 16px var(--display);letter-spacing:.03em;display:flex;align-items:center;gap:8px}
.card h3 small{font:400 12px var(--body);color:var(--faint);letter-spacing:0}
.card .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sub{color:var(--sub);font-size:12px}
.big{font:700 40px/1 var(--num)}
.muted{color:var(--sub)}
.eyebrow{font-size:11px;letter-spacing:.24em;color:var(--husk);font-weight:700}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--leaf-3);color:var(--leaf)}.pill.fail{background:var(--bad-2);color:var(--bad)}.pill.idle{background:#EFE8DA;color:var(--sub)}.pill.sun{background:var(--sun-3);color:#7A5410}.pill.info{background:#DCEBEA;color:var(--info)}

/* 王国全景地图（封面页） */
.mapcard{padding:0;overflow:hidden;background:#F6EBD2}
.mapcard .hd{position:absolute;left:16px;top:14px;z-index:3;margin:0;gap:8px}
.mapcard .hd .pill{background:rgba(255,251,241,.9);border:1px solid var(--line-2);color:var(--seed-2)}
.mapwrap{position:relative;aspect-ratio:3/2;overflow:hidden;cursor:crosshair}
.mapinner{position:absolute;inset:0;transition:transform .65s cubic-bezier(.5,0,.2,1),filter .65s;will-change:transform}
.mapinner img{width:100%;height:100%;display:block;object-fit:cover;image-rendering:auto}
.mapwrap.zoom .mapinner img{image-rendering:pixelated}
.spot{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;z-index:2;transition:opacity .3s,transform .3s}
.mapwrap.zoom .spot{opacity:0;pointer-events:none}
.sign{background:#FFF8E6;border:2px solid var(--seed);border-radius:6px;padding:4px 9px 3px;box-shadow:3px 3px 0 var(--seed);font:700 12px/1.2 var(--body);display:flex;align-items:center;gap:6px;white-space:nowrap;transition:transform .15s}
.sign small{font:400 10px var(--body);color:var(--sub);display:block}
.sign .n{font:700 14px var(--num);color:var(--seed-2)}
.sign .n.bad{color:var(--bad)}
.spot:hover .sign{transform:translateY(-3px)}
.spot:hover .pin::after{animation-duration:.8s}
.pin{width:14px;height:14px;border-radius:50%;background:var(--sun);border:3px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.25);position:relative}
.pin::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--sun);animation:ping 1.8s ease-out infinite}
.pin.bad{background:var(--bad)}.pin.bad::after{border-color:var(--bad)}
@keyframes ping{from{transform:scale(.5);opacity:1}to{transform:scale(1.6);opacity:0}}
.spot.king .sign{background:var(--sun-2);border-color:var(--seed);font-size:13px}
.mapfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;font-size:12px;color:var(--sub);flex-wrap:wrap;border-top:1px solid var(--line)}
.mapfoot .kbd{margin:0;background:var(--paper-2);border-color:var(--line-2);color:var(--seed)}
.kpis-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:0;padding:0}
.kpis-strip>div{padding:14px 18px;border-right:1px dashed var(--line);display:flex;flex-direction:column;gap:2px}
.kpis-strip>div:last-child{border-right:0}
.kpis-strip b{font:700 28px/1 var(--num)}
.kpis-strip small{color:var(--sub);font-size:12px}
.kpis-strip .eyebrow{font-size:10px}

.spot.below{transform:translate(-50%,0);flex-direction:column-reverse}
.spot.below .sign{background:var(--sun-3)}

/* 产品库：货架 + 孵化线 */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.prodc{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;position:relative;box-shadow:var(--shadow);animation:rise .4s ease both}
.prodc::before{content:"";position:absolute;left:14px;right:14px;bottom:-6px;height:6px;border-radius:0 0 8px 8px;background:var(--husk);opacity:.35}
.prodc .kind{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;align-self:flex-start}
.prodc b{font:700 15px/1.35 var(--display)}
.prodc .m{font:700 22px/1 var(--num);color:var(--seed-2)}
.prodc .m small{font:400 12px var(--body);color:var(--sub);margin-left:4px}
.prodc .ft{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:auto;padding-top:6px;font-size:11px;color:var(--sub)}
.prodc .st{position:absolute;right:12px;top:12px}
.prodc.dim{background:repeating-linear-gradient(135deg,var(--paper) 0 8px,var(--paper-2) 8px 16px)}
.pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:6px}
.pipe>div{padding:10px 12px;border-left:2px dashed var(--line-2);min-height:70px}
.pipe>div:first-child{border-left:0}
.pipe h5{margin:0 0 6px;font:700 12px var(--display);color:var(--sub);letter-spacing:.1em;display:flex;justify-content:space-between}
.pipe h5 span{font-family:var(--num)}
.pipe .chip{margin:0 4px 4px 0;cursor:default}
.pipe .chip.game{border-color:#F2A91F;color:#8A4F0B;background:#FCE3C2}.pipe .chip.tool{border-color:#2D6470;color:#2D6470;background:#DCEBEA}.pipe .chip.resource{border-color:#4F7A3A;color:#3C5E2B;background:var(--leaf-3)}.pipe .chip.service{border-color:#6A3B72;color:#6A3B72;background:#EEDCF0}

/* 账号运营：四个平台卡 + 公众号 */
.accts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.acct{display:flex;flex-direction:column;gap:6px;border-top:5px solid var(--c,var(--sun))}
.acct .pf{display:flex;align-items:center;gap:10px}
.acct .pf i{width:38px;height:38px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;font:700 13px var(--display);font-style:normal;flex:none}
.acct .pf b{font:700 15px var(--display);display:block}
.acct .pf small{color:var(--sub);font-size:11px}
.acct .fans{display:flex;align-items:baseline;gap:8px}
.acct .fans b{font:700 30px/1 var(--num)}
.acct .fans span{font:700 13px var(--num);color:var(--leaf)}
.acct .fans span.down{color:var(--bad)}
.acct .row2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;font-size:11px;color:var(--sub)}
.acct .row2 b{display:block;font:700 15px var(--num);color:var(--ink)}
.acct .best{font-size:12px;background:var(--paper-2);border:1px dashed var(--line-2);border-radius:10px;padding:6px 8px}
.acct .best small{display:block;color:var(--faint);font-size:10px;letter-spacing:.1em}
.spark{width:100%;height:36px;display:block}
.cmp{display:grid;grid-template-columns:72px repeat(4,1fr);gap:6px 10px;align-items:center;font-size:12px}
.cmp>b{font-size:13px}
.cmp .cell{display:flex;flex-direction:column}
.cmp .cell b{font:700 16px/1.1 var(--num)}
.cmp .cell small{color:var(--faint);font-size:10px}
.cmp .cell i{display:block;height:5px;border-radius:99px;margin-top:3px;animation:grow .7s ease both}
.wxbox{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
.menu{display:flex;gap:6px}
.menu span{flex:1;text-align:center;background:var(--seed);color:#FFE7A8;border-radius:10px;padding:8px 6px;font-size:12px;font-weight:600}
.menu span small{display:block;font-weight:400;color:#C9AE7C;font-size:10px}

/* 场景页头：从地图上切下来的那栋建筑 */
.scenehead{display:flex;align-items:center;gap:16px;margin-bottom:16px;animation:rise .45s ease both}
.scenehead .thumb{width:84px;height:84px;border-radius:18px;border:3px solid #fff;box-shadow:0 10px 24px -14px rgba(46,31,18,.6);background-size:420%;flex:none;image-rendering:pixelated}
.scenehead h2{margin:2px 0 0;font:700 24px/1.2 var(--display)}
.scenehead p{margin:4px 0 0;color:var(--sub);font-size:13px}
.scenehead .nav2{margin-left:auto;display:flex;gap:6px;align-items:center}

/* 巡园（可交互 PPT）底栏 */
.tourbar{position:fixed;left:50%;bottom:18px;transform:translate(-50%,120%);width:min(880px,calc(100% - 24px));background:#2E1F12;color:#FFF3CF;border-radius:20px;padding:12px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;z-index:65;box-shadow:0 30px 60px -30px rgba(0,0,0,.8);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.tourbar{visibility:hidden}
.tourbar.show{transform:translate(-50%,0);visibility:visible}
.tourbar .ctl{display:flex;gap:4px}
.tourbar .ctl button{all:unset;cursor:pointer;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#3E2716;color:#FFD45C}
.tourbar .ctl button:hover{background:#5A3519}
.tourbar .say{font:500 14px/1.5 var(--display);min-width:0}
.tourbar .say small{display:block;font:700 10px var(--body);letter-spacing:.2em;color:#E0B04A;margin-bottom:2px}
.tourbar .dots{display:flex;gap:6px;align-items:center}
.tourbar .dots i{width:8px;height:8px;border-radius:50%;background:#5C4428;cursor:pointer;transition:.2s}
.tourbar .dots i.on{background:var(--sun-2);width:22px;border-radius:99px}
.tourbar .bar{position:absolute;left:16px;right:16px;bottom:4px;height:2px;background:#5C4428;border-radius:2px;overflow:hidden}
.tourbar .bar i{display:block;height:100%;background:var(--sun-2);width:0}
.tourbar.playing .bar i{animation:tourfill var(--dur,7s) linear forwards}
@keyframes tourfill{from{width:0}to{width:100%}}

/* 园长日报 + 今日三件事 */
.brief.v{grid-template-columns:1fr;gap:16px;height:100%}
.brief{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;background:linear-gradient(120deg,#3E2716,#5A3519 60%,#6B4325);color:#FFF3CF;border:0}
.brief .eyebrow{color:#E0B04A}
.brief p{margin:8px 0 0;font:500 18px/1.6 var(--display);color:#FFF3CF}
.brief p b{color:#FFD45C;font-family:var(--num);font-size:22px}
.brief .streak{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:12px;color:#E6D3AC;background:rgba(255,255,255,.08);padding:4px 10px;border-radius:99px}
.todo3{display:flex;flex-direction:column;gap:8px}
.todo3 h4{margin:0 0 2px;font:700 13px var(--display);color:#E0B04A;letter-spacing:.1em}
.todo{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:8px 10px;cursor:pointer;transition:background .2s}
.todo:hover{background:rgba(255,255,255,.14)}
.todo i{width:22px;height:22px;border-radius:50%;border:2px solid #E0B04A;display:grid;place-items:center;flex:none;font-style:normal;font:700 12px var(--num);color:#FFD45C}
.todo.done{opacity:.5}.todo.done i{background:var(--leaf-2);border-color:var(--leaf-2);color:#1d2a14}.todo.done b{text-decoration:line-through}
.todo b{display:block;font-size:13px;line-height:1.3}.todo small{color:#C9AE7C;font-size:11px}
.todo .go{margin-left:auto;color:#FFD45C;font-size:12px;white-space:nowrap}

/* hero 花盘 */
.hero{display:grid;grid-template-columns:1fr 340px;gap:10px;align-items:center;overflow:hidden;
  background:radial-gradient(circle at 78% 50%,#FFF0B8 0,rgba(255,240,184,0) 55%),var(--paper)}
.hero::after{content:"";position:absolute;right:-120px;top:-120px;width:620px;height:620px;pointer-events:none;opacity:.35;
  background:repeating-conic-gradient(from 0deg,rgba(242,169,31,.25) 0 4deg,transparent 4deg 12deg);border-radius:50%;
  -webkit-mask:radial-gradient(circle,#000 20%,transparent 70%);mask:radial-gradient(circle,#000 20%,transparent 70%)}
.hero h2{margin:6px 0 10px;font:700 26px/1.3 var(--display)}
.hero h2 .num{font-size:50px;color:var(--seed-2);vertical-align:-6px;margin:0 4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:14px 0 4px;font-size:12px;color:var(--sub)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.seg{display:inline-flex;background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:4px 12px;border-radius:9px;font-size:12px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--seed);color:#FFE7A8}
.head{width:100%;max-width:340px;aspect-ratio:1;position:relative;z-index:1}
.head .petal{transform-box:fill-box;transform-origin:50% 100%;animation:open .9s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:var(--d)}
.head .s{transform-box:fill-box;transform-origin:center;animation:pop .35s ease-out both;animation-delay:var(--d)}
.head .s:hover{stroke:#fff;stroke-width:2}
@keyframes open{from{transform:scaleY(0)}}
@keyframes pop{from{transform:scale(0)}}
.kpis{display:flex;gap:22px;margin-top:12px;flex-wrap:wrap}
.kpis div{display:flex;flex-direction:column}
.kpis b{font:700 24px/1.1 var(--num)}
.kpis small{color:var(--sub);font-size:12px}

/* 天气 / 蜜蜂 */
.weather{display:flex;gap:14px;align-items:center;cursor:pointer}
.weather .sky{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(160deg,#BFE0E6,#F7EBC1);flex:none}
.weather.cloudy .sky{background:linear-gradient(160deg,#9AA7B0,#D6DCDF)}
.weather .sky svg{width:38px;height:38px}
.weather b{font:700 20px var(--display)}
.chk{display:flex;flex-direction:column;gap:2px;margin-top:8px;font-size:12px}
.chk span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--leaf);margin-right:7px;vertical-align:1px}
.chk span.x::before{background:var(--bad)}
.bees{display:flex;align-items:center;gap:14px}
.bees .hive{width:64px;height:64px;border-radius:18px;background:var(--sun-3);display:grid;place-items:center;position:relative;flex:none}
.bees .hive svg{width:36px;height:36px;color:var(--seed);animation:buzz 2.4s ease-in-out infinite}
@keyframes buzz{25%{transform:translate(2px,-3px) rotate(6deg)}75%{transform:translate(-2px,2px) rotate(-5deg)}}

/* 撒种子 + 播种记录 */
.sow .row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line-2);background:var(--paper);border-radius:99px;padding:3px 11px;font-size:12px;font-weight:600}
.chip.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.link{display:flex;gap:6px;align-items:center;background:var(--paper-2);border:1px dashed var(--line-2);border-radius:12px;padding:8px 10px;font:12px ui-monospace,Consolas,monospace;word-break:break-all}
.link code{flex:1;background:none;border:0;padding:0}
select,.inp{border:1px solid var(--line-2);background:var(--paper);border-radius:10px;padding:6px 10px;font-size:13px}
.inp{min-width:0}
.sows{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.sowrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:12px}
.sowrow .when{font-family:var(--num);color:var(--sub)}
.sowrow .eff{display:flex;align-items:center;gap:6px}
.sowrow .eff b{font:700 16px var(--num);color:var(--leaf)}
.sprouts{display:inline-flex;gap:2px}
.sprouts i{width:5px;height:12px;border-radius:3px 3px 0 0;background:var(--leaf-2);display:inline-block;transform-origin:bottom;animation:grow-y .5s ease both}
@keyframes grow-y{from{transform:scaleY(0)}}

/* 漏斗 */
.funnel{display:flex;align-items:stretch;gap:0;margin:6px 0 4px}
.stage{flex:1;text-align:center;padding:12px 6px 10px;border-radius:16px;background:var(--paper-2);border:1px solid var(--line);min-width:0}
.stage svg.ic{width:26px;height:26px;color:var(--leaf)}
.stage:nth-child(5) svg.ic,.stage:nth-child(7) svg.ic{color:var(--sun)}
.stage b{display:block;font:700 26px/1.1 var(--num);margin-top:4px}
.stage small{color:var(--sub);font-size:12px}
.vine{width:44px;flex:none;display:flex;align-items:center;justify-content:center;position:relative}
.vine::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed var(--leaf-2)}
.vine span{position:relative;background:var(--paper);border:1px solid var(--leaf-2);color:var(--leaf);font:700 11px/1 var(--num);padding:4px 5px;border-radius:99px}
.game-row{padding:12px 0;border-top:1px dashed var(--line)}
.game-row:first-of-type{border-top:0;padding-top:0}
.game-row h4{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between}

/* 渠道条 */
.ray{display:grid;grid-template-columns:72px 1fr 64px;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.ray .bar{height:14px;border-radius:2px 99px 99px 2px;transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.ray .v{text-align:right;color:var(--sub);font-size:12px}
@keyframes grow{from{transform:scaleX(0)}}

/* 素材结籽 */
.insights{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ins{background:var(--paper-2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.ins::after{content:"";position:absolute;right:-18px;bottom:-18px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,rgba(242,169,31,.25),transparent 70%)}
.ins .n{font:700 30px/1 var(--num);color:var(--seed-2)}
.ins p{margin:0;font-size:13px;line-height:1.5}
.ins .ft{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:4px}
.ins.saved{border-color:var(--leaf-2);background:#F3F7EA}

/* 飞轮 */
.wheel{display:grid;grid-template-columns:1fr 110px 1fr;grid-template-rows:auto 110px auto;gap:8px;align-items:center;justify-items:center;position:relative;margin-top:4px}
.wheel .core{grid-area:2/2;width:110px;height:110px;position:relative}
.wheel .core svg{width:100%;height:100%;animation:spin 60s linear infinite}
.wheel .n{background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:8px 12px;text-align:center;min-width:120px}
.wheel .n b{display:block;font:700 18px var(--num)}
.wheel .n small{font-size:11px;color:var(--sub)}
.wheel .n span{display:block;font:700 13px var(--display)}
.wheel .n1{grid-area:1/2}.wheel .n2{grid-area:2/3;justify-self:start}.wheel .n3{grid-area:3/2}.wheel .n4{grid-area:2/1;justify-self:end}
.wheel .ring{position:absolute;inset:0;pointer-events:none}

/* 花期：时间线 + 流程 */
.timeline{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px}
.ep{flex:1;min-width:150px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 10px 10px;text-align:center;cursor:pointer;transition:transform .15s,border-color .15s;position:relative}
.ep:hover{transform:translateY(-2px)}
.ep.on{border-color:var(--sun);box-shadow:0 0 0 3px var(--sun-3)}
.ep svg{width:84px;height:84px;display:block;margin:0 auto 4px}
.ep b{display:block;font:700 13px/1.35 var(--display)}
.ep small{color:var(--sub);font-size:11px;display:block}
.ep .pill{position:absolute;top:8px;right:8px}
.steps{display:flex;align-items:center;gap:0;margin:6px 0 4px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint)}
.step i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line-2);display:inline-block;background:var(--paper)}
.step.done{color:var(--leaf)}.step.done i{background:var(--leaf-2);border-color:var(--leaf-2)}
.step.now{color:var(--seed);font-weight:700}.step.now i{background:var(--sun-2);border-color:var(--sun);box-shadow:0 0 0 3px var(--sun-3)}
.step+.step::before{content:"";width:22px;height:2px;background:var(--line);margin:0 6px}
.step.done+.step::before{background:var(--leaf-2)}
.mini{display:flex;flex-direction:column;gap:6px}
.mini .it{display:flex;align-items:center;gap:8px;font-size:13px;padding:7px 10px;background:var(--paper-2);border:1px solid var(--line);border-radius:12px}
.mini .it .pill{margin-left:auto}
.harvest{display:grid;grid-template-columns:68px 1fr auto;gap:6px 10px;align-items:center;font-size:12px}
.harvest i{display:block;height:9px;border-radius:2px 99px 99px 2px;animation:grow .8s ease both}

/* 看板 */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:rgba(255,251,241,.6);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:280px}
.col>header{display:flex;align-items:center;gap:8px;margin:0 2px 10px;font:700 14px var(--display)}
.col>header small{font:400 11px var(--body);color:var(--faint)}
.col>header .n{margin-left:auto;font:700 13px var(--num);color:var(--sub)}
.col>header svg.ic{width:20px;height:20px}
.tk{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:9px;box-shadow:0 6px 14px -12px rgba(92,60,18,.6);animation:rise .35s ease both}
.tk b{display:block;font-size:13px;line-height:1.45}
.tk p{margin:6px 0;font-size:12px;color:var(--sub);white-space:pre-wrap}
.tk .ft{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-top:6px}
.tk .ft .btn{margin-left:auto}
.type{font-size:11px;padding:1px 8px;border-radius:99px;font-weight:700;white-space:nowrap;flex:none}
.t-设计{background:#FCE3C2;color:#8A4F0B}.t-拍摄{background:#DCEBEA;color:#2D6470}.t-文案{background:var(--leaf-3);color:#3C5E2B}.t-剪辑{background:#EEDCF0;color:#6A3B72}.t-运营{background:#F0EBDD;color:#6B4325}
.t-AI{background:#FCE3C2;color:#8A4F0B}.t-数据{background:#DCEBEA;color:#2D6470}.t-内容{background:var(--leaf-3);color:#3C5E2B}
.late{color:var(--bad);font-weight:700}
.epmark{font-size:11px;color:var(--husk);font-weight:700}

/* 园丁 */
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.ag{display:flex;flex-direction:column;gap:8px}
.ag .face{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--sun-3);color:var(--seed)}
.ag .face svg.ic{width:30px;height:30px}
.ag .st{position:absolute;right:16px;top:16px}
.ag dl{display:grid;grid-template-columns:64px 1fr;gap:2px 8px;margin:0;font-size:12px}
.ag dt{color:var(--faint)}.ag dd{margin:0}
.ag .acts{display:flex;gap:6px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.ag.add{border-style:dashed;background:transparent;box-shadow:none;align-items:center;justify-content:center;text-align:center;color:var(--sub);min-height:220px}

/* 种子包 */
.packets{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.pk{background:var(--paper);border:1px solid var(--line);border-radius:6px 6px 16px 16px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;animation:rise .4s ease both;position:relative;cursor:pointer;transition:transform .15s}
.pk:hover{transform:translateY(-2px)}
.pk::before{content:"";height:10px;background:repeating-linear-gradient(90deg,var(--line-2) 0 6px,transparent 6px 10px);opacity:.7}
.pk .band{height:84px;display:grid;place-items:center;position:relative}
.pk .band svg{width:64px;height:64px}
.pk .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.pk b{font:700 14px/1.35 var(--display)}
.pk .lin{font-size:11px;color:var(--sub);display:flex;flex-direction:column;gap:1px}
.pk .lin span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--leaf-2);margin-right:6px;vertical-align:1px}
.pk .ft{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--sub);margin-top:auto;padding-top:6px}
.stamp{position:absolute;right:10px;top:18px;font:700 11px var(--display);padding:2px 8px;border:2px solid;border-radius:6px;transform:rotate(8deg);background:rgba(255,251,241,.85)}
.stamp.ok{color:var(--leaf)}.stamp.cand{color:var(--warn);border-style:dashed}

/* 谱系 */
.lineage{list-style:none;margin:0;padding:0 0 0 18px;position:relative}
.lineage::before{content:"";position:absolute;left:5px;top:10px;bottom:10px;width:2px;background:linear-gradient(var(--leaf-2),var(--sun),var(--seed-2))}
.lineage li{position:relative;padding:4px 0 14px 12px}
.lineage li::before{content:"";position:absolute;left:-18px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:3px solid var(--leaf-2)}
.lineage li.me::before{border-color:var(--sun);background:var(--sun-2)}
.lineage li.next::before{border-color:var(--seed-2)}
.lineage li small{display:block;color:var(--faint);font-size:11px;letter-spacing:.1em}
.lineage li b{font:700 14px var(--display)}

/* 表格 */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px dashed var(--line)}
th{font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.06em}
tr:last-child td{border-bottom:0}
code{font:12px ui-monospace,Consolas,monospace;background:var(--paper-2);padding:1px 6px;border-radius:6px;border:1px solid var(--line)}
.roots{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.rt{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--paper-2)}
.rt b{font:700 14px var(--display)}
.ph{border:1px dashed var(--line-2);color:var(--faint)}

/* 抽屉 / 喊一声 / toast */
.scrim{position:fixed;inset:0;background:rgba(46,31,18,.35);backdrop-filter:blur(2px);z-index:70;display:none}
.scrim.show{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--paper);z-index:71;box-shadow:-20px 0 50px -30px rgba(46,31,18,.6);padding:24px 26px;overflow:auto;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.drawer.show{transform:none}
.drawer h2{margin:0 0 4px;font:700 22px var(--display)}
.drawer .x{position:absolute;right:16px;top:16px}
.drawer textarea{width:100%;min-height:260px;border:1px solid var(--line-2);border-radius:12px;padding:12px;background:var(--paper-2);font:12.5px/1.6 ui-monospace,Consolas,monospace;resize:vertical}
.drawer label{display:block;font-size:12px;color:var(--sub);margin:14px 0 4px}
.drawer .opt{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;cursor:pointer;background:var(--paper-2)}
.drawer .opt.on{border-color:var(--leaf);background:#F3F7EA}
.drawer .opt input{accent-color:var(--leaf)}
.palette{position:fixed;left:50%;top:14vh;transform:translate(-50%,-10px);width:min(620px,92vw);background:var(--paper);border:1px solid var(--line-2);border-radius:20px;box-shadow:0 30px 80px -30px rgba(46,31,18,.7);z-index:72;display:none;overflow:hidden}
.palette.show{display:block;animation:palin .2s ease forwards}
@keyframes palin{to{transform:translate(-50%,0)}}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 20px;font:16px var(--body);background:transparent;outline:0}
.palette ul{list-style:none;margin:0;padding:8px;max-height:50vh;overflow:auto}
.palette li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;cursor:pointer;font-size:13px}
.palette li:hover,.palette li.on{background:var(--sun-3)}
.palette li .k{font-size:11px;color:var(--faint);min-width:40px}
.palette li .go{margin-left:auto;color:var(--faint);font-size:11px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--seed);color:#FFE7A8;padding:10px 18px;border-radius:99px;font-weight:600;opacity:0;transition:.3s;z-index:80;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1180px){.hero{grid-template-columns:1fr}.head{margin:auto}.brief{grid-template-columns:1fr}.c3,.c4,.c5{grid-column:span 6}.c7,.c8,.c9{grid-column:span 12}}
@media (max-width:860px){
  body{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}
  .nav{flex-direction:row;overflow-x:auto;width:100%}.nav button{grid-template-columns:20px auto auto;white-space:nowrap}.nav button .f,.nav .tag{display:none}.nav button.on::before{display:none}
  .plan,.shout{display:none}main{padding:18px 14px 60px}
  .grid{grid-template-columns:minmax(0,1fr)}.grid>*{grid-column:1/-1!important}
  .board{grid-template-columns:repeat(4,240px)}
  .hero h2{font-size:22px}.hero h2 .num{font-size:42px}
  .card{padding:16px}.vine{width:26px}.stage b{font-size:20px}.stage small{font-size:11px}
  .wheel{grid-template-columns:1fr 90px 1fr;grid-template-rows:auto 90px auto}.wheel .core{width:90px;height:90px}.wheel .n{min-width:0;padding:6px 8px}
  .brief p{font-size:16px}
  .accts{grid-template-columns:1fr 1fr}.pipe{grid-template-columns:1fr 1fr}.pipe>div:nth-child(3){border-left:0}.cmp{grid-template-columns:60px repeat(2,1fr)}.cmp .hide{display:none}.wxbox{grid-template-columns:1fr}
  .kpis-strip{grid-template-columns:repeat(2,1fr)}.kpis-strip>div{border-bottom:1px dashed var(--line)}.kpis-strip b{font-size:22px}
  .scenehead{flex-wrap:wrap}.scenehead .nav2{margin-left:0;width:100%;flex-wrap:wrap}
  .sign small{display:none}.sign{font-size:11px;padding:3px 7px 2px}
  .tourbar{grid-template-columns:1fr;gap:8px}.tourbar .dots{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

  const pipe=['idea','building','beta','live'].map(st=>`<div><h5>${PSTATE[st][0]}<span>${PRODUCTS.filter(p=>p.st===st).length}</span></h5>${PRODUCTS.filter(p=>p.st===st).map(p=>`<span class="chip ${p.kind}">${esc(p.n.length>10?p.n.slice(0,10)+'…':p.n)}</span>`).join('')}</div>`).join('');
  return `<div class="grid">

      <div class="hd"><h3>${ic('bag')}产品货架 <small>游戏、工具、资料、服务都算产品</small></h3>
        <span class="tools" id="pk"><button class="chip ${S.prodKind==='all'?'on':''}" data-pk="all">全部 ${PRODUCTS.length}</button>${Object.entries(KINDS).map(([k,[n]])=>`<button class="chip ${S.prodKind===k?'on':''}" data-pk="${k}">${n} ${PRODUCTS.filter(p=>p.kind===k).length}</button>`).join('')}<button class="btn sm sun" data-toast="新建产品（原型）：名称 · 类型 · 状态 · 负责人 · 链接 · 是否接统计">${ic('plus')}上一个新产品</button></span></div>

      <div class="pipe">${pipe}</div>
    </section>
    <section class="card c12" style="padding:10px 20px"><div class="eyebrow">游戏厅 · 详情</div></section>

};

/* ================= 抽屉：谱系 / 任务单 / 盛开前结籽 ================= */
function openDrawer(html){$('drawer').innerHTML=`<button class="btn sm x" id="dx">${ic('x')}关闭</button>`+html;$('drawer').classList.add('show');$('scrim').classList.add('show');$('dx').onclick=closeDrawer}
function closeDrawer(){$('drawer').classList.remove('show');$('scrim').classList.remove('show')}
function lineage(id){
  const a=assetOf(id);if(!a)return;const [,tn,c]=ASSET_TYPES.find(t=>t[0]===a.type);
  const used=(a.used||[]).map(u=>u==='lead'?{n:'咨询线索回复',s:'每条新线索的首轮回复都从这里出'}:(()=>{const e=epOf(u);return e?{n:`第 ${e.n} 期 · ${e.title}`,s:e.pub?`${(Object.values(e.metrics).reduce((s,m)=>s+m[0],0)/1e4).toFixed(1)} 万播放 · ${e.games} 局 · ${e.leads} 条咨询`:STAGE_META[e.stage][1],ep:e.id}:{n:u,s:''}})());
  openDrawer(`<div class="eyebrow">一颗种子的一生</div><h2>${esc(a.t)}</h2>
    <div style="display:flex;gap:6px;align-items:center;margin:6px 0 18px"><span class="type" style="background:${c}22;color:${c}">${tn}</span><span class="pill ${a.ok?'ok':'sun'}">${a.ok?'已批准':'候选'}</span><span class="sub">${esc(a.by)} · ${md(a.d)} · ${esc(a.v)}</span></div>
    <ul class="lineage">
      <li><small>来自</small><b>${esc(a.from)}</b>${a.ep?`<div class="sub">产自${epName(a.ep)}</div>`:''}</li>
      <li class="me"><small>这颗种子</small><b>${esc(a.t)}</b><div class="sub">${a.ok?'已批准，可以放心复用。':'还是候选。按交接原则，批准前不要当成定稿用。'}</div></li>
      ${used.length?used.map(u=>`<li class="next"><small>用在</small><b${u.ep?` data-go="ep" data-ep="${u.ep}" style="cursor:pointer;text-decoration:underline dotted"`:''}>${esc(u.n)}</b><div class="sub">${esc(u.s)}</div></li>`).join(''):'<li class="next"><small>用在</small><b class="sub" style="font-weight:400">还没被用过，等下一期来取。</b></li>'}
    </ul>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">${a.ok?'':`<button class="btn sm leaf" data-approve="${a.id}">盖章批准</button>`}<button class="btn sm" data-toast="已复制资产 id ${a.id}" data-copy="${a.id}">${ic('copy')}复制 id</button><button class="btn sm" data-toast="外链打开（原型）">打开文件</button></div>`);
}
function orderSheet(epId,agentId){
  const e=epOf(epId)||EPISODES[3];const a=AGENTS.find(x=>x.id===agentId)||AGENTS[1];
  const brand=ASSETS.filter(x=>x.type==='brand'&&x.ok),ins=ASSETS.filter(x=>x.type==='insights'&&((x.used||[]).includes(e.id)||x.ep===e.id));
  const text=`【任务单 · ${a.n}】
期数：第 ${e.n} 期《${e.title}》 · 当前阶段：${STEPS[Math.min(e.step,6)]}
目标：${a.d}
必须遵守：
${brand.map(b=>`  - ${b.t}（资产 ${b.id}，${b.v}）`).join('\n')}
  - 品牌色 向日葵黄 #F2A91F / 葵籽棕 #3E2716 / 叶绿 #4F7A3A
可用素材：
${ins.length?ins.map(i=>`  - ${i.t}（资产 ${i.id}）`).join('\n'):'  - （这期还没有结籽素材，去产品数据页先结几颗）'}
产出回写：资产库 type=${a.id==='cover'?'covers':a.id==='cutter'?'videos':'scripts'}，状态=候选，挂到 ${e.id}
完成标准：候选 ≥ 2 版；每版附一句话说明；不含真实用户信息
触发人：Brian · ${new Date().toLocaleString('zh-CN',{hour12:false})}`;
  openDrawer(`<div class="eyebrow">给园丁下任务单</div><h2>${a.n} · 第 ${e.n} 期</h2><p class="sub">任务单自动带上这期的上下文、必须遵守的品牌资产和可用素材。复制后粘给 Cursor / Codex，或由 HTTP 触发。</p>
    <label>任务单</label><textarea id="orderText">${esc(text)}</textarea>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn sun" id="orderCopy">${ic('copy')}复制任务单</button>${a.how==='HTTP'?`<button class="btn dark" data-toast="已触发（原型）· 运行记录会出现在浇水日志">${ic('play')}直接触发</button>`:''}<button class="btn" data-toast="已记录到浇水日志（原型）">记为「已下单」</button></div>`);
  $('orderCopy').onclick=()=>copy($('orderText').value,'任务单已复制，粘给园丁吧');
}
function bloomGate(taskId){
  const t=TASKS.find(x=>x.id==taskId);const cands=ASSETS.filter(a=>!t.ep||a.ep===t.ep||!a.ep).slice(0,6);
  let choice='new';
  openDrawer(`<div class="eyebrow">盛开前先结籽</div><h2>${esc(t.t)}</h2><p class="sub">这个任务的产出是什么？挂上资产，以后别人（和下一期的你）才找得到。</p>
    <label>选择产出</label>
    <div class="opt on" data-c="new"><input type="radio" name="c" checked><div><b>登记一颗新种子</b><div class="sub">写进 asset_，状态=候选，挂到 ${epName(t.ep)}</div></div></div>
    <input class="inp" id="newAsset" style="width:100%;margin:0 0 6px" value="${esc(t.t)}">
    ${cands.map(a=>`<div class="opt" data-c="${a.id}"><input type="radio" name="c"><div><b>${esc(a.t)}</b><div class="sub">已有 · ${a.ok?'已批准':'候选'} · ${esc(a.by)}</div></div></div>`).join('')}
    <div class="opt" data-c="none"><input type="radio" name="c"><div><b>这个任务没有产出</b><div class="sub">例如沟通、复盘；请写一句说明</div></div></div>
    <input class="inp" id="noneWhy" style="width:100%" placeholder="为什么没有产出">
    <div style="display:flex;gap:8px;margin-top:16px"><button class="btn leaf" id="bloomOk">${ic('flower')}盛开</button><button class="btn" id="bloomNo">再想想</button></div>`);
  document.querySelectorAll('.drawer .opt').forEach(o=>o.onclick=()=>{choice=o.dataset.c;document.querySelectorAll('.drawer .opt').forEach(x=>{x.classList.toggle('on',x===o);x.querySelector('input').checked=x===o})});
  $('bloomNo').onclick=closeDrawer;
  $('bloomOk').onclick=()=>{
    if(choice==='new'){const id='a'+(20+ASSETS.length);const map={设计:'covers',剪辑:'videos',文案:'scripts',拍摄:'videos',运营:'decisions'};ASSETS.unshift({id,t:$('newAsset').value||t.t,type:map[t.type]||'scripts',ok:false,v:'v1',by:t.who,d:Date.now(),ep:t.ep,from:`任务 #${t.id}`,used:[]});t.out=id}
    else if(choice==='none'){if(!$('noneWhy').value.trim()){toast('写一句为什么没有产出');return}t.note=$('noneWhy').value}
    else t.out=choice;
    t.st='done';closeDrawer();render();toast(choice==='none'?'已盛开（无产出）':'又开了一朵，种子已入仓');
  };
}

/* ================= 喊一声 ================= */
function palette(open){
  const p=$('palette');if(!open){p.classList.remove('show');$('scrim').classList.remove('show');return}
  p.classList.add('show');$('scrim').classList.add('show');$('palIn').value='';palList('');$('palIn').focus();
}
function palItems(q){
  q=q.trim().toLowerCase();const hit=s=>!q||String(s).toLowerCase().includes(q);
  const acts=[{k:'动作',t:'复制当前发群链接',run:()=>copy(link(),'已复制，去群里撒种子吧')},{k:'动作',t:'记一次播种',run:()=>{SOWS.unshift({ts:Date.now(),game:S.game,from:S.from,note:'手动记录'});go('home');toast('已记录这次播种')}},{k:'动作',t:'给封面园丁下任务单',run:()=>orderSheet(S.ep,'cover')},{k:'动作',t:'去结籽（素材）',run:()=>go('prod')},{k:'动作',t:'打开系统 · 根系',run:()=>go('sys')}].filter(a=>hit(a.t));
  const eps=EPISODES.filter(e=>hit(`第${e.n}期 ${e.title}`)).map(e=>({k:'花期',t:`第 ${e.n} 期 · ${e.title}`,run:()=>go('ep',{ep:e.id})}));
  const prods=PRODUCTS.filter(p=>hit(p.n+p.desc)).map(p=>({k:'产品',t:`${p.n} · ${PSTATE[p.st][0]}`,run:()=>{S.prodKind='all';go('prod')}}));
  const accts=ACCOUNTS.filter(a=>hit(a.name+a.handle)).map(a=>({k:'账号',t:`${a.name} · ${a.fans.toLocaleString()} 粉`,run:()=>go('channel')}));
  const tasks=TASKS.filter(t=>hit(t.t+t.who)).map(t=>({k:'任务',t:`${t.t} · ${t.who}`,run:()=>{S.epFilter='all';go('flow')}}));
  const assets=ASSETS.filter(a=>hit(a.t)).map(a=>({k:'资产',t:a.t,run:()=>lineage(a.id)}));
  const leads=LEADS.filter(l=>l.status!=='spam'&&hit(l.need+l.topic)).map(l=>({k:'线索',t:`${l.topic} · ${l.need.slice(0,28)}…`,run:()=>go('lead')}));
  return[...acts,...eps,...prods,...accts,...tasks,...assets,...leads].slice(0,12);
}
let PAL=[];
function palList(q){PAL=palItems(q);$('palList').innerHTML=PAL.map((it,i)=>`<li class="${i===0?'on':''}" data-i="${i}"><span class="k">${it.k}</span>${esc(it.t)}<span class="go">↵</span></li>`).join('')||'<li class="sub">没找到这颗种子</li>';document.querySelectorAll('#palList li[data-i]').forEach(li=>li.onclick=()=>{palette(false);PAL[li.dataset.i].run()})}
$('palIn').oninput=e=>palList(e.target.value);
$('palIn').onkeydown=e=>{if(e.key==='Enter'&&PAL[0]){palette(false);PAL[0].run()}if(e.key==='Escape')palette(false)};
$('shout').onclick=()=>palette(true);
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase(),typing=['input','textarea','select'].includes(tag);
  if(e.key==='/'&&!typing){e.preventDefault();palette(true);return}
  if(e.key==='Escape'){if($('palette').classList.contains('show')||$('drawer').classList.contains('show')){palette(false);closeDrawer()}else if(TOUR.on)tourStart(false);else if(S.tab!=='home')go('home');return}
  if(typing||$('palette').classList.contains('show'))return;
  if(e.key==='ArrowRight'){e.preventDefault();step(1)}
  if(e.key==='ArrowLeft'){e.preventDefault();step(-1)}
  if(e.key===' '&&TOUR.on){e.preventDefault();tourPlay(!TOUR.playing)}
});
$('scrim').onclick=()=>{palette(false);closeDrawer()};

/* ================= 交互绑定 ================= */
function packets(){
  const q=S.q.trim().toLowerCase();
  const list=ASSETS.filter(a=>(S.assetType==='all'||a.type===S.assetType)&&(!q||a.t.toLowerCase().includes(q)));
  $('packets').innerHTML=list.map((a,i)=>{const [,n,c]=ASSET_TYPES.find(t=>t[0]===a.type);return `<article class="pk" style="animation-delay:${i*40}ms" data-asset="${a.id}">
    <div class="band" style="background:linear-gradient(160deg,${c}22,${c}55)"><svg viewBox="-60 -60 120 120">${sunflower(48,13)}</svg>${stamp(a)}</div>
    <div class="bd"><span class="type" style="background:${c}22;color:${c};align-self:flex-start">${n}</span><b>${esc(a.t)}</b>
      <div class="lin"><span>来自 ${esc(a.from)}</span><span>${(a.used||[]).length?'用在 '+(a.used||[]).map(u=>u==='lead'?'咨询回复':epName(u)).join('、'):'还没被用过'}</span></div>
      <div class="ft"><span>${esc(a.by)} · ${md(a.d)}</span><span class="num">${esc(a.v)}</span></div></div></article>`}).join('')||'<div class="card sub" style="grid-column:1/-1;text-align:center">仓里还没有这颗种子</div>';
}
const BIND={
  home(){
    document.querySelectorAll('[data-zoom]').forEach(el=>el.onclick=e=>{e.stopPropagation();zoomTo(el.dataset.zoom)});
    $('tour').onclick=()=>tourStart(true);
    $('wx').onclick=()=>{S.alert=!S.alert;render();toast(S.alert?'已模拟：KV 异常':'天晴了')};
    $('game').onchange=e=>{S.game=e.target.value;$('lk').textContent=link()};
    document.querySelectorAll('#froms .chip').forEach(b=>b.onclick=()=>{S.from=b.dataset.f;$('fromIn').value='';document.querySelectorAll('#froms .chip').forEach(x=>x.classList.toggle('on',x===b));$('lk').textContent=link()});
    $('fromIn').oninput=e=>{const v=e.target.value.replace(/[^a-zA-Z0-9-]/g,'').slice(0,24);e.target.value=v;S.from=v||'wx';document.querySelectorAll('#froms .chip').forEach(x=>x.classList.toggle('on',!v&&x.dataset.f==='wx'));$('lk').textContent=link()};
    $('cp').onclick=()=>copy(link(),'已复制，去群里撒种子吧');
    $('sowNow').onclick=()=>{SOWS.unshift({ts:Date.now(),game:S.game,from:S.from,note:'刚刚发出'});render();toast('记下了。24 小时内发芽数会自动长出来')};
    document.querySelectorAll('[data-todo]').forEach(el=>el.querySelector('i').onclick=e=>{e.stopPropagation();const id=el.dataset.todo;S.doneTodo.has(id)?S.doneTodo.delete(id):S.doneTodo.add(id);render()});
  },
  ep(){document.querySelectorAll('.ep[data-ep]').forEach(el=>el.onclick=()=>{S.ep=el.dataset.ep;go('ep')})},
  channel(){},
  prod(){document.querySelectorAll('#pk .chip').forEach(b=>b.onclick=()=>{S.prodKind=b.dataset.pk;render()});document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;render()});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{const i=insights().find(x=>x.id===b.dataset.save);SAVED.add(i.id);ASSETS.unshift({id:'a'+(20+ASSETS.length),t:i.t,type:'insights',ok:false,v:'快照 '+md(NOW),by:'游戏数据',d:Date.now(),ep:'ep3',from:'今日游戏数据快照',used:[]});render();toast('结籽成功，已存进资产库（候选）')})},
  lead(){
    document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{const l=LEADS.find(x=>x.id==b.dataset.mv);l.status=b.dataset.to;if(l.status==='closed'&&!l.amount){l.note=l.note||'结案'}render();toast(({contacted:'蜜蜂开始授粉了',closed:'结出一颗籽',spam:'已拔掉杂草'})[l.status])});
    document.querySelectorAll('[data-tpl]').forEach(b=>b.onclick=()=>{const l=LEADS.find(x=>x.id==b.dataset.tpl);copy(`你好，我是小梨团队。看到你提到「${l.need}」。\n\n我们先确认两点：1）目前的流程是怎么做的；2）希望达到的结果是什么。方便的话约 20 分钟聊一下。\n\n（模板来自资产 a07 · 咨询首轮回复模板）`,'回复草稿已复制（模板 a07）')});
  },
  flow(){
    document.querySelectorAll('#epf .chip').forEach(b=>b.onclick=()=>{S.epFilter=b.dataset.ef;render()});
    document.querySelectorAll('[data-tk]').forEach(b=>b.onclick=()=>{const t=TASKS.find(x=>x.id==b.dataset.tk);if(b.dataset.to==='done')return bloomGate(t.id);t.st=b.dataset.to;render()});
  },
  asset(){
    packets();
    $('q').oninput=e=>{S.q=e.target.value;packets()};
    document.querySelectorAll('#types .chip').forEach(b=>b.onclick=()=>{S.assetType=b.dataset.ty;document.querySelectorAll('#types .chip').forEach(x=>x.classList.toggle('on',x===b));packets()});
  },
  sys(){$('sim').onclick=()=>{S.alert=!S.alert;render()}},
};
document.addEventListener('click',e=>{
  const ap=e.target.closest('[data-approve]');if(ap){const a=assetOf(ap.dataset.approve);a.ok=true;closeDrawer();render();toast('已盖章批准');return}
  const as=e.target.closest('[data-asset]');if(as&&!e.target.closest('[data-go]')){lineage(as.dataset.asset);return}
  const od=e.target.closest('[data-order]');if(od){orderSheet(od.dataset.order,od.dataset.agent);return}
  const g=e.target.closest('[data-go]');if(g){closeDrawer();return go(g.dataset.go,g.dataset.ep?{ep:g.dataset.ep}:null)}
  const c=e.target.closest('[data-copy]');if(c){copy(c.dataset.copy,c.dataset.toast||'已复制');return}
  const t=e.target.closest('[data-toast]');if(t)toast(t.dataset.toast);
});
$('rf').onclick=()=>{render();toast('已刷新')};
$('out').onclick=()=>toast('原型里不会真的退出');
$('alertFix').onclick=()=>go('sys');
render();
</script>
</body>
</html>
