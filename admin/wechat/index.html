<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小梨的信 · 微信实录</title><style>body{font:15px/1.8 system-ui;background:#faf7ee;color:#493f2c;max-width:850px;margin:40px auto;padding:20px}a{color:#647146}section{background:#fffdf7;padding:24px;border:1px solid #e6dfcf;border-radius:12px;margin:20px 0}label{display:block;margin:14px 0}input,textarea,button{font:inherit;padding:10px;box-sizing:border-box}input,textarea{display:block;width:100%;border:1px solid #d8ceb8;border-radius:5px}button{background:#687448;color:white;border:0;border-radius:6px;cursor:pointer}button:disabled{opacity:.5}small{color:#8a7d63}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;border-bottom:1px solid #eee4cf;padding:8px;word-break:break-word}.scroll{overflow:auto}#status{white-space:pre-wrap}h1{font-weight:500}</style>
<a href="/admin/">← 回到工作台</a><h1>向日葵 · 小梨的信</h1><p>微信实录：只显示手工录入并从服务器读回的数据。</p><section id="login"><form id="loginForm"><label>工作台管理员口令<input id="token" type="password" autocomplete="current-password" required></label><button>连接已有工作台</button></form><small>沿用工作台口令，不需要微信 AppSecret。口令仅通过请求头发送。</small></section><section id="editor" hidden><form id="metrics"><label>记录日期<input id="day" type="date" required></label><label>当前粉丝数<input id="fans" type="number" min="0" max="999999999" step="1" required></label><label>这篇信当前阅读数<input id="reads" type="number" min="0" max="999999999" step="1" required></label><label>本周实际发信数<input id="posts" type="number" min="0" max="99" step="1" required></label><label>信件标题／备注<textarea id="note" maxlength="1000" required></textarea></label><small>同一天保存一笔。日期已有记录时会先载入，保存会更新该日记录。阅读数是所记文章的快照，不会自动累加。</small><p><button id="save">保存并读回确认</button> <button id="refresh" type="button">刷新记录</button> <button id="logout" type="button">退出</button></p></form></section><p id="status" role="status" aria-live="polite">尚未连接服务器</p><section><h2>已保存记录</h2><div class="scroll"><table><thead><tr><th>日期</th><th>粉丝</th><th>文章阅读</th><th>本周发信</th><th>标题／备注</th></tr></thead><tbody id="rows"></tbody></table></div></section><p><small>游戏来源另在原始记录中核验 src=wx。此页不自动获取微信关注或阅读，不将游戏点击等同于关注。</small></p><script src="wechat.js"></script></html>
