<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>剪辑工作室 · 小梨工作台</title>
<style>
:root{
  --cream:#FBF3DF;--paper:#FFFBF1;--paper-2:#FFF5DC;--line:#EADFC4;--line-2:#DCCBA4;
  --ink:#2B2117;--sub:#7D6E58;--faint:#A89878;
  --sun:#F2A91F;--sun-2:#FFD45C;--sun-3:#FFF0B8;--seed:#3E2716;
  --leaf:#4F7A3A;--leaf-2:#8FB36B;--leaf-3:#E3EDCF;--bad:#C2462E;--bad-2:#FBE3DA;--info:#2D6470;
  --display:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --body:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
  --num:"DIN Alternate","Bahnschrift",Georgia,sans-serif;
  --r:16px;--shadow:0 1px 0 #fff inset,0 14px 34px -22px rgba(92,60,18,.45);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font:14px/1.65 var(--body);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:#2E1F12;color:#F4E6C6;display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
header b{font:700 17px/1.2 var(--display);letter-spacing:.04em;color:#FFF3CF}
header a.back{font-size:13px;color:#C9AE7C;text-decoration:none}
header .st{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:#3C2917;color:#E6D3AC;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:#8a7a60}.chip.ok i{background:var(--leaf-2)}.chip.bad i{background:#E07A5F}
nav.tabs{display:flex;gap:4px;padding:12px 20px 0;max-width:1180px;margin:0 auto;overflow-x:auto}
nav.tabs button{all:unset;cursor:pointer;padding:8px 16px;border-radius:12px 12px 0 0;color:var(--sub);font-weight:600;white-space:nowrap}
nav.tabs button.on{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
main{max-width:1180px;margin:0 auto;padding:0 20px 60px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:0 var(--r) var(--r) var(--r);padding:18px;box-shadow:var(--shadow)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
h2{font:700 18px/1.3 var(--display);margin:0 0 12px}
h3{font:700 15px/1.3 var(--display);margin:18px 0 8px}
.sub{color:var(--sub);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:#fff;border-radius:10px;padding:7px 14px;cursor:pointer;font-weight:600;text-decoration:none;font-size:13px}
.btn:hover{background:var(--paper-2)}.btn.sun{background:linear-gradient(90deg,#F2A91F,#FFC94A);border-color:#E29A12;color:#2B1A0B}
.btn.leaf{background:var(--leaf);border-color:var(--leaf);color:#fff}.btn.ghost{background:none}.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.f{display:block;margin:0 0 12px;font-size:13px;color:var(--sub)}
label.f>input,label.f>select,label.f>textarea{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--line-2);border-radius:10px;background:#fff;color:var(--ink)}
textarea{resize:vertical}
.cb{display:inline-flex;gap:6px;align-items:center;margin-right:14px;font-size:13px}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--sun-3);color:#7a5200}
.pill.done{background:var(--leaf-3);color:var(--leaf)}.pill.failed,.pill.canceled{background:var(--bad-2);color:var(--bad)}.pill.running{background:#DCEBEA;color:var(--info)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf-2),var(--leaf));transition:width .4s}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--sub);font-weight:600}
pre.log{background:#2E1F12;color:#EBDDBE;font:12px/1.5 ui-monospace,Consolas,monospace;padding:12px;border-radius:12px;max-height:420px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.detail{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
video{width:100%;border-radius:12px;background:#000;aspect-ratio:16/9}
.scene{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:#fff}
.scene.cur{border-color:var(--sun);box-shadow:0 0 0 2px var(--sun-3)}
.scene .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.scene input.t{width:70px;padding:3px 6px;border:1px solid var(--line-2);border-radius:8px}
.scene textarea{width:100%;margin-top:6px;font:12px/1.5 ui-monospace,Consolas,monospace;border:1px solid var(--line-2);border-radius:8px;padding:6px}
.tl{position:relative;height:34px;background:var(--paper-2);border-radius:8px;margin:8px 0;cursor:pointer;overflow:hidden}
.tl i{position:absolute;top:4px;bottom:4px;border-radius:5px;background:var(--leaf-2);opacity:.85}
.tl i.kw{background:var(--sun)}.tl i.ins{background:#8DB4BA}.tl b{position:absolute;top:0;bottom:0;width:2px;background:var(--bad)}
.drop{border:2px dashed var(--line-2);border-radius:14px;padding:20px;text-align:center;color:var(--sub);cursor:pointer;background:#fff}
.drop.on{border-color:var(--sun);background:var(--sun-3)}
.empty{padding:30px;text-align:center;color:var(--faint)}
#gate{position:fixed;inset:0;background:rgba(46,31,18,.6);display:flex;align-items:center;justify-content:center;z-index:20}
#gate[hidden]{display:none}
#gate .card{width:min(380px,92vw);padding:22px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2E1F12;color:#FFF3CF;padding:9px 18px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
#toast.on{opacity:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}.kv span:nth-child(odd){color:var(--sub)}
@media (max-width:820px){.detail{grid-template-columns:1fr}header{padding:10px 14px}main,nav.tabs{padding-left:12px;padding-right:12px}.panel{padding:14px}}
</style>
</head>
<body>
<header>
  <a class="back" href="/admin/">← 小梨工作台</a>
  <b>剪辑工作室</b>
  <span class="st" id="st"></span>
</header>
<nav class="tabs" id="tabs"></nav>
<main><div class="panel" id="view"><div class="empty">加载中…</div></div></main>
<div id="gate" hidden><form class="card" id="gateForm"><h2>工作台口令</h2><p class="sub" id="gateMsg">和小梨工作台用同一个口令。</p><label class="f">口令<input id="gateTok" type="password" autocomplete="current-password" required></label><button class="btn sun">进入</button></form></div>
<div id="toast"></div>
<script>
'use strict';
const API='/api/studio';
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOKEN='';try{TOKEN=localStorage.getItem('xl_admin')||''}catch(e){}
const S={tab:'eps',state:null,ep:null,epData:null,epDirty:false,job:null,timer:null,cur:-1};
const TYPE_N={make_episode:'新建一期',replan:'重做画面',render:'渲染成片',cover:'封面',blender:'3D',research:'竞品分析',broll:'B-roll',sync:'同步本机'};
const ST_N={queued:'排队',running:'进行中',canceling:'取消中',done:'完成',failed:'失败',canceled:'已取消'};
const STAGE_N={processing:'处理中',plan:'待改画面',rendered:'已出片'};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)}
function ago(ts){if(!ts)return'';const s=(Date.now()-ts)/1000;return s<60?'刚刚':s<3600?Math.round(s/60)+' 分钟前':s<86400?Math.round(s/3600)+' 小时前':new Date(ts).toLocaleDateString()}
async function call(body,q=''){
  const r=await fetch(API+q,{method:body?'POST':'GET',headers:{'x-admin-token':TOKEN,'content-type':'application/json'},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({ok:false,err:'http_'+r.status}));
  if(r.status===403){gate(true,'口令不对或已过期');throw new Error('auth')}
  if(!d.ok)throw new Error(d.err||'error');return d;
}
async function signed(method,key,expires){return (await call({a:'sign',method,key,expires})).url}
async function getText(key){const u=await signed('GET',key,600);const r=await fetch(u);if(r.status===404)return null;if(!r.ok)throw new Error('cos_'+r.status);return r.text()}
function putFile(key,blob,onp){return signed('PUT',key,6*3600).then((u)=>new Promise((res,rej)=>{
  const x=new XMLHttpRequest();x.open('PUT',u);if(blob.type)x.setRequestHeader('Content-Type',blob.type);
  x.upload.onprogress=(e)=>onp&&e.lengthComputable&&onp(e.loaded/e.total);
  x.onload=()=>x.status<300?res():rej(new Error('上传失败 '+x.status));x.onerror=()=>rej(new Error('网络中断（检查 COS 跨域设置）'));x.send(blob)}))}
function gate(on,msg){$('gate').hidden=!on;if(msg)$('gateMsg').textContent=msg;if(on)$('gateTok').focus()}
$('gateForm').onsubmit=(e)=>{e.preventDefault();TOKEN=$('gateTok').value.trim();try{localStorage.setItem('xl_admin',TOKEN)}catch(x){}gate(false);load()};

const TABS=[['eps','片子'],['new','新建一期'],['jobs','任务'],['tools','3D · 竞品 · 素材'],['help','怎么用']];
function tabs(){$('tabs').innerHTML=TABS.map(([k,n])=>`<button data-k="${k}" class="${S.tab===k?'on':''}">${n}</button>`).join('');
  document.querySelectorAll('#tabs button').forEach((b)=>b.onclick=()=>go(b.dataset.k))}
function go(tab,ep){if(S.epDirty&&!confirm('画面计划还没保存，确定离开？'))return;S.tab=tab;S.ep=ep||null;S.epData=null;S.epDirty=false;S.job=null;
  try{history.replaceState(null,'','#'+tab+(ep?'/'+ep:''))}catch(e){}tabs();render()}

function status(){const s=S.state;if(!s)return;
  const wk=s.workers.filter((w)=>w.online);
  $('st').innerHTML=`<span class="chip ${s.cos?'ok':'bad'}"><i></i>COS ${s.cos?'已接入':'未配置'}</span>`+
    `<span class="chip ${wk.length?'ok':'bad'}"><i></i>${wk.length?wk.map((w)=>esc(w.name)+(w.busy?' 忙':' 空闲')).join(' · '):'没有在线的电脑'}</span>`}

async function load(){
  if(!TOKEN){gate(true);return}
  try{S.state=await call(null,'?a=state');status();render(true)}catch(e){if(e.message!=='auth')$('view').innerHTML=`<div class="empty">读取失败：${esc(e.message)}</div>`}
}
function poll(){clearInterval(S.timer);S.timer=setInterval(async()=>{if(document.hidden||!TOKEN)return;
  try{S.state=await call(null,'?a=state');status();if(S.tab==='jobs'||S.tab==='eps'&&!S.ep)render(true);if(S.job)showJob(S.job,true)}catch(e){}},5000)}

function render(soft){
  const v=$('view');
  if(!S.state){v.innerHTML='<div class="empty">加载中…</div>';return}
  if(S.tab==='eps')return S.ep?(soft?jobStrip():epDetail()):epList();
  if(S.tab==='new'){if(!soft)newForm();return}
  if(S.tab==='jobs'){if(S.job)return;return jobList()}
  if(S.tab==='tools'){if(!soft)tools();return}
  if(S.tab==='help'&&!soft)help();
}

/* ---------- 片子 ---------- */
function epJobs(id){return S.state.jobs.filter((j)=>j.ep===id)}
function epList(){
  const eps=S.state.episodes.slice().sort((a,b)=>(b.ts_up||0)-(a.ts_up||0));
  $('view').innerHTML=`<div class="row" style="margin-bottom:12px"><h2 style="margin:0">片子</h2><span class="sub">${eps.length} 期</span><span style="margin-left:auto"></span><button class="btn" id="syncAll">把电脑上已有的片子同步上来</button><button class="btn sun" onclick="go('new')">新建一期</button></div>`+
  (eps.length?`<div class="grid">${eps.map((e)=>{const s=e.studio||{};const run=epJobs(e.id).find((j)=>['queued','running','canceling'].includes(j.status));
    return `<div class="card" style="cursor:pointer" data-ep="${esc(e.id)}"><div class="row"><b>${esc(e.title)}</b><span class="pill ${s.stage==='rendered'?'done':''}">${STAGE_N[s.stage]||s.stage||'—'}</span></div>
    <div class="sub">${esc(e.id)} · ${s.duration?s.duration+' 秒':''} ${s.scenes?'· '+s.scenes+' 个画面':''} ${s.locked?'· 已锁定':''}</div>
    ${run?`<div class="sub">${TYPE_N[run.type]} · ${esc(run.msg)}</div><div class="bar"><i style="width:${run.pct||0}%"></i></div>`:`<div class="sub">${ago(e.ts_up)}更新</div>`}</div>`}).join('')}</div>`
  :`<div class="empty">还没有片子。点「新建一期」上传口播，或者先把电脑上已有的同步上来。</div>`);
  document.querySelectorAll('[data-ep]').forEach((c)=>c.onclick=()=>go('eps',c.dataset.ep));
  $('syncAll').onclick=()=>newJob('sync','',{});
}
async function newJob(type,ep,params){try{const d=await call({a:'job',type,ep,params});toast(`已排队：${TYPE_N[type]}${S.state.workers.some((w)=>w.online)?'':'（电脑没在线，开机后会自动接着做）'}`);S.state.jobs.unshift(d.job);return d.job}catch(e){if(e.message!=='auth')toast('建任务失败：'+e.message)}}

function jobStrip(){const el=$('epJobs');if(!el)return;const js=epJobs(S.ep).slice(0,4);
  el.innerHTML=js.map((j)=>`<div class="row" style="margin:4px 0;cursor:pointer" data-job="${j.id}"><span class="pill ${j.status}">${ST_N[j.status]}</span><span>${TYPE_N[j.type]}</span><span class="sub">${esc(j.msg)} · ${ago(j.ts)}</span>${['queued','running'].includes(j.status)?`<div class="bar" style="flex:1;min-width:80px;margin:0"><i style="width:${j.pct||0}%"></i></div>`:''}</div>`).join('')||'<span class="sub">还没有任务</span>';
  el.querySelectorAll('[data-job]').forEach((r)=>r.onclick=()=>{S.tab='jobs';tabs();showJob(r.dataset.job)});
  const st=S.state.episodes.find((e)=>e.id===S.ep);if(st&&S.lastStage!==JSON.stringify(st.studio)){const first=S.lastStage===undefined;S.lastStage=JSON.stringify(st.studio);if(!first&&!S.epDirty)epDetail()}
}

async function epDetail(){
  const id=S.ep;const e=S.state.episodes.find((x)=>x.id===id)||{id,title:id,studio:{}};const s=e.studio||{};S.lastStage=JSON.stringify(s);
  $('view').innerHTML=`<div class="row" style="margin-bottom:12px"><button class="btn ghost" onclick="go('eps')">← 片子</button><h2 style="margin:0">${esc(e.title)}</h2><span class="pill">${STAGE_N[s.stage]||'—'}</span></div>
  <div class="detail"><div>
    <div class="row" style="margin-bottom:6px"><span class="sub">看：</span><button class="btn" data-v="aroll">粗剪</button>${s.final?'<button class="btn" data-v="final">成片</button>':''}${s.cover?'<a class="btn" id="coverLink" target="_blank">封面</a>':''}</div>
    <video id="vid" controls playsinline preload="metadata"></video>
    <div class="tl" id="tl" title="点一下跳到这里"></div>
    <div class="row"><button class="btn sun" id="bRender">渲染成片</button><button class="btn" id="bCover">出封面</button><button class="btn" id="bReplan">按稿子重做画面</button></div>
    <h3>任务</h3><div id="epJobs"></div>
    <h3>自动删掉了什么（先过一眼）</h3><pre class="log" id="removed" style="max-height:220px">读取中…</pre>
    <h3>下载</h3><div class="row" id="dl"></div>
  </div><div>
    <div class="row"><h3 style="margin:0">画面计划</h3><span class="sub" id="planInfo"></span><span style="margin-left:auto"></span><label class="cb"><input type="checkbox" id="lock">锁定（重做画面时不覆盖）</label><button class="btn leaf" id="bSave" disabled>保存</button></div>
    <p class="sub" style="margin:4px 0 8px">改时间、文字或 JSON 后点保存，写回 COS；之后「渲染成片」就用这一版。「设为当前」把出现时间对齐到播放头。</p>
    <div id="plan"><div class="empty">读取中…</div></div>
  </div></div>`;
  jobStrip();
  const vid=$('vid');
  const play=async(which)=>{try{vid.src=await signed('GET',which==='final'?s.final:`ep/${id}/aroll.mp4`,6*3600)}catch(x){toast('视频链接失败：'+x.message)}};
  document.querySelectorAll('[data-v]').forEach((b)=>b.onclick=()=>play(b.dataset.v));play(s.final?'final':'aroll');
  if(s.cover)signed('GET',s.cover,3600).then((u)=>{$('coverLink').href=u}).catch(()=>{});
  $('bRender').onclick=async()=>{if(S.epDirty&&!(await savePlan()))return;newJob('render',id,{}).then(jobStrip)};
  $('bCover').onclick=async()=>{const t=prompt('封面大字（≤10 字）',e.title.slice(0,10));if(t==null)return;const sub=prompt('封面小字（英文小标）','XIAOLI')||'XIAOLI';
    const at=vid.currentTime||3;if(S.epDirty&&!(await savePlan()))return;newJob('cover',id,{title:t,sub,at:+at.toFixed(2)}).then(jobStrip)};
  $('bReplan').onclick=()=>{if(S.epData&&S.epData._locked){toast('画面计划已锁定，先取消锁定');return}if(confirm('按 raw/ 里的稿子重新生成画面计划？手改的内容会被覆盖（会先备份）。'))newJob('replan',id,{script:`raw/${id}/script.md`}).then(jobStrip)};
  vid.ontimeupdate=()=>{const t=vid.currentTime;const b=$('tl').querySelector('b');if(b&&S.epData)b.style.left=(t/(S.epData.duration||1)*100)+'%';
    const p=(S.epData&&S.epData.plan)||[];const i=p.findIndex((x)=>t>=+x.at&&t<+x.at+(+x.dur||0));if(i!==S.cur){S.cur=i;document.querySelectorAll('.scene').forEach((el,k)=>el.classList.toggle('cur',k===i))}};
  $('tl').onclick=(ev)=>{if(!S.epData)return;const r=$('tl').getBoundingClientRect();vid.currentTime=(ev.clientX-r.left)/r.width*(S.epData.duration||0)};
  getText(`ep/${id}/work/exports/removed.txt`).then((t)=>{$('removed').textContent=t||'（没有记录：可能是从演示片同步来的）'}).catch((x)=>{$('removed').textContent='读取失败：'+x.message});
  const dl=[['剪映字幕 cut.srt',`ep/${id}/work/exports/cut.srt`],['达芬奇时间线 timeline.fcpxml',`ep/${id}/work/exports/timeline.fcpxml`],['episode.json',`ep/${id}/episode.json`]].concat(s.final?[['成片 final.mp4',s.final]]:[]);
  $('dl').innerHTML=dl.map(([n,k])=>`<button class="btn" data-dl="${esc(k)}">${esc(n)}</button>`).join('');
  $('dl').querySelectorAll('[data-dl]').forEach((b)=>b.onclick=async()=>{try{window.open(await signed('GET',b.dataset.dl,3600),'_blank')}catch(x){toast(x.message)}});
  try{const t=await getText(`ep/${id}/episode.json`);if(S.ep!==id)return;if(!t){$('plan').innerHTML='<div class="empty">COS 上还没有 episode.json（任务做完会自动出现）</div>';return}
    S.epData=JSON.parse(t);drawPlan()}catch(x){$('plan').innerHTML=`<div class="empty">读取失败：${esc(x.message)}</div>`}
  $('bSave').onclick=savePlan;
}
function sceneText(sc){const o=Object.assign({},sc);delete o.at;delete o.dur;delete o.type;return JSON.stringify(o)}
function sceneLabel(sc){return [sc.text||sc.title||sc.zh||sc.label||sc.caption||sc.src||sc.act||'',sc.value!=null?sc.value+(sc.suffix||''):''].filter(Boolean).join(' · ')}
const KIND=(t)=>/keyword|quote|number/.test(t)?'kw':/broll|chapter|pip|3d/.test(t)?'ins':'';
function drawPlan(){const d=S.epData,p=d.plan||[];
  $('planInfo').textContent=`${p.length} 个 · ${(+d.duration||0).toFixed(1)} 秒`;$('lock').checked=!!d._locked;
  $('lock').onchange=()=>{d._locked=$('lock').checked;dirty()};
  const dur=+d.duration||1;
  $('tl').innerHTML=p.map((x)=>`<i class="${KIND(x.type)}" style="left:${(+x.at||0)/dur*100}%;width:${Math.max(.4,(+x.dur||0)/dur*100)}%" title="${esc(x.type)} ${esc(sceneLabel(x))}"></i>`).join('')+'<b style="left:0"></b>';
  $('plan').innerHTML=p.map((x,i)=>`<div class="scene" data-i="${i}"><div class="hd"><b>${i+1}</b><span class="pill">${esc(x.type)}</span>
    <span class="sub">从</span><input class="t num" data-f="at" value="${(+x.at||0).toFixed(2)}"><span class="sub">秒，持续</span><input class="t num" data-f="dur" value="${(+x.dur||0).toFixed(1)}">
    <button class="btn ghost" data-a="now">设为当前</button><button class="btn ghost" data-a="seek">看</button><button class="btn ghost danger" data-a="del">删</button></div>
    <div class="sub">${esc(sceneLabel(x)).slice(0,60)}</div><textarea rows="2" data-f="json">${esc(sceneText(x))}</textarea></div>`).join('')||'<div class="empty">没有画面</div>';
  $('plan').querySelectorAll('.scene').forEach((el)=>{const i=+el.dataset.i;
    el.querySelectorAll('input.t').forEach((inp)=>inp.onchange=()=>{const v=parseFloat(inp.value);if(isNaN(v))return;p[i][inp.dataset.f]=Math.max(0,+v.toFixed(3));dirty();drawPlan()});
    el.querySelector('textarea').onchange=(ev)=>{try{const o=JSON.parse(ev.target.value);const keep={type:p[i].type,at:p[i].at,dur:p[i].dur};p[i]=Object.assign(keep,o);ev.target.style.borderColor='';dirty();el.querySelector('.sub').textContent=sceneLabel(p[i]).slice(0,60)}catch(x){ev.target.style.borderColor='var(--bad)';toast('JSON 格式不对')}};
    el.querySelectorAll('[data-a]').forEach((b)=>b.onclick=()=>{const v=$('vid');
      if(b.dataset.a==='seek')v.currentTime=+p[i].at||0;
      if(b.dataset.a==='now'){p[i].at=+v.currentTime.toFixed(2);dirty();drawPlan()}
      if(b.dataset.a==='del'&&confirm('删掉这个画面？')){p.splice(i,1);dirty();drawPlan()}})});
}
function dirty(){S.epDirty=true;$('bSave').disabled=false;$('bSave').textContent='保存*'}
async function savePlan(){const d=S.epData;if(!d)return false;const b=$('bSave');b.disabled=true;b.textContent='保存中…';
  try{(d.plan||[]).sort((a,b)=>(+a.at||0)-(+b.at||0));const bak=`assets/history/${S.ep}/episode-${new Date().toISOString().replace(/[:.]/g,'-')}.json`;
    const old=await getText(`ep/${S.ep}/episode.json`);if(old)await putFile(bak,new Blob([old],{type:'application/json'}));
    await putFile(`ep/${S.ep}/episode.json`,new Blob([JSON.stringify(d,null,1)],{type:'application/json'}));
    await call({a:'ep',id:S.ep,studio:{scenes:(d.plan||[]).length,locked:!!d._locked,edited:Date.now()}});
    S.epDirty=false;b.textContent='已保存';toast('已保存到 COS（旧版本已备份）');drawPlan();return true}
  catch(x){b.disabled=false;b.textContent='保存';if(x.message!=='auth')toast('保存失败：'+x.message);return false}}

/* ---------- 新建一期 ---------- */
function newForm(){
  $('view').innerHTML=`<h2>新建一期</h2><p class="sub">上传口播原片和稿子 → 电脑上的 worker 自动转写、去口癖和重录、抠像、按稿子标记排画面 → 回到「片子」里改画面、渲染。</p>
  <div class="detail"><form id="nf">
    <label class="f">这一期的名字（英文 / 数字，做文件夹名）<input id="nName" required pattern="[A-Za-z0-9_\\-]{2,40}" placeholder="ep05"></label>
    <label class="f">标题<input id="nTitle" maxlength="60" placeholder="量化不是玄学"></label>
    <div class="drop" id="drop">把口播视频拖到这里，或点一下选择<br><small id="dropName">支持 mp4 / mov，几 GB 也可以（直传腾讯云，不经过网站）</small><input type="file" id="nVideo" accept="video/*" hidden></div>
    <label class="f" style="margin-top:12px">稿子（带画面标记，可以直接粘贴；也可选 .md 文件）<textarea id="nScript" rows="8" placeholder="**爆点关键词**  > 金句  【数字 50 家|标签|批注】  【小窗 标题|要点】…"></textarea></label>
    <input type="file" id="nScriptFile" accept=".md,.txt"><br><br>
    <div><label class="cb"><input type="checkbox" id="oNatural">节奏自然一点（默认紧凑）</label><label class="cb"><input type="checkbox" id="oRetake">保留重录</label><label class="cb"><input type="checkbox" id="oMatte">不抠像（快）</label><label class="cb"><input type="checkbox" id="oCap">不要字幕</label></div><br>
    <button class="btn sun" id="nGo">上传并开始</button> <span class="sub" id="nMsg"></span><div class="bar" id="nBar" hidden><i style="width:0"></i></div>
  </form><div class="card"><h3 style="margin-top:0">稿子标记速查</h3><table>
    ${[['**关键词**','侧边大字 + 字幕高亮'],['> 金句','金句卡'],['【数字 50 家|标签|批注】','大数字 + 红圈'],['【折线 1,1.1,1.3|标题|示意】','折线图'],['【排行 A:12,B:3|标题|单位】','横向排行'],['【清单 标题|一|二|三】','清单卡'],['【小窗 标题|要点…】','人缩进圆形小窗'],['【素材 broll/x.mp4 光圈|说明】','B-roll + 蒙版'],['【章节 02 标题】','章节条'],['【3D 3d/名字 帧数】','Blender 序列'],['后缀 @左 @右 @身后 @整屏 ~4s','位置 / 时长']].map(([a,b])=>`<tr><td><code>${esc(a)}</code></td><td>${b}</td></tr>`).join('')}</table>
    <p class="sub">示意数据必须写「示意」，真实数据写「来源:xx」。每 6–10 秒一个视觉重点。</p></div></div>`;
  let file=null;const drop=$('drop'),inp=$('nVideo');
  const pick=(f)=>{if(!f)return;file=f;$('dropName').textContent=`${f.name} · ${(f.size/1048576).toFixed(0)} MB`};
  drop.onclick=()=>inp.click();inp.onchange=()=>pick(inp.files[0]);
  drop.ondragover=(e)=>{e.preventDefault();drop.classList.add('on')};drop.ondragleave=()=>drop.classList.remove('on');
  drop.ondrop=(e)=>{e.preventDefault();drop.classList.remove('on');pick(e.dataTransfer.files[0])};
  $('nScriptFile').onchange=async(e)=>{const f=e.target.files[0];if(f)$('nScript').value=await f.text()};
  $('nf').onsubmit=async(e)=>{e.preventDefault();if(!S.state.cos){toast('COS 还没配置好');return}if(!file){toast('先选口播视频');return}
    const ep=$('nName').value.trim(),go_=$('nGo'),bar=$('nBar'),msg=$('nMsg');
    if(S.state.episodes.some((x)=>x.id===ep)&&!confirm(`已经有 ${ep} 了，重新处理会覆盖，继续？`))return;
    go_.disabled=true;bar.hidden=false;
    try{const ext=(file.name.match(/\.\w+$/)||['.mp4'])[0].toLowerCase();const vkey=`raw/${ep}/source${ext}`;
      const script=$('nScript').value.trim();
      if(script){msg.textContent='上传稿子…';await putFile(`raw/${ep}/script.md`,new Blob([script],{type:'text/markdown'}))}
      msg.textContent='上传视频…';const t0=Date.now();
      await putFile(vkey,file,(p)=>{bar.firstChild.style.width=(p*100)+'%';const sp=p*file.size/1048576/((Date.now()-t0)/1000);msg.textContent=`上传视频 ${(p*100).toFixed(0)}% · ${sp.toFixed(1)} MB/s`});
      const title=$('nTitle').value.trim();
      await call({a:'ep',id:ep,studio:{title:title||ep,stage:'processing',raw:vkey}});
      await newJob('make_episode',ep,{video:vkey,size:file.size,script:script?`raw/${ep}/script.md`:'',title,style:$('oNatural').checked?'natural':'tight',keepRetakes:$('oRetake').checked,noMatte:$('oMatte').checked,noCaptions:$('oCap').checked});
      S.state=await call(null,'?a=state');go('eps',ep)}
    catch(x){go_.disabled=false;if(x.message!=='auth')msg.textContent='失败：'+x.message}};
}

/* ---------- 任务 ---------- */
function jobList(){const js=S.state.jobs;
  $('view').innerHTML=`<h2>任务</h2><div style="overflow:auto"><table><tr><th>状态</th><th>类型</th><th>片子</th><th>进度</th><th>机器</th><th>时间</th></tr>
  ${js.map((j)=>`<tr style="cursor:pointer" data-job="${j.id}"><td><span class="pill ${j.status}">${ST_N[j.status]||j.status}</span></td><td>${TYPE_N[j.type]||j.type}</td><td>${esc(j.ep||'')}</td><td style="min-width:160px">${esc(j.msg||'')}${['queued','running','canceling'].includes(j.status)?`<div class="bar"><i style="width:${j.pct||0}%"></i></div>`:''}</td><td>${esc(j.worker||'')}</td><td class="sub">${ago(j.ts)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">没有任务</td></tr>'}</table></div>`;
  document.querySelectorAll('[data-job]').forEach((r)=>r.onclick=()=>showJob(r.dataset.job))}
async function showJob(id,soft){S.job=id;
  try{const d=await call(null,'?a=job&id='+encodeURIComponent(id));if(S.job!==id)return;const j=d.job;
    const pre=$('jobLog');const atBottom=pre&&pre.scrollTop+pre.clientHeight>=pre.scrollHeight-20;
    if(soft&&pre){pre.textContent=d.log||'（还没有日志）';$('jobHd').innerHTML=jobHd(j);if(atBottom)pre.scrollTop=pre.scrollHeight;bindCancel(j);return}
    $('view').innerHTML=`<div class="row" style="margin-bottom:10px"><button class="btn ghost" id="jBack">← 任务</button><h2 style="margin:0">${TYPE_N[j.type]||j.type} ${esc(j.ep||'')}</h2></div>
      <div id="jobHd">${jobHd(j)}</div><pre class="log" id="jobLog">${esc(d.log||'（还没有日志）')}</pre>
      <details><summary class="sub">参数和结果</summary><pre class="log">${esc(JSON.stringify({params:j.params,result:j.result},null,1))}</pre></details>`;
    $('jBack').onclick=()=>{S.job=null;jobList()};const p=$('jobLog');p.scrollTop=p.scrollHeight;bindCancel(j)}
  catch(x){if(x.message!=='auth')toast(x.message)}}
function jobHd(j){return `<div class="row"><span class="pill ${j.status}">${ST_N[j.status]||j.status}</span><span>${esc(j.msg||'')}</span><span class="sub">${j.worker?'机器 '+esc(j.worker)+' · ':''}${ago(j.ts)}建</span>
  ${['queued','running'].includes(j.status)?'<button class="btn danger" id="jCancel">取消</button>':''}${j.ep?`<button class="btn" onclick="go('eps','${esc(j.ep)}')">去这一期</button>`:''}</div><div class="bar" style="margin:8px 0 12px"><i style="width:${j.pct||0}%"></i></div>`}
function bindCancel(j){const b=$('jCancel');if(b)b.onclick=async()=>{if(!confirm('取消这个任务？'))return;await call({a:'cancel',id:j.id});toast('已发出取消');showJob(j.id,true)}}

/* ---------- 工具 ---------- */

  <form class="card" id="t3d"><h3 style="margin-top:0">Blender 3D</h3>
    <label class="f">类型<select id="b3kind"><option value="title">3D 立体标题</option><option value="bars">3D 柱状图</option></select></label>
    <label class="f">名字（英文，稿子里写【3D 3d/名字】）<input id="b3name" required pattern="[A-Za-z0-9_\\-]{2,40}" placeholder="aum"></label>

  const k=$('b3kind');k.onchange=()=>{const b=k.value==='bars';$('b3textL').hidden=b;$('b3dataL').hidden=!b;$('b3unitL').hidden=!b};
  $('t3d').onsubmit=(e)=>{e.preventDefault();const bars=k.value==='bars';newJob('blender','',{kind:k.value,name:$('b3name').value.trim(),text:$('b3text').value,data:$('b3data').value,unit:$('b3unit').value,still:$('b3still').checked?20:0})};
  $('tres').onsubmit=(e)=>{e.preventDefault();newJob('research','',{source:$('rsrc').value,query:$('rq').value.trim(),name:$('rname').value.trim(),limit:+$('rlim').value,hooks:$('rhooks').checked})};
  $('tbr').onsubmit=(e)=>{e.preventDefault();newJob('broll','',{query:$('bq').value.trim(),n:+$('bn').value})};

  $('rlist').innerHTML=done.length?'<b>已出的报告</b>'+done.map((j)=>`<div class="row">${j.result.keys.map((kk)=>`<button type="button" class="btn ghost" data-k="${esc(kk)}">${esc(kk.split('/').slice(-2).join('/'))}</button>`).join('')}</div>`).join(''):'';

try{const h=location.hash.slice(1).split('/');if(TABS.some(([k])=>k===h[0]))S.tab=h[0];if(h[0]==='eps'&&h[1])S.ep=decodeURIComponent(h[1])}catch(e){}
window.addEventListener('beforeunload',(e)=>{if(S.epDirty){e.preventDefault();e.returnValue=''}});
