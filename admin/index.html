<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>小梨工作台</title>
<style>
:root{--bg:#F6EFE4;--card:#fff;--ink:#1A1D24;--sub:#6B6558;--line:#E4DDCD;--gold:#C99A3E;--ok:#2E7D4F;--bad:#B23B3B;--warn:#B7791F}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:22px;margin:0}.sub{color:var(--sub);font-size:12px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 16px}
nav button,.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit;color:inherit}
nav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h3{margin:0 0 6px;font-size:14px;color:var(--sub);font-weight:600}
.big{font-size:28px;font-weight:700}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid currentColor}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#FBF8F2;font-weight:600;font-size:12px;color:var(--sub)}
td.need{white-space:pre-wrap;max-width:420px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.hbar{display:flex;align-items:center;gap:8px;margin:4px 0}.hbar b{width:52px;font-family:ui-monospace,Consolas,monospace}.hbar i{display:block;height:12px;background:var(--gold);border-radius:3px}
.login{max-width:360px;margin:12vh auto;display:flex;flex-direction:column;gap:10px}
.login input{padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit}
.muted{color:var(--sub)}.empty{padding:24px;text-align:center;color:var(--sub)}
iframe{width:100%;height:80vh;border:1px solid var(--line);border-radius:12px;background:#fff}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=ms=>ms?new Date(ms).toLocaleString('zh-CN',{hour12:false}):'';
let TOKEN='',TAB='home',CACHE={};
try{const h=new URLSearchParams(location.hash.slice(1));TOKEN=h.get('t')||localStorage.getItem('xl_admin')||''}catch(e){}
if(location.hash)history.replaceState(null,'',location.pathname);

const TABS=[
  ['home','总览'],['fp','金融里，你是什么登？'],['quant','量化基金生存录'],['lead','咨询申请'],['plan','规划中']
];

async function exportAll(prefix){
  const out=[];let cursor='';
  for(let k=0;k<200;k++){
    const r=await fetch('/api/export?token='+encodeURIComponent(TOKEN)+'&prefix='+prefix+(cursor?'&cursor='+encodeURIComponent(cursor):''),{cache:'no-store'});
    if(r.status===403){try{localStorage.removeItem('xl_admin')}catch(e){}throw new Error('auth')}
    const d=await r.json();if(!d.ok)throw new Error(d.err||'fail');
    out.push(...d.items);if(d.complete||!d.cursor||!d.items.length)break;cursor=d.cursor;
  }
  return out;
}
function csv(name,rows,cols){
  const q=v=>{v=v==null?'':Array.isArray(v)?v.join('|'):String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const text='\uFEFF'+cols.join(',')+'\n'+rows.map(r=>cols.map(c=>q(r[c])).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();
}
function login(msg){
  $('app').innerHTML=`<div class="login"><h1>小梨工作台</h1><span class="sub">输入 EdgeOne Pages 环境变量里设置的 ADMIN_TOKEN。口令只保存在这台设备上。</span>
  <input id="tk" type="password" placeholder="ADMIN_TOKEN" autocomplete="current-password"><button class="btn pri" id="go">进入</button>${msg?`<span class="bad">${esc(msg)}</span>`:''}</div>`;
  $('go').onclick=()=>{TOKEN=$('tk').value.trim();CACHE={};frame()};$('tk').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
}
async function frame(){
  if(!TOKEN)return login();
  try{await exportAll('c_')}catch(e){return login(e.message==='auth'?'口令不对':e.message==='kv_not_bound'?'KV 还没有绑定到项目（变量名需为 xl_kv）':'读取失败：'+e.message)}
  try{localStorage.setItem('xl_admin',TOKEN)}catch(e){}
  $('app').innerHTML=`<header><div><h1>小梨工作台</h1><div class="sub">xiaolipearl.com · 所有数据统一来自 EdgeOne KV（xl_kv）</div></div>
    <div class="bar" style="margin:0"><button class="btn" id="rf">刷新</button><button class="btn" id="out">退出</button></div></header>
    <nav>${TABS.map(([k,n])=>`<button data-t="${k}" class="${k===TAB?'on':''}">${n}</button>`).join('')}</nav><div id="view"></div>`;
  document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;frame()});
  $('rf').onclick=()=>{CACHE={};frame()};
  $('out').onclick=()=>{try{localStorage.removeItem('xl_admin')}catch(e){}TOKEN='';login()};
  $('view').innerHTML='<div class="empty">加载中…</div>';
  try{await VIEWS[TAB]()}catch(e){$('view').innerHTML=`<div class="empty bad">加载失败：${esc(e.message)}</div>`}
}
const load=async p=>CACHE[p]||(CACHE[p]=await exportAll(p));

const VIEWS={
  async home(){
    const [h,st,fp,leads]=await Promise.all([
      fetch('/api/health',{cache:'no-store'}).then(r=>r.json()).catch(()=>({})),
      fetch('/api/stats',{cache:'no-store'}).then(r=>r.json()).catch(()=>({})),
      load('e_fp_'),load('lead_')]);
    const fpEnd=fp.filter(r=>r.ev==='end').length,newLeads=leads.filter(l=>l.status==='new').length;
    const flag=(ok,t)=>`<span class="pill ${ok?'ok':'bad'}">${ok?'正常':'未配置'}</span> ${t}`;
    $('view').innerHTML=`<div class="grid">
      <div class="card"><h3>系统状态</h3>${flag(h.kv,'KV 存储')}<br>${flag(h.admin_token,'管理员口令')}<div class="sub">检查时间 ${esc(fmt(Date.parse(h.time)))}</div></div>
      <div class="card"><h3>金融里，你是什么登？</h3><div class="big">${fp.length}</div><div class="sub">开始 ${fp.length} 局 · 完成 ${fpEnd} 局</div></div>
      <div class="card"><h3>量化基金生存录</h3><div class="big">${st.starts||0}</div><div class="sub">开始 ${st.starts||0} 局 · 完成 ${st.finished||0} 局</div></div>
      <div class="card"><h3>咨询申请</h3><div class="big">${leads.length}</div><div class="sub">其中未处理 ${newLeads} 条</div></div>
    </div>
    <p class="sub" style="margin-top:16px">渠道统计：分享链接时加 <code>?from=dy</code>（抖音）、<code>?from=bl</code>（B站）、<code>?from=xhs</code>（小红书）、<code>?from=wx</code>（微信）。</p>`;
  },
  async fp(){
    const rows=await load('e_fp_');const end=rows.filter(r=>r.ev==='end');
    const by=(arr,f)=>arr.reduce((m,r)=>{const k=f(r)||'（无）';m[k]=(m[k]||0)+1;return m},{});
    const bars=(m,total)=>Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="hbar"><b>${esc(k)}</b><i style="width:${Math.max(2,v/Math.max(1,total)*100)*3}px"></i><span>${v}（${Math.round(v/Math.max(1,total)*100)}%）</span></div>`).join('')||'<div class="muted">暂无</div>';
    const posters=rows.reduce((s,r)=>s+(r.posters||0),0),pairs=rows.filter(r=>r.pair).length;
    $('view').innerHTML=`<div class="bar"><button class="btn" id="dl">下载 CSV</button><span class="sub">一局 = 一条记录</span></div>
      <div class="grid">
        <div class="card"><h3>开始</h3><div class="big">${rows.length}</div></div>
        <div class="card"><h3>完成率</h3><div class="big">${rows.length?Math.round(end.length/rows.length*100):0}%</div><div class="sub">完成 ${end.length} 局</div></div>
        <div class="card"><h3>生成海报</h3><div class="big">${posters}</div><div class="sub">合盘海报 ${pairs} 局</div></div>
        <div class="card"><h3>帮别人鉴定</h3><div class="big">${rows.filter(r=>r.mode==='him').length}</div><div class="sub">测自己 ${rows.filter(r=>r.mode==='me').length}</div></div>
      </div>
      <div class="grid" style="margin-top:12px">
        <div class="card"><h3>人格代码分布（完成局）</h3>${bars(by(end,r=>r.code),end.length)}</div>
        <div class="card"><h3>来源渠道</h3>${bars(by(rows,r=>r.src),rows.length)}</div>
      </div>`;
    $('dl').onclick=()=>csv('金融人格_'+new Date().toISOString().slice(0,10)+'.csv',rows,['day','ts','id','ev','mode','code','dur','posters','pair','src','ref','dev','v']);
  },
  async quant(){
    $('view').innerHTML=`<div class="bar"><a class="btn" href="/admin/quant/" target="_blank">在新窗口打开完整看板</a><span class="sub">原有看板，功能不变；与工作台共用同一口令</span></div><iframe src="/admin/quant/"></iframe>`;
  },
  async lead(){
    const rows=(await load('lead_')).sort((a,b)=>b.ts-a.ts);
    $('view').innerHTML=`<div class="bar"><button class="btn" id="dl">下载 CSV</button><span class="sub">共 ${rows.length} 条，按提交时间倒序</span></div>`+
      (rows.length?`<table><tr><th>时间</th><th>项目类型</th><th>目标和当前困难</th><th>联系方式</th><th>来源</th></tr>${rows.map(r=>`<tr><td>${esc(fmt(r.ts))}</td><td>${esc(r.topic)}</td><td class="need">${esc(r.need)}</td><td>${esc(r.contact)}</td><td>${esc(r.src||r.ref)}</td></tr>`).join('')}</table>`:'<div class="empty">还没有咨询申请</div>');
    $('dl').onclick=()=>csv('咨询申请_'+new Date().toISOString().slice(0,10)+'.csv',rows,['day','ts','topic','need','contact','src','ref','status']);
  },
  async plan(){
    $('view').innerHTML=`<div class="grid">
      <div class="card"><h3>Agent 接入</h3><span class="pill warn">规划中</span><p class="muted">各岗位 agent 的状态与产出汇总到这里。</p></div>
      <div class="card"><h3>工作进度</h3><span class="pill warn">规划中</span><p class="muted">设计、拍摄、文案等任务看板，与 GitHub Issues 同步。</p></div>
      <div class="card"><h3>平台数据</h3><span class="pill warn">规划中</span><p class="muted">抖音、B站、小红书、公众号的内容数据回收。</p></div>
    </div>`;
  },
};
frame();
</script>
</body>
</html>
