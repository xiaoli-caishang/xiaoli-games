<style>
:root{--bg:#F6EFE4;--s1:#FFFBF4;--s2:#F3EADB;--line:#E8DCC8;--fg:#3E3833;--mut:#958A7C;--inkm:#6B6157;--gold:#E3A33B;--gold-d:#C98A2A;--red:#D9695A;--green:#4F9A70;--paper:#FFF6E6;
--lab:#1E3E30;--lab2:#264C3B;--labline:#3C6450;--cream:#F4EEE3;--cmut:#B9C7B9;
--f-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;--f-num:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;--f-serif:"Songti SC","Noto Serif SC","Source Han Serif SC",serif;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);-webkit-tap-highlight-color:transparent}
body{background-image:radial-gradient(circle at 8% 10%,#FBE3D6 0,transparent 28%),radial-gradient(circle at 92% 32%,#E6EFD8 0,transparent 26%),radial-gradient(circle at 70% 96%,#F7E7C4 0,transparent 30%);background-attachment:fixed;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--f-num)}
.app{max-width:440px;margin:0 auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column}
.scr{display:none;flex:1;flex-direction:column;gap:14px}.scr.on{display:flex}
/* start */
#s0{justify-content:center;text-align:center;align-items:center;gap:18px}
.eyebrow{font-size:12px;color:var(--gold-d);font-weight:700;letter-spacing:.08em}
.title{font-size:40px;font-weight:900;line-height:1.18;margin:0}
.title em{font-style:normal;background:linear-gradient(transparent 58%,#F7DFAE 58%);padding-inline:2px}
.lead{font-size:15px;line-height:1.75;color:var(--inkm);margin:0}
.tag{position:relative;display:inline-grid;place-items:center;background:var(--s1);border:2px solid var(--fg);border-radius:10px 22px 22px 10px;padding:14px 26px 14px 38px;transform:rotate(-4deg);box-shadow:4px 4px 0 var(--fg)}
.tag::before{content:"";position:absolute;left:12px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;border:2px solid var(--fg);background:var(--bg)}
.tag b{font-size:34px;font-weight:900;color:var(--red);font-family:var(--f-num)}.tag small{font-size:12px;color:var(--mut)}
.go{border-radius:999px;box-shadow:0 4px 0 var(--gold-d);padding:15px 18px;background:var(--gold);color:var(--fg);font-weight:900;font-size:17px;width:100%}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 var(--gold-d)}
.ghost{border:1.5px solid var(--line);background:var(--s1);border-radius:999px;padding:12px 18px;font-weight:700;font-size:15px;width:100%}
.tiny{font-size:11.5px;color:var(--mut);line-height:1.6}
.facts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.facts span{font-size:12px;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--inkm)}
/* quiz */
.top{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mut)}
.top .bar{flex:1;height:6px;border-radius:4px;background:var(--s2);overflow:hidden}.top .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .35s}
.meter{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:12px;color:var(--inkm)}
.meter .scale{position:relative;flex:1;height:8px;border-radius:5px;background:linear-gradient(90deg,#F2B8AE,#F7DFAE 50%,#CFE3C3)}
.meter .needle{position:absolute;top:-5px;width:4px;height:18px;margin-left:-2px;border-radius:2px;background:var(--fg);left:50%;transition:left .6s cubic-bezier(.3,1.4,.5,1)}
.meter .lo,.meter .hi{font-size:11px;color:var(--mut)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 26px rgba(160,125,80,.14);padding:18px 16px;display:flex;flex-direction:column;gap:14px;animation:enter .35s cubic-bezier(.3,1.3,.5,1)}
@keyframes enter{from{transform:translateY(14px) scale(.97);opacity:0}}
.chip{align-self:flex-start;font-size:12px;font-weight:700;color:var(--gold-d);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.q{font-size:20px;line-height:1.5;font-weight:900;margin:0}
.q small{display:block;font-size:13px;font-weight:400;color:var(--mut);margin-top:4px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:grid;gap:6px;justify-items:center;text-align:center;background:var(--s2);border:2px solid var(--line);border-radius:18px;padding:16px 8px;transition:transform .15s,border-color .15s,background .15s}
.opt:active,.opt.hot{transform:scale(.97);border-color:var(--gold);background:color-mix(in srgb,var(--gold) 18%,var(--s1))}
.env{width:54px;height:40px;border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:20px;color:#fff;background:var(--red);box-shadow:inset 0 -6px 0 rgba(0,0,0,.12);position:relative}
.env::after{content:"";position:absolute;top:13px;width:14px;height:14px;border-radius:50%;background:#F7CF6B}
.env.later{background:#B9A58C}
.amt{font-size:24px;font-weight:900;font-family:var(--f-num)}.when{font-size:14px;font-weight:700;color:var(--inkm)}.when b{color:var(--fg)}
#qbox{margin-top:auto}.toast{margin-bottom:auto;min-height:20px;text-align:center;font-size:13px;color:var(--gold-d);font-weight:700;opacity:0;transition:opacity .25s}.toast.show{opacity:1}
.list{display:grid;gap:8px}
.tog{display:flex;align-items:center;gap:10px;text-align:left;background:var(--s2);border:2px solid transparent;border-radius:14px;padding:12px;font-size:15px;font-weight:700;line-height:1.4}
.tog .bx{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);background:var(--s1);display:grid;place-items:center;font-size:14px;color:#fff}
.tog.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--s1))}.tog.on .bx{background:var(--gold);border-color:var(--gold)}.tog.on .bx::after{content:"✓"}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--s2);border-radius:14px;padding:10px 12px;font-size:15px;font-weight:700;line-height:1.4}
.seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{padding:6px 10px;border-radius:999px;font-size:13px;font-weight:700;color:var(--mut)}.seg button.on{background:var(--fg);color:var(--paper)}
/* result */
.res{display:flex;flex-direction:column;gap:14px}
.pc{background:var(--s1);border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 26px rgba(160,125,80,.14);overflow:hidden}
.pc-h{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px dashed var(--line);font-size:12px;color:var(--mut)}
.pc-main{padding:20px 16px 6px;text-align:center;display:grid;gap:6px;justify-items:center}
.pc-main .k1{font-size:15px;font-weight:700;color:var(--inkm)}
.pc-main .tag{margin:10px 0 6px}.pc-main .tag b{font-size:48px}
.pc-main .k2{font-size:14px;color:var(--inkm);line-height:1.6}.pc-main .k2 b{color:var(--fg)}
.type{margin:12px 16px 0;background:var(--paper);border-radius:16px;padding:14px;display:grid;gap:6px}
.type h2{margin:0;font-size:24px;font-weight:900}.type p{margin:0;font-size:14px;line-height:1.7;color:var(--inkm)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px}
.st{background:var(--s2);border-radius:12px;padding:8px;text-align:center;display:grid;gap:2px}.st b{font-size:18px;font-family:var(--f-num)}.st span{font-size:11px;color:var(--mut)}
.pc-f{display:flex;justify-content:space-between;padding:8px 16px 14px;font-size:11px;color:var(--mut)}
.sect{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:10px}
.sect h3{margin:0;font-size:18px;font-weight:900}.sect .sub{margin:0;font-size:13px;color:var(--mut);line-height:1.6}
.act{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;background:var(--s2);border-radius:14px;padding:12px}
.act i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--fg);color:var(--paper);display:grid;place-items:center;font-weight:900;font-family:var(--f-num)}
.act b{display:block;font-size:15px;line-height:1.5}.act span{display:block;font-size:13px;color:var(--inkm);line-height:1.6;margin-top:2px}
.note{font-size:13.5px;line-height:1.7;background:color-mix(in srgb,var(--green) 12%,var(--s1));border-radius:14px;padding:12px;margin:0}
.flip{background:var(--lab);color:var(--cream);border-radius:20px;padding:20px 16px;display:grid;gap:10px;text-align:center}
.flip p{margin:0;font-size:15px;line-height:1.7}.flip .go{background:var(--cream);box-shadow:0 4px 0 #9fb3a4}
/* lab */
.lab{display:none;flex-direction:column;gap:14px;background:var(--lab);color:var(--cream);border-radius:24px;padding:20px 16px;margin-top:4px}
.lab.on{display:flex;animation:enter .5s}
.lab .ey{font-size:11px;letter-spacing:.14em;color:var(--cmut)}
.lab h2{margin:0;font-family:var(--f-serif);font-size:26px;line-height:1.35;font-weight:900}
.lab .intro{margin:0;font-size:14px;line-height:1.8;color:var(--cmut)}

</style></head><body>
<div class="app">
<section class="scr on" id="s0">
  <div class="eyebrow">小梨研究所 · 思维笔记</div>
  <h1 class="title">你给未来的自己<br>打<em>几折</em>？</h1>

  <div class="facts"><span>不用登录</span><span>没有对错</span><span>凭第一反应选</span></div>

</section>
<section class="scr" id="s1">
  <div class="top"><span class="num" id="qn">1/11</span><div class="bar"><i id="pb"></i></div></div>
  <div class="meter"><span class="lo">只要现在</span><div class="scale"><div class="needle" id="needle"></div></div><span class="hi">能等很久</span></div>
  <div id="qbox"></div>
  <div class="toast" id="toast"></div>
</section>
<section class="scr" id="s2"><div class="res" id="res"></div></section>
</div>
<script>
/* ===== 匿名统计（/api/evt）：只记类型码，不记个人信息 ===== */
const XL={id:'',t0:0,v:'fd1'};
function xlT(ev,extra){try{
  if(location.protocol==='file:')return;
  if(ev==='start'){const a='abcdefghijkmnpqrstuvwxyz23456789';XL.id='';for(let i=0;i<12;i++)XL.id+=a[Math.floor(Math.random()*a.length)];XL.t0=Date.now()}
  if(!XL.id)return;
  let src='',ref='';try{src=(new URLSearchParams(location.search).get('from')||'').slice(0,20)}catch(e){}
  try{ref=document.referrer?new URL(document.referrer).hostname:''}catch(e){}
  const body=JSON.stringify(Object.assign({g:'fd',id:XL.id,ev,v:XL.v,t0:XL.t0,src,ref,dev:innerWidth<700?'m':'d'},extra||{}));
  if(ev!=='start'&&navigator.sendBeacon)navigator.sendBeacon('/api/evt',new Blob([body],{type:'application/json'}));
  else fetch('/api/evt',{method:'POST',headers:{'content-type':'application/json'},body,keepalive:true}).catch(()=>{});
}catch(e){}}

/* ===== 测量模型 =====
   主指标：5 题调整延迟法（Koffarnus & Bickel 2014）。“现在 ¥500 vs X 后 ¥1000”，X 从 33 档里二分调整，得到 ED50（多久以后 1000 在心里只值 500），k=1/ED50（天），双曲折扣 V=A/(1+kD)（Mazur 1987）。
   参考分布 REF：成年人 log10(k) 近似正态，文献量级（大额货币任务中位 k 约 0.005/天），待回收数据后替换为自有常模。 */
const H=1/24,D=1,W=7,M=30.44,Y=365.25;
const DELAYS=[[H,'1 小时'],[2*H,'2 小时'],[3*H,'3 小时'],[4*H,'4 小时'],[6*H,'6 小时'],[9*H,'9 小时'],[12*H,'12 小时'],[D,'1 天'],[1.5*D,'1 天半'],[2*D,'2 天'],[3*D,'3 天'],[4*D,'4 天'],[W,'1 周'],[1.5*W,'10 天'],[2*W,'2 周'],[3*W,'3 周'],[M,'1 个月'],[2*M,'2 个月'],[3*M,'3 个月'],[4*M,'4 个月'],[6*M,'半年'],[8*M,'8 个月'],[Y,'1 年'],[2*Y,'2 年'],[3*Y,'3 年'],[4*Y,'4 年'],[5*Y,'5 年'],[8*Y,'8 年'],[10*Y,'10 年'],[12*Y,'12 年'],[15*Y,'15 年'],[20*Y,'20 年'],[25*Y,'25 年']];
const START=16,STEPS=[8,4,2,1];
const REF={mu:-2.3,sd:0.9};
const ENV=[
 {k:'bed',t:'手机在床边充电',a:'今晚把充电器挪出卧室',d:'床上够不着手机，睡前那一小时就从“忍住不刷”变成“刷不着”。'},
 {k:'push',t:'大部分 App 的通知开着',a:'只留电话和聊天的通知，其余全关',d:'每条推送都是别人替你按下的“现在”键。'},
 {k:'home',t:'外卖 / 购物 App 在手机第一屏',a:'把它们挪进第三屏的文件夹',d:'多划两下，冲动就有时间降温。'},
 {k:'snack',t:'零食饮料放在一眼能看到的地方',a:'零食进柜子，桌上只放水杯',d:'看得见的东西，才会被想起来。'},
 {k:'night',t:'睡前最后一件事通常是刷手机',a:'定一个“如果…就…”：如果 23:30 还在刷，就把手机放门口',d:'提前写好的“如果…就…”，到点就照做，不用临时跟自己商量。'},
 {k:'cart',t:'购物车里常年躺着东西',a:'加购之后，隔两天再决定',d:'过了两天还想要，就是真想要。'}];
const SELF=['我很擅长抵抗诱惑','我能为长期目标稳定地努力','别人会说我很有自制力'];
const TYPES={
 P:{n:'远见派',d:'未来在你心里很值钱，生活环境也在帮你。你的“自律”大多花在选择上，不太需要硬扛。'},
 E:{n:'被环境拖后腿的远见派',d:'你其实很能等，红包题就是证据。问题出在身边的诱惑离你太近。只要改环境，你的提升会是四种类型里最快的。'},
 N:{n:'当下派',d:'环境挺干净，但大脑给“以后”打的折偏狠。你缺的不是意志力，是一个看得见、摸得着的未来。'},
 S:{n:'即时冲浪手',d:'大脑偏爱现在，身边诱惑又多，两头夹击。好消息是你最容易出效果：先从最顺手的一件环境小事改起。'}};

let st;
function reset(){st={i:0,idx:START,trace:[],step:0,rev:{near:null,far:null},env:new Set(),self:[null,null,null],rel:[null,null],t0:Date.now()}}
/* 题序：调整题与其它题穿插，反转对（近/远）分开放 */
const PLAN=['adj','near','adj','env','adj','self','adj','rel0','adj','rel1','far'];
const $=s=>document.querySelector(s);
function show(id){document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id===id));scrollTo(0,0)}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1100)}
function needle(){const x=Math.log10(DELAYS[st.idx][0]*24)/Math.log10(25*Y*24);$('#needle').style.left=(4+92*Math.max(0,Math.min(1,x)))+'%'}
function envSvg(later){return `<div class="env${later?' later':''}"></div>`}
function render(){
  const kind=PLAN[st.i];$('#qn').textContent=(st.i+1)+'/'+PLAN.length;$('#pb').style.width=(st.i/PLAN.length*100)+'%';needle();
  const box=$('#qbox');let h='';
  if(kind==='adj'){const [d,l]=DELAYS[st.idx];const n=st.step+1;
    h=`<div class="card"><span class="chip">红包 ${n}/5</span><p class="q">有人送你一个红包，二选一：</p>
    <div class="pick"><button class="opt" data-v="now">${envSvg()}<span class="amt">¥500</span><span class="when"><b>现在</b>就到账</span></button>
    <button class="opt" data-v="wait">${envSvg(1)}<span class="amt">¥1000</span><span class="when"><b>${l}</b>后到账</span></button></div></div>`}
  else if(kind==='near'||kind==='far'){const far=kind==='far';
    h=`<div class="card"><span class="chip">${far?'加时题':'热身题'}</span><p class="q">${far?'这次是很久以后的事：':'一个小红包：'}</p>
    <div class="pick"><button class="opt" data-v="now">${envSvg()}<span class="amt">¥100</span><span class="when"><b>${far?'一年后':'今天'}</b></span></button>
    <button class="opt" data-v="wait">${envSvg(1)}<span class="amt">¥110</span><span class="when"><b>${far?'一年零一天后':'明天'}</b></span></button></div></div>`}
  else if(kind==='env'){h=`<div class="card"><span class="chip">日常</span><p class="q">这些说的是你吗？<small>点中就算，可多选，一个都没有也行</small></p><div class="list">${ENV.map((e,j)=>`<button class="tog${st.env.has(j)?' on':''}" data-j="${j}"><span class="bx"></span>${e.t}</button>`).join('')}</div><button class="go" id="next">选好了</button></div>`}
  else if(kind==='self'){h=`<div class="card"><span class="chip">凭感觉</span><p class="q">像不像你？<small>别想太久</small></p><div class="list">${SELF.map((s,j)=>`<div class="row">${s}<div class="seg" data-j="${j}"><button data-v="1">像</button><button data-v="0">不像</button></div></div>`).join('')}</div><button class="go" id="next" disabled style="opacity:.4">好了</button></div>`}
  else if(kind==='rel0'){h=`<div class="card"><span class="chip">小调查</span><p class="q">别人跟你说“下次请你吃饭”，你一般觉得……</p><div class="pick"><button class="opt" data-v="1"><span class="amt">🤝</span><span class="when"><b>多半会兑现</b></span></button><button class="opt" data-v="0"><span class="amt">🙂</span><span class="when"><b>听听就好</b></span></button></div></div>`}
  else if(kind==='rel1'){h=`<div class="card"><span class="chip">小调查</span><p class="q">过去一年，你的收入和生活节奏……</p><div class="pick"><button class="opt" data-v="1"><span class="amt">📅</span><span class="when"><b>比较稳定</b></span></button><button class="opt" data-v="0"><span class="amt">🎢</span><span class="when"><b>说变就变</b></span></button></div></div>`}
  box.innerHTML=h;
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{b.classList.add('hot');setTimeout(()=>answer(b.dataset.v),160)});
  box.querySelectorAll('.tog').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;st.env.has(j)?st.env.delete(j):st.env.add(j);b.classList.toggle('on')});
  box.querySelectorAll('.seg').forEach(sg=>sg.querySelectorAll('button').forEach(b=>b.onclick=()=>{st.self[+sg.dataset.j]=+b.dataset.v;sg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));const nx=$('#next');if(st.self.every(v=>v!==null)){nx.disabled=false;nx.style.opacity=1}}));
  const nx=$('#next');if(nx)nx.onclick=()=>{if(!nx.disabled)answer()};
}
const QUIP={now:['落袋为安，懂。','先拿到手再说。','现在的钱最实在。'],wait:['沉得住气。','行，等得起。','耐心值 +1。']};
function answer(v){
  const kind=PLAN[st.i];
  if(kind==='adj'){st.trace.push({idx:st.idx,c:v});
    if(st.step<4){st.idx=Math.max(0,Math.min(DELAYS.length-1,st.idx+(v==='wait'?1:-1)*STEPS[st.step]))}
    st.step++;toast(QUIP[v][Math.floor(Math.random()*3)])}
  else if(kind==='near')st.rev.near=v; else if(kind==='far')st.rev.far=v;
  else if(kind==='rel0')st.rel[0]=+v; else if(kind==='rel1')st.rel[1]=+v;
  st.i++; if(st.i<PLAN.length)render(); else finish();
}
/* ===== 计算 ===== */
function ed50Days(trace){const L=trace[trace.length-1];const a=DELAYS[L.idx][0];
  const nb=L.c==='wait'?DELAYS[Math.min(DELAYS.length-1,L.idx+1)][0]*(L.idx===DELAYS.length-1?1.6:1):DELAYS[Math.max(0,L.idx-1)][0]/(L.idx===0?1.6:1);
  return Math.sqrt(a*nb)}
function ncdf(z){const t=1/(1+.2316419*Math.abs(z)),d=.3989423*Math.exp(-z*z/2);let p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}
function fmtDur(d){if(d<1)return Math.round(d*24)+' 小时';if(d<14)return (Math.round(d*10)/10)+' 天';if(d<60)return Math.round(d/7)+' 周';if(d<365)return Math.round(d/M)+' 个月';return (Math.round(d/Y*10)/10)+' 年'}
function compute(){const ed=ed50Days(st.trace),k=1/ed;
  const HZ=[[Y,'一年后'],[M,'一个月后'],[W,'一周后'],[D,'明天']];let hz=HZ.find(h=>100/(1+k*h[0])>=10)||HZ[3];
  const v1=100/(1+k*hz[0]),zhe=Math.max(.1,Math.round(v1)/10);const pct=Math.round(ncdf((REF.mu-Math.log10(k))/REF.sd)*100);
  const envN=st.env.size,patient=ed>=182,tempt=envN>=3;const T=patient?(tempt?'E':'P'):(tempt?'S':'N');
  const selfN=st.self.reduce((a,b)=>a+(b||0),0),relN=st.rel[0]+st.rel[1];
  const reversed=st.rev.near==='now'&&st.rev.far==='wait';
  return{ed,k,v1,zhe,hz:hz[1],hzD:hz[0],pct:Math.max(1,Math.min(99,pct)),envN,T,selfN,relN,reversed,patient}}
function actions(r){const out=[];const picked=[...st.env].map(j=>ENV[j]);
  const order=['bed','night','push','home','snack','cart'];picked.sort((a,b)=>order.indexOf(a.k)-order.indexOf(b.k));
  const nEnv=r.T==='E'||r.T==='S'?2:1;picked.slice(0,nEnv).forEach(e=>out.push({a:e.a,d:e.d}));
  if(!r.patient)out.push({a:'下单或放弃之前，花 10 秒想一个具体画面',d:'不要想“以后”，要想“下个月 15 号还花呗那天的我”。未来越具体，在心里打的折就越少。'});
  out.push({a:'把一件“想做”绑在一件“该做”上',d:'好看的剧只在跑步、做家务的时候看。想看剧，就顺手把该做的做了。'});
  out.push({a:'工资到账当天，先自动转走一小笔',d:'趁“以后的我”还没开始花钱，替他先做决定。'});
  if(r.ed>=10*Y)out.unshift({a:'每周留一件不需要理由的小快乐',d:'你能等，甚至等得有点多了。今天的你也值钱。'});
  return out.slice(0,3)}
/* ===== 结果页 ===== */
function finish(){const r=compute();st.r=r;show('s2');
  const code=r.T+String(st.trace[4].idx).padStart(2,'0')+r.envN+(r.reversed?1:0)+r.relN;
  xlT('end',{code,dur:Math.round((Date.now()-st.t0)/1000)});
  const t=TYPES[r.T],acts=actions(r);
  let notes='';
  if(!r.patient&&r.relN===0)notes+=`<p class="note">你选“现在”多，其实可能是一种理性：当你觉得“说好的以后”不太靠谱时，先拿到手确实更划算。先让生活稳一点，等待自然会变容易。</p>`;
  if(r.selfN<=1&&r.pct>=50)notes+=`<p class="note">你说自己不太有自制力，可实测比 ${r.pct}% 的人都能等。你没有自己想的那么差。</p>`;
  $('#res').innerHTML=`
  <div class="pc"><div class="pc-h"><span>小梨研究所 · 未来折扣测试</span><span class="num">No.${code}</span></div>
   <div class="pc-main"><div class="k1">你给${r.hz}的自己，打了</div><div class="tag"><b>${r.zhe.toFixed(1)}折</b><small>${r.hz}的你 · 心理价</small></div>
   <div class="k2">${r.hz}的 100 块，在你心里只值 <b>${r.v1.toFixed(r.v1<10?1:0)}</b> 块<br>你比 <b>${r.pct}%</b> 的人更能等</div></div>
   <div class="type"><span class="chip">你的类型</span><h2>${t.n}</h2><p>${t.d}</p></div>
   <div class="stats"><div class="st"><b>${fmtDur(r.ed)}</b><span>等多久打五折</span></div><div class="st"><b>${r.envN}/6</b><span>身边诱惑</span></div><div class="st"><b>${r.reversed?'有':'无'}</b><span>前后反转</span></div></div>
   <div class="pc-f"><span>xiaolipearl.com</span><span>截图分享给朋友</span></div></div>
  ${notes}
  <div class="sect"><h3>这周就能做的 3 件小事</h3><p class="sub">按你刚才的选择挑的，一件都不需要咬牙。</p>${acts.map((a,j)=>`<div class="act"><i>${j+1}</i><div><b>${a.a}</b><span>${a.d}</span></div></div>`).join('')}</div>
  <div class="flip" id="flip"><p>刚才那 11 个选择，看起来像随手点点。<br>其实每一题都有来头。</p><button class="go" id="open">翻到背面看看 →</button></div>
  <div class="lab" id="lab"></div>
  <button class="ghost" id="again">再测一次</button><div class="tiny" style="text-align:center">测试用于科普与自我了解，不是心理诊断。</div>`;
  $('#open').onclick=()=>{$('#flip').style.display='none';renderLab(r);$('#lab').classList.add('on');$('#lab').scrollIntoView({behavior:'smooth'})};
  $('#again').onclick=()=>{reset();xlT('start');show('s1');render()};
}
function curveSvg(k){const W2=300,H2=150,px=36,py=14,xs=t=>px+(W2-px-8)*t/(5*Y),ys=v=>py+(H2-py-24)*(1-v);
  const path=kk=>{let s='';for(let i=0;i<=60;i++){const t=5*Y*i/60;s+=(i?'L':'M')+xs(t).toFixed(1)+' '+ys(1/(1+kk*t)).toFixed(1)}return s};
  const kr=Math.pow(10,REF.mu);
  return `<svg viewBox="0 0 ${W2} ${H2}" width="100%" role="img" aria-label="折扣曲线">
  ${[0,.5,1].map(v=>`<line x1="${px}" x2="${W2-8}" y1="${ys(v)}" y2="${ys(v)}" stroke="#3C6450" stroke-dasharray="3 3"/><text x="${px-6}" y="${ys(v)+4}" fill="#B9C7B9" font-size="10" text-anchor="end">${v*100}</text>`).join('')}
  ${[0,1,2,3,4,5].map(y=>`<text x="${xs(y*Y)}" y="${H2-6}" fill="#B9C7B9" font-size="10" text-anchor="middle">${y}年</text>`).join('')}
  <path d="${path(kr)}" fill="none" stroke="#B9C7B9" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="${path(k)}" fill="none" stroke="#E3A33B" stroke-width="3"/>
  <circle cx="${xs(Y)}" cy="${ys(1/(1+k*Y))}" r="4" fill="#E3A33B"/></svg>
  <div class="tiny" style="color:#B9C7B9;display:flex;gap:14px;justify-content:center"><span style="color:#E3A33B">━ 你</span><span>┅ 参考中位数</span></div>`}
function renderLab(r){
  const lg=d=>Math.log(d/H)/Math.log(25*Y/H)*100;
  let lo=0,hi=DELAYS.length-1;const rows=st.trace.map((t,j)=>{const s=`<div class="tr"><span class="n">${j+1}</span><div><div class="ln"><u style="left:${lg(DELAYS[lo][0])}%;width:${lg(DELAYS[hi][0])-lg(DELAYS[lo][0])}%"></u><s style="left:${lg(DELAYS[t.idx][0])}%"></s></div></div><span class="c ${t.c}">${DELAYS[t.idx][1]}·${t.c==='now'?'要现在':'愿意等'}</span></div>`;
    if(t.c==='now')hi=t.idx;else lo=t.idx;return s}).join('');
  const twin=r.reversed?`你在热身题里选了<b>今天拿 ¥100</b>，在加时题里却选了<b>多等一天拿 ¥110</b>。同样是多等一天、多拿 10 块，只因为“今天”两个字，你的选择就反过来了。`:
    (st.rev.near==='now'?`两题你都选了先拿。至少你前后一致：你是真的偏爱“早一点”。`:`两题你都愿意多等一天。很多人会在这里前后矛盾，你没有。`);
  $('#lab').innerHTML=`<div class="ey">THE BACK SIDE · 实验记录</div>
  <h2>你刚才做的，<br>是一套行为经济学实验。</h2>
  <p class="intro">没有一道题在问你“你自律吗”。我们只看你怎么选，因为人对自己的评价常常不准，选择不会撒谎。</p>
  <div class="ex"><span class="no">EXP.01 · 5 个红包</span><h3>每个红包的等待时间，都是根据你上一题的选择算出来的。</h3>
   <p>这是 2014 年弗吉尼亚理工 Koffarnus 和 Bickel 发表的<b>“5 题调整延迟法”</b>。你选“现在”，下一题就把等待缩短；选“等”，就把等待拉长，步子每次减半，像二分查找。在 1 小时到 25 年之间，5 题就能锁定你的位置。原论文验证过：这 5 题测出的结果，和几十题的长版测试高度一致。</p>
   <div class="trace">${rows}</div><div class="axis"><span>1小时</span><span>1天</span><span>1月</span><span>1年</span><span>25年</span></div>
   <p>最后锁定：大约等 <b>${fmtDur(r.ed)}</b>，¥1000 在你心里就只值 ¥500 了。这个时间点叫 ED50。</p>
   <div class="cite">Koffarnus MN, Bickel WK. A 5-trial adjusting delay discounting task: accurate discount rates in less than one minute. Exp Clin Psychopharmacol. 2014;22(3):222-8.</div></div>
  <div class="ex"><span class="no">EXP.02 · 你的折扣曲线</span><h3>“打几折”，来自一条曲线。</h3>
   <div class="formula">V = A / (1 + k·D)<br>k = 1/ED50 = ${r.k<.001?r.k.toExponential(1):r.k.toFixed(4)}</div>
   ${curveSvg(r.k)}
   <p>人给未来打折，打法不是银行那种匀速的复利，而是一条<b>先陡后平的双曲线</b>：从“现在”到“明天”跌得最狠，从“一年后”到“一年零一天”几乎不跌。k 越大，曲线塌得越快。把 D 设成${r.hz.replace('后','')}，就得到你封面上的 ${r.zhe.toFixed(1)} 折。${r.hzD<Y?'（你的曲线塌得太快，一年后已经不到 1 折，所以封面换成了更近的'+r.hz+'。）':''}</p>
   <p>这个 k 不是玄学。2017 年一项元分析发现，k 越大，成瘾行为往往越严重，相关不算强，但非常稳定（r = 0.14）；海洛因成瘾者的 k 约是常人的 2 倍。</p>
   <div class="cite">Mazur JE. 1987（双曲折扣模型）· Kirby KN, Petry NM, Bickel WK. J Exp Psychol Gen. 1999 · Amlung M et al. Addiction. 2017（r = 0.14）</div></div>
  <div class="ex"><span class="no">EXP.03 · 第 2 题和第 11 题</span><h3>热身题和加时题，是一对双胞胎。</h3>
   <div class="twin"><div><b>热身题</b>今天 ¥100 vs 明天 ¥110<br>你选：${st.rev.near==='now'?'今天':'明天'}</div><div><b>加时题</b>一年后 ¥100 vs 一年零一天 ¥110<br>你选：${st.rev.far==='now'?'一年后':'一年零一天'}</div></div>
   <p>${twin}</p>
   <p>这就是双曲线的后果，经济学叫<b>“现时偏差”</b>。2004 年《Science》上有一项脑成像研究：只要选项里出现“马上能拿到”，大脑的奖赏系统就会额外活跃起来；两个选项都在未来时，就没有这个效应。所以你不是不会算账，是“现在”这两个字自带加成。</p>
   <div class="cite">McClure SM, Laibson DI, Loewenstein G, Cohen JD. Separate neural systems value immediate and delayed monetary rewards. Science. 2004;306:503-7.</div></div>
  <div class="ex"><span class="no">EXP.04 · 那 6 条日常</span><h3>自律的人不是更能忍，而是不在需要忍的地方。</h3>
   <p>你勾了 <b>${r.envN}</b> 条。宾大的 Duckworth 等人把自控策略按时间线排开：越早介入（换个座位、把手机放远），越省力，硬扛是最后一道、也最费劲的防线。另一项研究让 205 个成年人带着提示器生活一周，记下了 7827 次“想要”。哪些冲动会占上风，环境因素影响很大。</p>
   <p>所以结果页给你的第一件事，永远是改环境。</p>
   <div class="cite">Duckworth AL, Gendler TS, Gross JJ. Situational strategies for self-control. Perspect Psychol Sci. 2016 · Hofmann W et al. Everyday temptations. J Pers Soc Psychol. 2012</div></div>
  <div class="ex"><span class="no">EXP.05 · “下次请你吃饭”</span><h3>能不能等，取决于你信不信“以后”会兑现。</h3>
   <p>著名的棉花糖实验常被讲成“小时候能忍，长大就成功”。2013 年罗切斯特大学做了个改版：先让孩子遇到一个说话算数、或者说话不算数的大人，再做棉花糖测试。遇到靠谱大人的那组，等的时间明显更长。<b>等待，其实是一笔理性的账。</b>2018 年用更大样本重做原实验，控制家庭背景之后，“能等就成功”的关联也弱了很多。</p>
   <p>你在两道小调查里得了 <b>${r.relN}/2</b> 分。${r.relN===0?'环境越不稳，“先拿到手”就越合理。这不是你的错。':'你对“以后”有基本的信任，这是能等的底气。'}</p>
   <div class="cite">Kidd C, Palmeri H, Aslin RN. Rational snacking. Cognition. 2013 · Watts TW, Duncan GJ, Quan H. Revisiting the marshmallow test. Psychol Sci. 2018</div></div>
  <div class="ex"><span class="no">EXP.06 · “像不像你”</span><h3>这 3 题来自一份自控量表，只用来跟你的实测对照。</h3>
   <p>题目改编自 Tangney 2004 的《简式自控量表》（原版 13 题）。你给自己 <b>${r.selfN}/3</b>，实测却比 <b>${r.pct}%</b> 的人更能等。${r.selfN<=1&&r.pct>=50?'很多人对自己的自律打分偏低，你就是其中之一。':r.selfN>=2&&r.pct<40?'自评比实测乐观一点，这很常见。':'自评和实测基本对得上。'}</p>
   <div class="cite">Tangney JP, Baumeister RF, Boone AL. High self-control predicts good adjustment. J Pers. 2004</div></div>
  <div class="ex"><span class="no">EXP.07 · 那 3 件小事</span><h3>每一条建议，都有对应的实验。</h3>
   <p><b>改环境</b>：情境策略（Duckworth 2016）。<b>“如果…就…”</b>：94 项研究的元分析显示，事先写好的“如果…就…”计划，能明显提高执行率（Gollwitzer & Sheeran 2006）。<b>想一个具体画面</b>：想象具体的未来事件，能降低折扣率（Peters & Büchel 2010）。<b>绑定想做和该做</b>：有声小说只在健身房能听，去健身房的次数初期多了 51%（Milkman 2014）。<b>先转走一小笔</b>：“明天存更多”计划让参与者的储蓄率在几年内大幅上升（Thaler & Benartzi 2004）。</p>
   <p>还有一条要说清楚：<b>折扣不是越低越好。</b>永远在等，同样是一种失衡。目标是让它和你想过的生活对得上。</p></div>
  <div class="ex"><span class="no">ABOUT · 关于这个测试</span>
   <p>“比多少人更能等”目前基于文献里成年人样本的量级估算。等测的人多了，小梨会换成我们自己的中国样本，再出一期“1 万人测完，我发现……”。</p>
   <ol class="refs"><li>Koffarnus & Bickel, 2014, Exp Clin Psychopharmacol</li><li>Mazur, 1987, 双曲折扣模型</li><li>McClure et al., 2004, Science</li><li>Kidd, Palmeri & Aslin, 2013, Cognition</li><li>Watts, Duncan & Quan, 2018, Psychol Sci</li><li>Duckworth, Gendler & Gross, 2016, Perspect Psychol Sci</li><li>Hofmann et al., 2012, J Pers Soc Psychol</li><li>Tangney, Baumeister & Boone, 2004, J Pers</li><li>Amlung et al., 2017, Addiction</li><li>Gollwitzer & Sheeran, 2006, Adv Exp Soc Psychol</li><li>Peters & Büchel, 2010, Neuron</li><li>Milkman, Minson & Volpp, 2014, Manage Sci</li><li>Thaler & Benartzi, 2004, J Polit Econ</li></ol></div>`;
}
