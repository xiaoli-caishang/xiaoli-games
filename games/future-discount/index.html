<style>
:root{--bg:#F6EFE4;--s1:#FFFBF4;--s2:#F3EADB;--line:#E8DCC8;--fg:#3E3833;--mut:#958A7C;--inkm:#6B6157;--gold:#E3A33B;--gold-d:#C98A2A;--red:#D9695A;--green:#4F9A70;--paper:#FFF6E6;
--lab:#1E3E30;--lab2:#264C3B;--labline:#3C6450;--cream:#F4EEE3;--cmut:#B9C7B9;
--f-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;--f-num:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;--f-serif:"Songti SC","Noto Serif SC","Source Han Serif SC",serif;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);-webkit-tap-highlight-color:transparent}
body{background-image:radial-gradient(circle at 8% 10%,#FBE3D6 0,transparent 28%),radial-gradient(circle at 92% 32%,#E6EFD8 0,transparent 26%),radial-gradient(circle at 70% 96%,#F7E7C4 0,transparent 30%);background-attachment:fixed;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--f-num)}
.app{max-width:440px;margin:0 auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column}
.scr{display:none;flex:1;flex-direction:column;gap:14px}.scr.on{display:flex}
/* start */
#s0{justify-content:center;text-align:center;align-items:center;gap:18px}
.eyebrow{font-size:12px;color:var(--gold-d);font-weight:700;letter-spacing:.08em}
.title{font-size:40px;font-weight:900;line-height:1.18;margin:0}
.title em{font-style:normal;background:linear-gradient(transparent 58%,#F7DFAE 58%);padding-inline:2px}
.lead{font-size:15px;line-height:1.75;color:var(--inkm);margin:0}
.tag{position:relative;display:inline-grid;place-items:center;background:var(--s1);border:2px solid var(--fg);border-radius:10px 22px 22px 10px;padding:14px 26px 14px 38px;transform:rotate(-4deg);box-shadow:4px 4px 0 var(--fg)}
.tag::before{content:"";position:absolute;left:12px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;border:2px solid var(--fg);background:var(--bg)}
.tag b{font-size:34px;font-weight:900;color:var(--red);font-family:var(--f-num)}.tag small{font-size:12px;color:var(--mut)}
.go{border-radius:999px;box-shadow:0 4px 0 var(--gold-d);padding:15px 18px;background:var(--gold);color:var(--fg);font-weight:900;font-size:17px;width:100%}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 var(--gold-d)}
.ghost{border:1.5px solid var(--line);background:var(--s1);border-radius:999px;padding:12px 18px;font-weight:700;font-size:15px;width:100%}
.tiny{font-size:11.5px;color:var(--mut);line-height:1.6}
.facts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.facts span{font-size:12px;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--inkm)}
/* quiz */
.top{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mut)}
.top .bar{flex:1;height:6px;border-radius:4px;background:var(--s2);overflow:hidden}.top .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .35s}
.card{background:var(--s1);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 26px rgba(160,125,80,.14);padding:18px 16px;display:flex;flex-direction:column;gap:14px;animation:enter .35s cubic-bezier(.3,1.3,.5,1)}
@keyframes enter{from{transform:translateY(14px) scale(.97);opacity:0}}
.chip{align-self:flex-start;font-size:12px;font-weight:700;color:var(--gold-d);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.q{font-size:20px;line-height:1.5;font-weight:900;margin:0}
.q small{display:block;font-size:13px;font-weight:400;color:var(--mut);margin-top:4px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:grid;gap:6px;justify-items:center;text-align:center;background:var(--s2);border:2px solid var(--line);border-radius:18px;padding:16px 8px;transition:transform .15s,border-color .15s,background .15s}
.opt:active,.opt.hot{transform:scale(.97);border-color:var(--gold);background:color-mix(in srgb,var(--gold) 18%,var(--s1))}
.env{width:54px;height:40px;border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:20px;color:#fff;background:var(--red);box-shadow:inset 0 -6px 0 rgba(0,0,0,.12);position:relative}
.env::after{content:"";position:absolute;top:13px;width:14px;height:14px;border-radius:50%;background:#F7CF6B}
.env.later{background:#B9A58C}
.amt{font-size:24px;font-weight:900;font-family:var(--f-num)}.when{font-size:14px;font-weight:700;color:var(--inkm)}.when b{color:var(--fg)}
#qbox{margin-top:auto}.toast{margin-bottom:auto;min-height:20px;text-align:center;font-size:13px;color:var(--gold-d);font-weight:700;opacity:0;transition:opacity .25s}.toast.show{opacity:1}
.list{display:grid;gap:8px}
.tog{display:flex;align-items:center;gap:10px;text-align:left;background:var(--s2);border:2px solid transparent;border-radius:14px;padding:12px;font-size:15px;font-weight:700;line-height:1.4}
.tog .bx{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);background:var(--s1);display:grid;place-items:center;font-size:14px;color:#fff}
.tog.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--s1))}.tog.on .bx{background:var(--gold);border-color:var(--gold)}.tog.on .bx::after{content:"✓"}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--s2);border-radius:14px;padding:10px 12px;font-size:15px;font-weight:700;line-height:1.4}
.seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{padding:6px 10px;border-radius:999px;font-size:13px;font-weight:700;color:var(--mut)}.seg button.on{background:var(--fg);color:var(--paper)}
/* result */
.res{display:flex;flex-direction:column;gap:14px}
.pc{background:var(--s1);border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 26px rgba(160,125,80,.14);overflow:hidden}
.pc-h{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px dashed var(--line);font-size:12px;color:var(--mut)}
.pc-f{display:flex;justify-content:space-between;padding:8px 16px 14px;font-size:11px;color:var(--mut)}
.sect{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:10px}
.sect h3{margin:0;font-size:18px;font-weight:900}.sect .sub{margin:0;font-size:13px;color:var(--mut);line-height:1.6}
.act{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;background:var(--s2);border-radius:14px;padding:12px}
.act i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--fg);color:var(--paper);display:grid;place-items:center;font-weight:900;font-family:var(--f-num)}
.act b{display:block;font-size:15px;line-height:1.5}.act span{display:block;font-size:13px;color:var(--inkm);line-height:1.6;margin-top:2px}
.note{font-size:13.5px;line-height:1.7;background:color-mix(in srgb,var(--green) 12%,var(--s1));border-radius:14px;padding:12px;margin:0}
.score{display:grid;justify-items:center;gap:4px;padding:22px 16px 8px;text-align:center}
.score .lb{font-size:15px;font-weight:700;color:var(--inkm)}
.score .big{font-family:var(--f-num);font-size:84px;font-weight:900;line-height:1;color:var(--red)}.score .big small{font-size:20px;color:var(--mut)}
.score .lv{font-size:22px;font-weight:900;background:var(--paper);border-radius:999px;padding:4px 16px}
.gauge{position:relative;height:10px;border-radius:6px;background:linear-gradient(90deg,#CFE3C3,#F7DFAE 50%,#F2B8AE);margin:14px 16px 4px}
.gauge s{position:absolute;top:-6px;width:6px;height:22px;margin-left:-3px;border-radius:3px;background:var(--fg)}
.gl{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);padding:0 16px}
.one{margin:10px 16px 16px;font-size:14.5px;line-height:1.7;color:var(--inkm);text-align:center}
.eq{font-family:var(--f-num);font-size:14px;text-align:center;background:var(--s2);border-radius:12px;padding:10px;line-height:1.6}
.part{border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:8px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.ph b{font-size:16px}.ph span{font-family:var(--f-num);font-size:20px;font-weight:900;color:var(--red)}
.part p{margin:0;font-size:14px;line-height:1.75;color:var(--inkm)}.part p b{color:var(--fg)}
.why{background:var(--paper);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.7;color:var(--inkm)}.why b{color:var(--fg)}
.src{font-size:11.5px;color:var(--mut);line-height:1.6}

.stage{margin:auto 0;display:grid;gap:12px}.stage #qbox{margin:0}
.tile img{width:36px;height:36px;image-rendering:pixelated}
.pear{width:64px;height:64px;image-rendering:pixelated;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.host{display:flex;align-items:flex-end;gap:8px}.host .pear{width:44px;height:44px;flex:none}
.bub{position:relative;background:var(--s1);border:1.5px solid var(--fg);border-radius:14px 14px 14px 4px;padding:8px 12px;font-size:15px;font-weight:700;line-height:1.5;animation:enter .3s}

</style></head><body>
<div class="app">
<section class="scr on" id="s0">
  <div class="host"><img class="pear" alt="小梨"><div class="bub">嗨，我是小梨</div></div>

  <div class="ln">对照 <b>5 题调整法</b> · 2014</div><div class="ln">比对 <b>《Science》脑成像研究</b> · 2004</div><div class="ln">估算 <b id="scAge"></b> 同龄人常模</div></section>

</div>
<script>
/* ===== 匿名统计（/api/evt）：只记结果码，不记个人信息 ===== */
const XL={id:'',t0:0,v:'fd3'};
function xlT(ev,extra){try{
  if(location.protocol==='file:')return;
  if(ev==='start'){const a='abcdefghijkmnpqrstuvwxyz23456789';XL.id='';for(let i=0;i<12;i++)XL.id+=a[Math.floor(Math.random()*a.length)];XL.t0=Date.now()}
  if(!XL.id)return;
  let src='',ref='';try{src=(new URLSearchParams(location.search).get('from')||'').slice(0,20)}catch(e){}
  try{ref=document.referrer?new URL(document.referrer).hostname:''}catch(e){}
  const body=JSON.stringify(Object.assign({g:'fd',id:XL.id,ev,v:XL.v,t0:XL.t0,src,ref,dev:innerWidth<700?'m':'d'},extra||{}));
  if(ev!=='start'&&navigator.sendBeacon)navigator.sendBeacon('/api/evt',new Blob([body],{type:'application/json'}));
  else fetch('/api/evt',{method:'POST',headers:{'content-type':'application/json'},body,keepalive:true}).catch(()=>{});
}catch(e){}}

/* 小梨：像素梨 + 飞行护目镜 + 皮背包（与 finance-persona 同一形象） */
function pearLogo(){const rows=["........b.LL....","........bLLL....","......PPPP......",".....PPPPPP.....","....GOOGGOOG....","....GOOGGOOG....","...PPPPPPPPPP...","...PPEPPPPEPPKK.","..PPBPPPPPPBPKKK","..PPPPPMMPPPPKKK","..PPPPPPPPPPPKKK","..PPPPPPPPPPPKK.","...PPPPPPPPPP...","....PPPPPPPP....",".....PPPPPP.....","................"];
  const pal={b:'#8A6A4A',L:'#7FB06A',P:'#C9D98B',E:'#3E3833',B:'#F2A39A',M:'#C9665A',G:'#6B4A2E',O:'#9FE0EC',K:'#A0703C'};
  const c=document.createElement('canvas');c.width=16;c.height=16;const x=c.getContext('2d');
  rows.forEach((r,y)=>{for(let i=0;i<16;i++){const col=pal[r[i]];if(col){x.fillStyle=col;x.fillRect(i,y,1,1)}}});return c.toDataURL()}
const PEAR=pearLogo();document.querySelectorAll('img.pear').forEach(i=>i.src=PEAR);

/* ===== 测量模型 =====
   不自律值 S = 难等程度 P × 70% + 环境诱惑 E × 30%
   P：5 题调整延迟法（Koffarnus & Bickel 2014）。“现在 ¥500 vs X 后 ¥1000”，X 在 33 档里二分调整 → ED50，k=1/ED50（天）。
      P = 成年人参考分布 REF（log10 k ~ N(-2.3, 0.9)，文献量级）里比你更能等的人占比。
   E：6 条日常情境勾选数 / 6。
   同龄人常模：越年轻越难等（Green, Fry & Myerson 1994；Reimers et al. 2009），按年龄段平移 log10 k 均值、调整情境勾选概率，
      用固定种子模拟 6000 人得到 S 分布。均为估算，回收数据后替换。 */
const H=1/24,D=1,W=7,M=30.44,Y=365.25;
const DELAYS=[[H,'1 小时'],[2*H,'2 小时'],[3*H,'3 小时'],[4*H,'4 小时'],[6*H,'6 小时'],[9*H,'9 小时'],[12*H,'12 小时'],[D,'1 天'],[1.5*D,'1 天半'],[2*D,'2 天'],[3*D,'3 天'],[4*D,'4 天'],[W,'1 周'],[1.5*W,'10 天'],[2*W,'2 周'],[3*W,'3 周'],[M,'1 个月'],[2*M,'2 个月'],[3*M,'3 个月'],[4*M,'4 个月'],[6*M,'半年'],[8*M,'8 个月'],[Y,'1 年'],[2*Y,'2 年'],[3*Y,'3 年'],[4*Y,'4 年'],[5*Y,'5 年'],[8*Y,'8 年'],[10*Y,'10 年'],[12*Y,'12 年'],[15*Y,'15 年'],[20*Y,'20 年'],[25*Y,'25 年']];
const START=16,STEPS=[8,4,2,1];
const REF={mu:-2.3,sd:0.9},WT={wait:.7,env:.3};
const AGES=[{c:'A',t:'18–24 岁',mu:-1.9,pe:.55},{c:'B',t:'25–30 岁',mu:-2.1,pe:.5},{c:'C',t:'31–40 岁',mu:-2.3,pe:.45},{c:'D',t:'40 岁以上',mu:-2.5,pe:.4}];
const ENV=[
 {k:'bed',t:'床边充电',a:'今晚把充电器挪出卧室',d:'床上够不着手机，睡前那一小时就从“忍住不刷”变成“刷不着”。'},
 {k:'push',t:'通知全开',a:'只留电话和聊天通知，其余全关',d:'每条推送，都是别人替你按下的“现在”键。'},
 {k:'home',t:'外卖在首屏',a:'把外卖、购物 App 挪进第三屏',d:'多划两下，冲动就有时间降温。'},
 {k:'snack',t:'零食在眼前',a:'零食进柜子，桌上只放水杯',d:'看得见的东西，才会被想起来。'},
 {k:'night',t:'睡前刷手机',a:'定一句：23:30 还在刷，就把手机放门口',d:'提前想好的规则，到点照做就行，不用临时跟自己商量。'},
 {k:'cart',t:'购物车囤货',a:'加购之后，隔两天再决定',d:'过了两天还想要，才是真想要。'}];

const ICON=(()=>{const pal={K:'#3E3833',R:'#D9695A',Y:'#E3A23A',G:'#7FB06A',W:'#FFFDF6',B:'#9FE0EC',C:'#C9A57A'};
 const S={bed:["....KKKK....","...KBBBBK...","...KBBYBK...","...KBYYBK...","...KYYBBK...","...KBYBBK...","...KBBBBK...","...KBBBBK...","...KKKKKK...","...KKWWKK...","....KKKK....","............"],
 push:[".....YY.....","....YYYY....","...YYYYYY...","...YYYYYY...","...YYYYYY...","..YYYYYYYY..","..YYYYYYYY..",".YYYYYYYYYY.",".KKKKKKKKKK.",".....KK.....","............","............"],
 home:["....KKKK....","....K..K....","..RRRRRRRR..","..RRRRRRRR..","..RRWWWWRR..","..RRWRRWRR..","..RRWWWWRR..","..RRRRRRRR..","..RRRRRRRR..","..RRRRRRRR..","..KKKKKKKK..","............"],
 snack:["....CCCC....","..CCCCCCCC..",".CCKCCCCCCC.",".CCCCCCKCCC.","CCCCCCCCCCCC","CCCKCCCCCCCC","CCCCCCCCKCCC",".CCCCKCCCCC.",".CCCCCCCCCC.","..CCCCCCCC..","....CCCC....","............"],
 night:["....YYYY....","..YYYY......",".YYYY.......",".YYY........","YYYY........","YYYY........","YYYY........","YYYYY.......",".YYYYY....Y.",".YYYYYYYYYY.","..YYYYYYYY..","....YYYY...."],
 cart:["KK..........",".K..........",".KRRRRRRRRR.",".KRRRRRRRRK.","..KRRRRRRK..","..KRRRRRRK..","...KKKKKKK..","...K........","...KKKKKKKK.","....KK..KK..","....KK..KK..","............"]};
 const o={};for(const k in S){const c=document.createElement('canvas');c.width=c.height=12;const x=c.getContext('2d');S[k].forEach((r,y)=>{for(let i=0;i<12;i++){const col=pal[r[i]];if(col){x.fillStyle=col;x.fillRect(i,y,1,1)}}});o[k]=c.toDataURL()}return o})();
const BANDS=[[0,20,'自律机器','说存就存，说睡就睡'],[20,40,'稳得住','偶尔破戒，能拉回来'],[40,60,'正常人类','想得很好，执行看心情'],[60,80,'容易上头','下单比思考快'],[80,101,'及时行乐家','以后的事以后再说']];
const bandOf=v=>BANDS.find(b=>v<b[1]);

let st;
function reset(){st={i:0,age:null,guess:50,idx:START,trace:[],step:0,rev:{near:null,far:null},env:new Set(),t0:Date.now()}}
const PLAN=['age','guess','near','adj','adj','adj','adj','adj','env','far'];
const $=s=>document.querySelector(s);
function show(id){document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id===id));scrollTo(0,0)}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1000)}
function say(t){const b=$('#say');b.textContent=t;b.style.animation='none';b.offsetHeight;b.style.animation=''}
function fly(el,t){const r=el.getBoundingClientRect(),f=document.createElement('div');f.className='fly';f.textContent=t;f.style.left=(r.left+r.width/2-30)+'px';f.style.top=(r.top+20)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),800)}
const envBox=later=>`<div class="env${later?' later':''}"></div>`;
function pair(a,b){return `<div class="pick"><button class="opt" data-v="now" data-f="${a[0]}">${envBox()}<span class="amt">${a[0]}</span><span class="when"><b>${a[1]}</b></span></button><button class="opt" data-v="wait" data-f="${b[0]}">${envBox(1)}<span class="amt">${b[0]}</span><span class="when"><b>${b[1]}</b></span></button></div>`}
function render(){
  const kind=PLAN[st.i];$('#qn').textContent=(st.i+1)+'/'+PLAN.length;$('#pb').style.width=(st.i/PLAN.length*100)+'%';
  let h='<div class="card">';
  if(kind==='age'){say('先告诉我，你多大？');h+=`<p class="q">你的年龄段<small>用来和同龄人比</small></p><div class="ages">${AGES.map((a,j)=>`<button class="opt" data-v="${j}">${a.t}</button>`).join('')}</div>`}
  else if(kind==='guess'){say('先猜一下，你觉得自己有多不自律？');h+=`<div class="guess"><div class="gv" id="gv">50</div><div class="gn" id="gn"></div><input type="range" min="0" max="100" value="50" id="gr"><div class="gl" style="width:100%;padding:0"><span>0 很自律</span><span>100 很不自律</span></div></div><button class="go" id="next">就这个数</button>`}
  else if(kind==='near'){say('热身一下，送你一个红包');h+=`<p class="q">你选哪个？</p>`+pair(['¥100','今天到账'],['¥110','明天到账'])}
  else if(kind==='adj'){const l=DELAYS[st.idx][1];
    if(st.step===0)say('正题来了：两个红包，你挑一个');
    else say(st.trace[st.step-1].c==='wait'?`这么能等？那 ${l} 呢？`:`嫌太久？那只等 ${l} 呢？`);
    h+=`<span class="chip">讨价还价 ${st.step+1}/5</span>`+pair(['¥500','现在到账'],['¥1000',l+'后到账'])}
  else if(kind==='env'){say('这些，哪些是你的日常？');h+=`<p class="q">点中就算，可多选<small>一个都没有也行</small></p><div class="grid6">${ENV.map((e,j)=>`<button class="tile" data-j="${j}"><img src="${ICON[e.k]}" alt="">${e.t}</button>`).join('')}</div><button class="go" id="next">选好了</button>`}
  else if(kind==='far'){say('最后一个！这次是一年以后的红包');h+=`<p class="q">你选哪个？</p>`+pair(['¥100','一年后到账'],['¥110','一年零一天后'])}
  $('#qbox').innerHTML=h+'</div>';
  document.querySelectorAll('#qbox .opt').forEach(b=>b.onclick=()=>{b.classList.add('hot','pop');if(b.dataset.f)fly(b,'+'+b.dataset.f);setTimeout(()=>answer(b.dataset.v),300)});
  document.querySelectorAll('#qbox .tile').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;st.env.has(j)?st.env.delete(j):st.env.add(j);b.classList.toggle('on')});
  const gr=$('#gr');if(gr){const u=()=>{st.guess=+gr.value;$('#gv').textContent=gr.value;$('#gn').textContent=bandOf(+gr.value)[2]};gr.oninput=u;u()}
  const nx=$('#next');if(nx)nx.onclick=()=>answer();
}
const QUIP={now:['先拿到手再说。','落袋为安，懂。','现在的最实在。'],wait:['沉得住气。','行，等得起。','耐心 +1。']};
function answer(v){
  const kind=PLAN[st.i];
  if(kind==='age')st.age=+v;
  else if(kind==='adj'){st.trace.push({idx:st.idx,c:v});
    if(st.step<4)st.idx=Math.max(0,Math.min(DELAYS.length-1,st.idx+(v==='wait'?1:-1)*STEPS[st.step]));
    st.step++;toast(QUIP[v][Math.floor(Math.random()*3)])}
  else if(kind==='near')st.rev.near=v; else if(kind==='far')st.rev.far=v;
  st.i++; if(st.i<PLAN.length)render(); else calc();
}
function calc(){show('sc');$('#scAge').textContent=AGES[st.age].t;const ls=document.querySelectorAll('#sc .ln');ls.forEach(l=>l.classList.remove('on'));
  ls.forEach((l,j)=>setTimeout(()=>l.classList.add('on'),250+j*450));setTimeout(finish,1800)}
/* ===== 计算 ===== */
function ed50Days(trace){const L=trace[trace.length-1],a=DELAYS[L.idx][0],last=DELAYS.length-1;
  const nb=L.c==='wait'?(L.idx===last?a*1.6:DELAYS[L.idx+1][0]):(L.idx===0?a/1.6:DELAYS[L.idx-1][0]);return Math.sqrt(a*nb)}
function ncdf(z){const t=1/(1+.2316419*Math.abs(z)),d=.3989423*Math.exp(-z*z/2);let p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}
function fmtDur(d){if(d<1)return Math.round(d*24)+' 小时';if(d<14)return (Math.round(d*10)/10)+' 天';if(d<60)return Math.round(d/7)+' 周';if(d<365)return Math.round(d/M)+' 个月';return (Math.round(d/Y*10)/10)+' 年'}
function sOf(logk,envN){const P=Math.round((1-ncdf((REF.mu-logk)/REF.sd))*100),E=Math.round(envN/6*100);return{P,E,S:Math.max(1,Math.min(99,Math.round(WT.wait*P+WT.env*E)))}}
function scoreOf(trace,envN){const ed=ed50Days(trace);return Object.assign({ed},sOf(Math.log10(1/ed),envN))}
const PEERS={};
function peers(a){if(PEERS[a])return PEERS[a];let x=20261027+a;const rnd=()=>{x|=0;x=x+0x6D2B79F5|0;let t=Math.imul(x^x>>>15,1|x);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const A=AGES[a],out=[];for(let n=0;n<6000;n++){const z=Math.sqrt(-2*Math.log(rnd()+1e-12))*Math.cos(2*Math.PI*rnd());let e=0;for(let j=0;j<6;j++)if(rnd()<A.pe)e++;out.push(sOf(A.mu+REF.sd*z,e).S)}
  return PEERS[a]=out}
function peerStat(a,S){const p=peers(a);let hi=0,eq=0;p.forEach(v=>{if(v>S)hi++;else if(v===S)eq++});
  return{beat:Math.max(1,Math.min(99,Math.round((hi+eq/2)/p.length*100))),bands:BANDS.map(b=>Math.round(p.filter(v=>v>=b[0]&&v<b[1]).length/p.length*100)),avg:Math.round(p.reduce((s,v)=>s+v,0)/p.length)}}
function actions(r){const out=[];const order=['bed','night','push','home','snack','cart'];
  const picked=[...st.env].map(j=>ENV[j]).sort((a,b)=>order.indexOf(a.k)-order.indexOf(b.k));
  picked.slice(0,r.E>=50?2:1).forEach(e=>out.push({a:e.a,d:e.d,s:'改环境 · Duckworth 2016'}));
  if(r.P>=50)out.push({a:'花钱或放弃之前，先想 10 秒具体画面',d:'不要想“以后”，要想“下个月 15 号还花呗那天的我”。未来想得越具体，你就越愿意等。',s:'想象具体未来 · Peters & Büchel 2010'});
  out.push({a:'把“想做”绑在“该做”上',d:'好看的剧只在跑步、做家务的时候看。想看剧，就顺手把该做的做了。',s:'诱惑捆绑 · Milkman 2014'});
  out.push({a:'工资到账当天，先自动转走一小笔',d:'趁“以后的你”还没开始花，替他先做决定。',s:'预先承诺 · Thaler & Benartzi 2004'});
  return out.slice(0,3)}
function oneLine(r){
  if(r.P>=50&&r.E>=50)return '你不是懒：大脑本来就偏爱“现在”，诱惑又离你太近。';
  if(r.P>=50)return '环境挺干净，主要是大脑给“以后”打折太狠。这个能练。';
  if(r.E>=50)return '你其实挺能等，分数是被身边的诱惑拉高的。';
  return '能等，诱惑也少。保持住，别对自己太狠。'}
function histSvg(p,S){const bins=Array(10).fill(0);p.forEach(v=>bins[Math.min(9,Math.floor(v/10))]++);const mx=Math.max(...bins),W2=320,H2=92;
  return `<svg viewBox="0 0 ${W2} ${H2+18}" width="100%" role="img" aria-label="同龄人分布">${bins.map((b,j)=>{const h=b/mx*H2,me=Math.floor(Math.min(99,S)/10)===j;return `<rect x="${j*32+2}" y="${H2-h}" width="28" height="${h}" rx="4" fill="${me?'#D9695A':'#E8DCC8'}"/>`}).join('')}
  <text x="${Math.floor(Math.min(99,S)/10)*32+16}" y="${H2+14}" font-size="11" text-anchor="middle" fill="#D9695A" font-weight="700">你</text><text x="2" y="${H2+14}" font-size="10" fill="#958A7C">0</text><text x="318" y="${H2+14}" font-size="10" fill="#958A7C" text-anchor="end">100</text></svg>`}
/* ===== 结果页 ===== */
function finish(){const r=scoreOf(st.trace,st.env.size);show('s2');
  const rev=st.rev.near==='now'&&st.rev.far==='wait',A=AGES[st.age],ps=peerStat(st.age,r.S),b=bandOf(r.S),d=st.guess-r.S;
  const code=String(r.S).padStart(2,'0')+String(st.trace[4].idx).padStart(2,'0')+st.env.size+(rev?1:0)+A.c+Math.min(9,Math.floor(st.guess/10));
  xlT('end',{code,dur:Math.round((Date.now()-st.t0)/1000)});
  const vsl=d>=10?`比你以为的自律 ${d} 分`:d<=-10?`比你以为的更难扛 ${-d} 分`:'猜得很准，你很了解自己';
  const acts=actions(r);
  $('#res').innerHTML=`
  <div class="pc"><div class="pc-h"><span>小梨研究所 · 不自律值</span><span class="num">No.${code}</span></div>
   <div class="score"><img class="pear" src="${PEAR}" alt="" style="width:48px;height:48px"><div class="lb">你的不自律值</div><div class="big"><span id="roll">0</span><small>/100</small></div><div class="lv">${b[2]}</div></div>
   <div class="gauge"><s id="gs" style="left:0%;transition:left 1s cubic-bezier(.3,1.3,.5,1)"></s></div><div class="gl"><span>0 很自律</span><span>100 很难扛</span></div>
   <div class="vs"><span>你猜 <b>${st.guess}</b></span><span>·</span><span>实测 <b>${r.S}</b></span></div><div class="vsl">${vsl}</div>
   <div class="peer">在 ${A.t}同龄人里，你比 <b>${ps.beat}%</b> 的人更自律</div>
   <p class="one">${oneLine(r)}</p>
   <div class="pc-f"><span>xiaolipearl.com</span><span>截图发给朋友比一比</span></div></div>

  <div class="sect"><h3>同龄人里，你在这</h3><p class="sub">${A.t}估算分布 · 平均 ${ps.avg} 分</p>${histSvg(peers(st.age),r.S)}
   <div class="bands">${BANDS.map((x,j)=>`<div class="band${x===b?' me':''}"><b>${x[2]}</b><span>${x[3]}</span><em>${ps.bands[j]}%</em></div>`).join('')}</div></div>

  <div class="sect"><h3>你的分数拆开看</h3>
   <div class="meter2"><div class="ph"><b>难等程度</b><span>${r.P}</span></div><div class="bar2"><i style="width:${r.P}%"></i></div><p>等 ${fmtDur(r.ed)}，1000 块在你心里就只值 500 了</p></div>
   <div class="meter2"><div class="ph"><b>环境诱惑</b><span>${r.E}</span></div><div class="bar2"><i style="width:${r.E}%"></i></div><p>身边 6 个常见诱惑，你中了 ${st.env.size} 个</p></div>
   <div class="eq">不自律值 = 难等×70% + 诱惑×30%</div>
   <div class="meter2"><div class="ph"><b>“今天”效应</b><span>${rev?'中招':'没中'}</span></div><p>${rev?'今天不愿多等一天，换成一年后却愿意。差别只是“今天”两个字。':'第 3 题和最后一题，你前后一致。很多人在这里会反过来。'}</p></div></div>

  <div class="sect"><h3>凭什么这么算</h3><p class="sub">点开看细节，不看也没关系。</p><div class="badges">
   <details><summary><b>《Science》</b><span>2004 · 大脑对“现在”有额外奖赏</span></summary><p>McClure 等用脑成像发现：选项里只要有“马上能拿到”，奖赏系统就额外活跃；两个都在未来时就没有。这就是“今天”效应。</p></details>
   <details><summary><b>5 题调整法</b><span>2014 · 5 题≈长版测试</span></summary><p>Koffarnus & Bickel 设计：你选现在，下一题缩短等待；选等，就拉长，每次步子减半。5 题锁定你的位置，结果和几十题的长版高度一致。讨价还价那 5 题就是它。</p></details>
   <details><summary><b>元分析</b><span>2017 · 越难等，成瘾越重</span></summary><p>Amlung 等汇总大量研究：越难等的人，烟酒、赌博等成瘾行为往往越严重（r = 0.14，不强但很稳）。海洛因成瘾者的折扣率约是常人 2 倍（Kirby 1999）。</p></details>
   <details><summary><b>205 人 · 7827 次</b><span>2012 · 冲动输赢看环境</span></summary><p>Hofmann 等让 205 个成年人带提示器生活一周，记下 7827 次“想要”。哪些冲动最后会赢，环境影响很大。Duckworth 2016 也总结：越早改环境越省力，硬扛最费劲。</p></details>
   <details><summary><b>越年轻越难等</b><span>年龄研究 · 同龄人常模</span></summary><p>Green 等 1994 年发现：孩子比年轻人更难等，年轻人又比年长者更难等；Reimers 等 2009 年在数万人的在线样本里也看到同样规律。同龄人分布按这个规律估算，测的人多了会换成实测数据。</p></details>
   <details><summary><b>双曲折扣</b><span>1987 · 先陡后平的曲线</span></summary><p>Mazur 提出：人给未来打折不是匀速的，从“现在”到“明天”跌得最狠，一年后再多一天几乎不跌。所以“今天”效应才会出现。</p></details>
  </div></div>

  <div class="sect"><h3>怎么把它降下来</h3>${acts.map((a,j)=>`<div class="act"><i>${j+1}</i><div><b>${a.a}</b><span class="src">${a.s}</span><details><summary>为什么有用</summary>${a.d}</details></div></div>`).join('')}</div>
  <button class="ghost" id="again">再测一次</button>
  <details class="more"><summary>查看全部 12 篇论文 · 说明</summary><p>Koffarnus & Bickel 2014, Exp Clin Psychopharmacol · McClure et al. 2004, Science · Amlung et al. 2017, Addiction · Kirby, Petry & Bickel 1999, J Exp Psychol Gen · Hofmann et al. 2012, J Pers Soc Psychol · Duckworth, Gendler & Gross 2016, Perspect Psychol Sci · Green, Fry & Myerson 1994, Psychol Sci · Reimers et al. 2009, Pers Individ Dif · Mazur 1987 · Peters & Büchel 2010, Neuron · Milkman, Minson & Volpp 2014, Manage Sci · Thaler & Benartzi 2004, J Polit Econ<br><br>同龄人比较是根据上述研究估算的，测的人多了会换成实测数据。分数不是越低越好：永远在等，也是一种失衡。本测试不是心理诊断。</p></details>`;
  const t0=performance.now(),el=$('#roll');(function tick(t){const k=Math.min(1,(t-t0)/900);el.textContent=Math.round(r.S*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(tick)})(t0);
  setTimeout(()=>$('#gs').style.left=r.S+'%',50);
  $('#again').onclick=()=>{reset();xlT('start');show('s1');render()};
}
reset();
$('#goBtn').onclick=()=>{reset();xlT('start');show('s1');render()};
</script></body></html>
