<body>
<style>
/* Layout: a cream-toned "ins" studio desk. Brand strip / status bar / briefing + portfolio / decision.
   One deliberate light cream look in both themes (no external fonts: system stacks only, so it loads anywhere).
   Pixel-art characters and a pixel pear mascot are drawn from tiny maps at runtime. */
:root{
  --bg:#F6EFE4; --s1:#FFFBF4; --s2:#F3EADB; --line:#E8DCC8; --fg:#3E3833; --mut:#958A7C;
  --gold:#E3A33B; --gain:#4F9A70; --loss:#D9695A; --blue:#6F98CF; --violet:#9C82CF;
  --paper:#FFF6E6; --ink:#3E3833; --inkm:#6B6157; --pear:#B8CC6E;
  --f-display:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif; --f-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif; --f-num:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
#wm{position:fixed;inset:0;pointer-events:none;z-index:40;background-repeat:repeat;opacity:1}
.wmtag{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:41;pointer-events:none;font-size:12px;font-weight:700;color:#7A6A55;background:rgba(255,251,244,.85);border:1px solid var(--line);border-radius:999px;padding:4px 10px;box-shadow:0 4px 12px rgba(160,125,80,.12)}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand .pear{width:40px;height:40px}
.brand b{font-size:20px;font-weight:900;letter-spacing:.02em}
.brand small{color:var(--mut);font-size:12.5px}
.spark{display:inline-flex;gap:6px;margin-left:auto}
.spark img{width:18px;height:18px}
.disc{font-size:11.5px;color:var(--mut);background:var(--s1);border:1px dashed var(--line);border-radius:12px;padding:8px 12px;line-height:1.6}
html,body{background:var(--bg)}
body{background-image:radial-gradient(circle at 8% 12%,#FBE3D6 0,transparent 28%),radial-gradient(circle at 92% 30%,#E6EFD8 0,transparent 26%),radial-gradient(circle at 70% 95%,#F7E7C4 0,transparent 30%);background-attachment:fixed}
body{color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.55;padding-inline:16px;padding-block:14px 32px}
.game{max-width:1220px;margin:0 auto;display:grid;gap:12px;position:relative}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.bar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:900px){.bar{grid-template-columns:repeat(3,minmax(0,1fr))}}
.res{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:9px 13px;min-width:0;box-shadow:0 6px 16px rgba(160,125,80,.07)}
.res .k{font-size:11.5px;color:var(--mut)}
.res .v{font-family:var(--f-num);font-weight:700;font-size:20px;line-height:1.25;white-space:nowrap}
.res .s{font-size:11px;color:var(--mut);font-family:var(--f-num);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:6px;border-radius:4px;background:var(--s2);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;transition:width .6s}
.main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:920px){.main{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px 16px;min-width:0;box-shadow:0 8px 22px rgba(160,125,80,.08)}
.panel h3{margin:0 0 8px;font-size:12px;letter-spacing:.1em;color:var(--mut);font-weight:700;display:flex;justify-content:space-between;gap:8px}
.brief{background:var(--paper);color:var(--ink);border-radius:18px;border:1px solid var(--line);box-shadow:0 8px 22px rgba(160,125,80,.08);padding:14px 16px;display:grid;gap:10px}
.brief .t{font-family:var(--f-num);font-size:11px;letter-spacing:.14em;color:#8A5A10}
.brief h2{font-family:var(--f-display);font-weight:900;font-size:clamp(20px,2.6vw,26px);line-height:1.3;margin:0;text-wrap:balance}
.brief ul{margin:0;padding-left:18px;display:grid;gap:4px;color:#2F333C}
.facts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media (max-width:560px){.facts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.facts>div{background:#E4DDCD;border-radius:8px;padding:5px 8px;min-width:0}
.facts .k{font-size:11px;color:#5B5F68}
.facts .v{font-weight:700;font-size:13.5px}
.chartbox{position:relative;height:200px}
#chart,.chartbox canvas{display:block;width:100%;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--mut);margin-top:4px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.state{display:grid;gap:10px}
.expo{display:grid;gap:7px}
.erow{display:grid;grid-template-columns:76px minmax(0,1fr) 48px;gap:8px;align-items:center;font-size:13px}
.erow .k{color:var(--mut)}
.ebar{position:relative;height:12px;background:var(--s2);border-radius:6px}
.ebar::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--mut)}
.ebar i{position:absolute;top:2px;bottom:2px;border-radius:4px;transition:all .5s}
.erow .n{font-family:var(--f-num);text-align:right}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv>div{background:var(--s2);border-radius:8px;padding:6px 8px;min-width:0}
.kv .k{font-size:11px;color:var(--mut)}
.kv .v{font-family:var(--f-num);font-weight:700;font-size:15px}
.caps{display:flex;flex-wrap:wrap;gap:6px}
.cap{font-size:12px;border-radius:999px;padding:2px 10px;border:1px solid var(--line);color:var(--mut)}
.cap.on{border-color:var(--gold);color:var(--gold)}
/* decision */
.dq{font-family:var(--f-display);font-weight:900;font-size:19px;line-height:1.4;margin:0 0 4px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:920px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{background:var(--s1);border:1.5px solid var(--line);border-radius:16px;padding:12px 13px;text-align:left;display:grid;gap:7px;align-content:start;position:relative}
.opt:hover{border-color:color-mix(in srgb,var(--gold) 60%,var(--line))}
.opt.sel{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--s2))}
.opt .ol{font-family:var(--f-num);font-size:11px;color:var(--gold)}
.opt .on{font-weight:900;font-size:16px;line-height:1.35}
.opt .sec{font-size:11.5px;color:var(--mut);letter-spacing:.06em}
.opt .tx{font-size:13px;color:#6B6157}
.eff{display:flex;flex-wrap:wrap;gap:5px}
.eff span{font-family:var(--f-num);font-size:11.5px;border-radius:6px;padding:1px 7px;background:var(--s1);border:1px solid var(--line)}
.eff .p{color:var(--gain)}.eff .m{color:var(--loss)}.eff .c{color:var(--gold)}
.go{border:0;border-radius:999px;box-shadow:0 4px 0 #C98A2A;padding:13px 18px;background:var(--gold);color:var(--ink);font-weight:900;font-size:16px}
.go:disabled{opacity:.4;cursor:not-allowed}
.ghost{border:1px solid var(--line);background:var(--s2);border-radius:10px;padding:10px 14px;font-size:13.5px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
/* overlay */
.ov{position:fixed;inset:0;background:var(--bg);z-index:30;display:grid;place-items:start center;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(76px + env(safe-area-inset-bottom,0px));overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.ov>.box{margin:0 auto}
.box{max-width:880px;width:100%;display:grid;gap:14px}
.box .eyebrow{font-family:var(--f-num);font-size:11px;letter-spacing:.16em;color:var(--gold)}
.box h1,.box h2{font-family:var(--f-display);font-weight:900;margin:0;line-height:1.25;text-wrap:balance}
.box h1{font-size:clamp(28px,5vw,46px)}
.box h2{font-size:clamp(21px,3.4vw,29px)}
.box p{margin:0;color:var(--mut);text-wrap:pretty}
.box .lead{color:var(--fg);font-size:15.5px;line-height:1.75}
.story{background:var(--paper);color:var(--ink);border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.story .t{font-family:var(--f-num);font-size:11px;letter-spacing:.12em;color:#8A5A10}
.story .h{font-family:var(--f-display);font-weight:900;font-size:19px;line-height:1.45}
.story p{color:#2F333C!important}
.result{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.result{grid-template-columns:1fr 1fr}}
.result>div{background:var(--s1);border-radius:10px;padding:10px 12px}

},true);

const lpCancel=e=>{if(lpTimer){clearTimeout(lpTimer);lpTimer=null}document.querySelectorAll(".lp").forEach(x=>x.classList.remove("lp"));if(e&&e.type==="pointerup"&&!lpFired)lpStart=null};
document.addEventListener("pointerup",lpCancel);document.addEventListener("pointercancel",lpCancel);

<script>
/* ===================== 状态与规则 ===================== */
const $=id=>document.getElementById(id);
const pct=(v,d=1)=>(v>=0?"+":"")+(v*100).toFixed(d)+"%";
const yi=n=>(n/1e8).toFixed(n>=1e10?0:1)+" 亿";
const wan=n=>(n/1e4).toFixed(1)+" 万";
const sn=o=>o.nm.split(/[：，]/)[0];
const GY0=2027, LEN=YEARS.length, KS=.8, KC=.4, STAKE=1e5;
let G=null;
function initState(){return {i:0,nav:1,idx:1,aum:5e8,rep:60,alpha:.04,crowd:.4,capY:30,lev:1,exp:{V:-.3,M:.4,S:0,Q:-.1},caps:[],choice:null,
     navH:[1],idxH:[1],cum:0,lastEx:null,log:[],closed:false,over:null,busy:false,hwm:1,income:0}}
function newRun(){G=initState();intro()}
const hasC=k=>G.caps.includes(k);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function applyEffect(e){
  const ex=G.exp;
  if(e.mult!=null)SK.forEach(k=>ex[k]*=e.mult);
  if(e.scale!=null){SK.forEach(k=>ex[k]*=e.scale);G.alpha*=e.scale;G.lev*=e.scale}
  SK.forEach(k=>{if(e[k])ex[k]+=e[k]});SK.forEach(k=>ex[k]=clamp(+ex[k].toFixed(3),-1,1));
  if(e.alpha)G.alpha+=e.alpha;
  if(e.crowd)G.crowd=clamp(G.crowd+e.crowd,0,1);
  if(e.capAdd)G.capY+=e.capAdd;
  if(e.cap&&!hasC(e.cap))G.caps.push(e.cap);
  if(e.close)G.closed=true;
  if(e.aum){G.aum*=1+e.aum;G.closed=false}
  if(e.rep)G.rep=clamp(G.rep+e.rep,0,100);
}
function effChips(e){const c=[];
  SK.forEach((k,i)=>{if(e[k])c.push(`<span class="${e[k]>0?"p":"m"}">${SN[i]}暴露 ${e[k]>0?"+":""}${e[k]}</span>`)});
  if(e.mult!=null)c.push(`<span class="c">所有风格暴露 ×${e.mult}</span>`);
  if(e.scale!=null)c.push(`<span class="c">暴露和阿尔法 ×${e.scale}</span>`);
  if(e.alpha)c.push(`<span class="${e.alpha>0?"p":"m"}">基础阿尔法 ${pct(e.alpha)}</span>`);
  if(e.now)c.push(`<span class="m">今年研发投入 ${pct(e.now)}</span>`);
  if(e.crowd)c.push(`<span class="${e.crowd<0?"p":"m"}">拥挤度 ${e.crowd>0?"+":""}${Math.round(e.crowd*100)}</span>`);
  if(e.capAdd)c.push(`<span class="p">容量 +${e.capAdd} 亿</span>`);
  if(e.aum)c.push(`<span class="c">规模 +${Math.round(e.aum*100)}%</span>`);
  if(e.close)c.push(`<span class="c">封盘：不再接收新资金</span>`);
  if(e.rep)c.push(`<span class="p">渠道信任 +${e.rep}</span>`);
  if(e.cap)c.push(`<span class="c">建成：${CAPS[e.cap][0]}</span>`);
  if(!c.length)c.push(`<span>组合不做调整</span>`);
  return c.join("");}

/* 年末演化：净值、渠道、资金、行业变化（游戏和全路径模拟共用） */
function evolve(r,excess){
  const R=r+excess-.01;
  G.nav*=1+R;G.idx*=1+r;G.cum=(1+G.cum)*(1+excess)-1;G.lastEx=excess;
  let dRep=clamp(Math.round(excess*220),-25,20);if(R<-.2)dRep-=3;
  G.rep=clamp(G.rep+dRep,0,100);
  let flow=(G.rep-55)/60;if(G.closed)flow=Math.min(0,flow);
  const aum0=G.aum,aumPre=G.aum*(1+R);
  const perf=G.nav>G.hwm?.2*(G.nav-G.hwm)/G.nav*aumPre:0;G.hwm=Math.max(G.hwm,G.nav);
  G.income+=.01*aum0+perf;
  G.aum=aumPre*(1+flow);
  const decay=hasC("ml")?.0015:.003, cg=hasC("alt")?.02:.04;
  G.alpha=Math.max(0,G.alpha-decay);G.crowd=clamp(G.crowd+cg,0,1);
  return {R,dRep,flow,decay,cg};
}
/* 全部 3^10 种走法：用和游戏完全相同的规则跑一遍 */
let ALL=null;
function simPath(ch){const keep=G;G=initState();const nav=[1],idx=[1],ex=[];let dead=false;
  for(let i=0;i<LEN;i++){G.i=i;const Y=YEARS[i],e=Y.opts[ch[i]].eff;applyEffect(e);const {r,excess}=settle(Y,e.now||0);evolve(r,excess);nav.push(G.nav);idx.push(G.idx);ex.push(excess);if(G.rep<=0){dead=true;break}}
  const out={nav,idx,ex,cum:G.cum,dead,n:ex.length,ann:Math.pow(1+G.cum,1/ex.length)-1,aum:G.aum,income:G.income};G=keep;return out}
function simAll(){if(ALL)return ALL;const N=Math.pow(3,LEN),score=new Float32Array(N);let bi=0,wi=0;const types={};
  for(let m=0;m<N;m++){let x=m;const ch=[];for(let i=0;i<LEN;i++){ch.push(x%3);x=Math.floor(x/3)}const o=simPath(ch);const tc=typeOf(ch,o.n);types[tc]=(types[tc]||0)+1;score[m]=o.dead?-1+o.ann*0:o.ann;if(o.dead)score[m]=-1+o.n/100;if(score[m]>score[bi])bi=m;if(score[m]<score[wi])wi=m}
  const sorted=Float32Array.from(score).sort();const med=sorted[N>>1];let mi=0,md=9;for(let m=0;m<N;m++){const d=Math.abs(score[m]-med);if(d<md){md=d;mi=m}}
  const dec=m=>{const ch=[];for(let i=0;i<LEN;i++){ch.push(m%3);m=Math.floor(m/3)}return ch};
  ALL={N,score,sorted,best:dec(bi),worst:dec(wi),median:dec(mi),deadN:sorted.filter(v=>v<-.5).length,types};return ALL}
/* 结算：每一项都可追溯到状态 */
function settle(Y,now){
  const r=CLOSE[Y.y]/CLOSE[Y.y-1]-1, s=Y.out.s, ex=G.exp, lines=[];
  const alphaEff=G.alpha*(1-.4*G.crowd);
  lines.push(["基础阿尔法",`${pct(G.alpha)} ×（1 − 0.4 × 拥挤度 ${G.crowd.toFixed(2)}）`,alphaEff,"alpha"]);
  const cap=G.capY*1e8;let capDrag=0;if(G.aum>cap){capDrag=alphaEff*(Math.sqrt(cap/G.aum)-1);lines.push(["容量稀释",`规模 ${yi(G.aum)} > 容量 ${yi(cap)}`,capDrag,"capDrag"])}
  const sm=hasC("risk")?.6:1;
  SK.forEach((k,i)=>{const v=ex[k]*s[i]*KS*sm;if(Math.abs(ex[k])>=.01)lines.push([`${SN[i]}风格`,`暴露 ${ex[k].toFixed(2)} × 今年${SN[i]} ${pct(s[i],0)} × ${KS}${sm<1?" × 风险模型 0.6":""}`,v,k])});
  if(Y.out.crowd>0){const cl=-Y.out.crowd*G.crowd*KC*G.lev*(hasC("monitor")?.4:1);lines.push(["拥挤踩踏",`踩踏强度 ${Y.out.crowd} × 拥挤度 ${G.crowd.toFixed(2)} × ${KC}${G.lev!==1?" × 仓位倍数 "+G.lev.toFixed(2):""}${hasC("monitor")?" × 监控 0.4":""}`,cl,"crowdLoss"])}
  const cost=-.01*(1+G.aum/5e9)*(hasC("algo")?.6:1)*.5;lines.push(["交易成本",`0.5% ×（1 + 规模 / 50 亿）${hasC("algo")?" × 算法交易 0.6":""}`,cost,"tcost"]);
  if(now)lines.push(["今年的研发投入","新能力建设期的一次性成本",now,null]);
  const excess=lines.reduce((a,l)=>a+l[2],0);
  return {r,excess,lines};
}
function runYear(){
  if(!G||G.busy||G.choice==null||G.over)return;G.busy=true;TR.yt.push(Math.round((Date.now()-TR.ds)/1000));
  const Y=YEARS[G.i],opt=Y.opts[G.choice],e=opt.eff;
  const cf=counterfactual();
  applyEffect(e);
  const {r,excess,lines}=settle(Y,e.now||0);
  const n0=G.nav,i0=G.idx;
  const {R,dRep,flow,decay,cg}=evolve(r,excess);
  G.log.push({i:G.i,y:Y.y,r,excess,choice:opt.nm,dRep,flow,adv:ADV[G.i][G.choice][0],cf,c:G.choice});
  if(G.rep<=0)G.over=true;
  track(G.over?"dead":"year",{y:G.log.length});
  G.navH.push(G.nav);G.idxH.push(G.idx);
  animate(n0,G.nav,i0,G.idx,()=>{G.busy=false;report(Y,opt,r,excess,lines,R,dRep,flow,decay,cg,cf)});
}


/* ===================== 像素小人（原创 12×12 像素图，运行时绘制） ===================== */

 jie:{pal:{H:"#E8823A",C:"#F2B880"},rows:["..H.H.H.H...",".HHHHHHHHHH.",".HHHSSSSHHH.",...FACE,...BODY]},
 zhou:{pal:{H:"#A8A39C",C:"#8FB0DA"},rows:["............","..HHHHHHHH..",".HSSSSSSSSH.",".SSSSSSSSSS.",".GGEGSSGEGG.",".SBSSSSSSBS.",".SSSSMMSSSS.","..SSSSSSSS..",...BODY]},
 lin:{pal:{H:"#5A463B",C:"#9CC6A6"},rows:["...HHHHHH...",".HHHHHHHHHH.",".HHSSSSSSHH.",".HSSSSSSSSH.",".HSESSSSESH.",".HBSSSSSSBH.",".HSSSMMSSSH.","..SSSSSSSS..",...BODY]},

 wang:{pal:{H:"#7A5C48",C:"#5F6F92",T:"#D9695A"},rows:["............","...SSSSSS...",".HSSSSSSSSH.",...FACE,"...CCTTCC...","..CCCTTCCC..",".CCCCTTCCCC.",".CCCCTTCCCC."]},
 aunt:{pal:{H:"#9C8FB0",C:"#C98FA6"},rows:[".HH.HH.HH...","HHHHHHHHHHH.","HHHSSSSSSHHH","HSSSSSSSSSSH","HSSESSSSESSH","HSBSSSSSSBSH",".SSSSMMSSSS.","..SSSSSSSS..","...CCCCCC...","..CCCCCCCC..",".CCCCCCCCCC.",".CCCCCCCCCC."]},
 pear:{pal:{b:"#8A6A4A",L:"#7FB06A",P:"#C9D98B",E:"#3E3833",B:"#F2A39A",M:"#C9665A"},rows:["......b.....","......bLL...",".....PP.....","....PPPP....","....PPPP....","...PPPPPP...","..PPEPPEPP..",".PPBPPPPBPP.",".PPPPMMPPPP.",".PPPPPPPPPP.","..PPPPPPPP..","...PPPPPP..."]},
 star:{pal:{Y:"#F2C14E"},rows:[".....Y......",".....Y......","....YYY.....","YYYYYYYYYYY.",".YYYYYYYYY..","..YYYYYYY...","..YYY.YYY...",".YY.....YY..","............","............","............","............"]},
 heart:{pal:{R:"#F2A39A"},rows:["............",".RRR...RRR..","RRRRR.RRRRR.","RRRRRRRRRRR.","RRRRRRRRRRR.",".RRRRRRRRR..","..RRRRRRR...","...RRRRR....","....RRR.....",".....R......","............","............"]},
};
const SPRC={};
function sprite(k){if(SPRC[k])return SPRC[k];const d=SPR[k],c=document.createElement("canvas");c.width=12;c.height=12;const x=c.getContext("2d");
  d.rows.forEach((row,y)=>{for(let i=0;i<12;i++){const ch=row[i]||".";const col=(d.pal&&d.pal[ch])||PAL[ch];if(col){x.fillStyle=col;x.fillRect(i,y,1,1)}}});
  return SPRC[k]=c.toDataURL()}
function av(k,size){const c=CH[k];return `<i class="av" style="--c:${c[2]}${size?`;width:${size}px;height:${size}px`:""}"><img src="${sprite(k)}" alt="${c[0]}"></i>`}
/* 全屏水印 */
function watermark(){const c=document.createElement("canvas"),W=300,H=170;c.width=W;c.height=H;const x=c.getContext("2d");x.translate(W/2,H/2);x.rotate(-Math.PI/9);
  x.font='600 15px "PingFang SC","Microsoft YaHei",sans-serif';x.fillStyle="rgba(110,90,60,.09)";x.textAlign="center";x.textBaseline="middle";x.fillText("@小梨 有价值的财商分享",0,0);
  const el=document.getElementById("wm");el.style.backgroundImage=`url(${c.toDataURL()})`;el.style.backgroundSize=`${W}px ${H}px`}
function decorate(){document.getElementById("brandPear").src=sprite("pear");document.getElementById("spark").innerHTML=["star","heart","star"].map(k=>`<img class="px" src="${sprite(k)}" alt="">`).join("");watermark()}
function clueText(c){return typeof c[2]==="function"?c[2]():c[2]}
function clueHTML(c){const k=KIND[c[0]],who=c[1]?CH[c[1]]:null;
  const head=c[0]==="chat"?av(c[1]):`<span class="badge" style="--c:${k[1]}">${k[0]}</span>`;
  return `<div class="clue${c[0]==="news"?" news":""}">${head}<div><div class="who">${who?`${who[0]} · ${who[1]}`:(c[5]?`<span class="src" style="margin:0">${c[5]}</span>`:k[0])}<span class="tagc">${c[3]}</span></div><div class="txt">${clueText(c)}</div><details class="hint"><summary>解读 ›</summary><div>${c[4]}</div></details></div></div>`}
function plainChips(e){const c=[],P=(t,cls)=>c.push(`<span class="${cls||"c"}">${t}</span>`);
  if(e.V>0)P("更偏便宜的股票");if(e.V<0)P("更偏贵的成长股");
  if(e.M>0)P("更追近期强势股");if(e.M<0)P("少追强势股");
  if(e.S>0)P("更偏小公司");if(e.Q>0)P("更偏赚钱的好公司");if(e.Q<0)P("接受质量差一些的公司");
  if(e.mult!=null)P("减少所有风格押注");if(e.scale!=null)P(e.scale>1?"整体加大仓位":"整体降低仓位");
  if(e.alpha>0)P("选股能力提升","p");if(e.now)P("今年有研发成本","m");
  if(e.crowd<0)P("和同行更不一样","p");if(e.crowd>0)P("和同行更像","m");
  if(e.aum)P("规模变大");if(e.close)P("封盘");if(e.capAdd)P("能管更多钱","p");
  if(e.cap)P("建成："+CAPS[e.cap][0],"p");if(!c.length)P("保持不变");return c.join("")}
function counterfactual(){const keep=JSON.stringify(G),Y=YEARS[G.i];const res=Y.opts.map(o=>{G=JSON.parse(keep);applyEffect(o.eff);return settle(Y,o.eff.now||0).excess});G=JSON.parse(keep);return res}
function record(k){let w=0,t=0;G.log.forEach(l=>ADV[l.i].forEach((a,j)=>{if(a[0]===k){t++;if(l.cf[j]===Math.max(...l.cf))w++}}));return [w,t]}
function recap(){if(!G.log.length)return "";const l=G.log[G.log.length-1],A=ADV[l.i],O=YEARS[l.i].opts;
  const b=l.cf.indexOf(Math.max(...l.cf)),w=l.cf.indexOf(Math.min(...l.cf)),me=A[l.c][0],bk=A[b][0],wk=A[w][0];
  const C=v=>v>=0?"var(--gain)":"var(--loss)";
  return `<div class="recap"><div class="h">前情提要 · ${GY0+l.i} 年</div>
   <div class="ln">${av(me,28)}<span>你听了 <b>${CH[me][0]}</b> 的「${sn(O[l.c])}」，超额 <b style="color:${C(l.excess)}">${pct(l.excess)}</b></span></div>
   ${b!==l.c?`<div class="ln">${av(bk,28)}<span>${WIN_LINE[bk]||""}</span></div>`:`<div class="ln">${av(me,28)}<span>${WIN_LINE[me]||""}</span></div>`}
   ${w!==l.c&&wk!==bk?`<div class="ln">${av(wk,28)}<span>${LOSE_LINE[wk]||""}</span></div>`:w===l.c?`<div class="ln">${av(me,28)}<span>${LOSE_LINE[me]||""}</span></div>`:""}
   <div class="ln">${av("aunt",28)}<span>张阿姨的 10 万，现在是 <b style="color:${G.nav>=1?"var(--gain)":"var(--loss)"}">${wan(G.nav*STAKE)}</b></span></div>
   <div class="rec">${["jie","zhou","lin","lily","wang"].map(k=>{const r=record(k);return r[1]?`<span>${CH[k][0]} 说对 ${r[0]}/${r[1]}</span>`:""}).join("")}</div></div>`}
function scene(){
  const S=SCENES[G.i];let k=0;
  const draw=()=>{overlay(`<div class="box"><div class="eyebrow">${GY0+G.i} 年 1 月 · 早间新闻 ${Math.min(k+1,S.length)} / ${S.length}</div><h2>${YEARS[G.i].title}</h2>${k===0?recap():""}
    <div class="feed">${S.slice(0,k+1).map(clueHTML).join("")}</div>
    <div class="btns">${k<S.length-1?`<button class="go" type="button" id="nx">下一条（空格）</button><button class="ghost" type="button" id="skip">跳过</button>`:`<button class="go" type="button" id="nx">进入投资决策会</button>`}</div>
    <p class="foot">都是年初就能知道的信息</p></div>`);
    const f=$("ov").querySelector(".feed");f.lastElementChild&&f.lastElementChild.scrollIntoView({block:"nearest",behavior:"smooth"});
    $("nx").onclick=()=>{if(k<S.length-1){k++;draw()}else{closeOv();render();window.scrollTo(0,0);TR.ds=Date.now()}};
    const sk=$("skip");if(sk)sk.onclick=()=>{k=S.length-1;draw()}};
  draw();
}

/* ===================== 渲染 ===================== */
function render(){
  const Y=YEARS[Math.min(G.i,LEN-1)];
  $("rYear").textContent=GY0+G.i;$("rRound").textContent=`第 ${Math.min(G.i+1,LEN)} / ${LEN} 年`;
  $("rNav").textContent=wan(G.nav*STAKE);$("rNav").style.color=G.nav<1?"var(--loss)":"var(--fg)";$("rIdx").textContent=`买指数：${wan(G.idx*STAKE)}`;
  $("rEx").textContent=pct(G.cum);$("rEx").style.color=G.cum>=0?"var(--gain)":"var(--loss)";$("rExY").textContent="去年 "+(G.lastEx==null?"–":pct(G.lastEx));
  $("rAum").textContent=yi(G.aum);$("rCap").textContent=`容量 ${G.capY} 亿${G.closed?" · 已封盘":""}`;$("rCap").style.color=G.aum>G.capY*1e8?"var(--loss)":"";
  $("rRep").textContent=G.rep;$("mRep").style.width=G.rep+"%";$("mRep").style.background=G.rep<25?"var(--loss)":"var(--blue)";
  $("rAlpha").textContent=(G.alpha*100).toFixed(1)+"%";
  // briefing
  const S=SCENES[Math.min(G.i,LEN-1)];

  const X=i=>pad.l+(w-pad.l-pad.r)*i/LEN,Yv=v=>pad.t+(h-pad.t-pad.b)*(1-(v-lo)/(hi-lo));

function cogScore(){

    const got=ys.map(i=>G.log.find(l=>l.i===i)).filter(Boolean);
    if(!got.length)return {dim,title,body,ys,lock:true,score:0};
    const pts=got.map(l=>{const s=[...l.cf].sort((a,b)=>b-a),v=l.cf[l.c];return v>=s[0]-1e-9?1:v<=s[2]+1e-9?0:.5});

    const miss=got.filter((l,k)=>pts[k]<1).map(l=>({y:GY0+l.i,gap:Math.max(...l.cf)-l.cf[l.c]}));
    return {dim,title,body,ys,lock:false,score,had:score>=75,miss}});
}

function endStats(){

const EVT=[[.2,"泡沫顶点",1,0],[2.77,"熊市谷底",1,1],[7.6,"量化地震",0,1],[8.7,"雷曼倒闭",1,0],[9.19,"危机谷底",0,1]];
function fundLine(nav,ex){const NQ0=t=>TL.find(p=>p[0]===t)[1];const out=[];const n=ex.length;
  TL.forEach(([t,nq])=>{if(t>n+1e-9)return;const i=Math.floor(t+1e-9),f=t-i;
    if(f<1e-9){out.push([t,nav[i]]);return}
    if(i>=n)return;const r=nq/NQ0(i)-1;out.push([t,nav[i]*(1+r+(ex[i]-.01)*f)])});return out}
function drawEnd(P,A,me){
  {const {x,w,h}=fit($("endChart"));const pad={l:44,r:w<520?78:92,t:34,b:26};
   const sp=TL.map(p=>[p[0],p[2]/TL[0][2]]),nq=TL.map(p=>[p[0],p[1]/TL[0][1]]);
   const best=fundLine(P.best.nav,P.best.ex),worst=fundLine(P.worst.nav,P.worst.ex),mine=fundLine(G.navH,G.log.map(l=>l.excess));
   const all=[...sp,...nq,...best,...worst,...mine].map(p=>p[1]);const hi=Math.max(...all)*1.08,lo=0;
   const X=t=>pad.l+(w-pad.l-pad.r)*t/10,Y=v=>pad.t+(h-pad.t-pad.b)*(1-(v-lo)/(hi-lo));
   x.font="11px ui-monospace, Menlo, monospace";
   const step=hi>1.6?.5:.25;
   for(let v=0;v<=hi;v+=step){x.strokeStyle="#EADFCD";x.lineWidth=1;x.beginPath();x.moveTo(pad.l,Y(v));x.lineTo(w-pad.r,Y(v));x.stroke();x.fillStyle="#A39684";x.textAlign="right";x.textBaseline="middle";x.fillText(+(v*10).toFixed(1)+"万",pad.l-6,Y(v))}
   x.setLineDash([3,3]);x.strokeStyle="#C9BBA4";x.beginPath();x.moveTo(pad.l,Y(1));x.lineTo(w-pad.r,Y(1));x.stroke();x.setLineDash([]);
      x.textAlign="center";x.textBaseline="top";for(let k=0;k<=10;k++){if(w<520&&k%2)continue;x.fillText(String(2000+k-1).slice(2)==="99"?"起点":"'"+String(2000+k-1).slice(2),X(k),h-pad.b+6)}
   // events
   x.font='11px "PingFang SC","Microsoft YaHei",sans-serif';
   const narrow=w<520;EVT.filter(e=>!narrow||e[2]).forEach(([t,lab,_,row],k)=>{x.strokeStyle="rgba(160,140,110,.35)";x.setLineDash([2,4]);x.beginPath();x.moveTo(X(t),pad.t-4);x.lineTo(X(t),h-pad.b);x.stroke();x.setLineDash([]);
     x.fillStyle="#8A7A66";x.textAlign="center";x.textBaseline="bottom";x.fillText(lab,Math.min(Math.max(X(t),pad.l+22),w-pad.r-10),pad.t-6-row*13)});
   // band between best and worst
   const m=Math.min(best.length,worst.length);if(m>1){x.fillStyle="rgba(217,105,90,.08)";x.beginPath();best.slice(0,m).forEach((p,i)=>i?x.lineTo(X(p[0]),Y(p[1])):x.moveTo(X(p[0]),Y(p[1])));for(let i=m-1;i>=0;i--)x.lineTo(X(worst[i][0]),Y(worst[i][1]));x.closePath();x.fill()}
   const labs=[];
   const line=(pts,c,wd,name,dash)=>{x.strokeStyle=c;x.lineWidth=wd;x.setLineDash(dash||[]);x.beginPath();pts.forEach((p,i)=>i?x.lineTo(X(p[0]),Y(p[1])):x.moveTo(X(p[0]),Y(p[1])));x.stroke();x.setLineDash([]);
     const e=pts[pts.length-1];x.fillStyle=c;x.beginPath();x.arc(X(e[0]),Y(e[1]),wd>2.5?4.5:3.5,0,7);x.fill();labs.push([Y(e[1]),c,`${name} ${(e[1]*10).toFixed(1)}万`,X(e[0])])};
   line(sp,"#A39684",2,"标普",[6,4]);line(nq,"#6F98CF",2.2,"纳指");line(worst,"#D9695A",2.4,"最差");line(best,"#4F9A70",2.6,"最强");line(mine,"#E3A33B",3.6,"你");
   labs.sort((a,b)=>a[0]-b[0]);for(let k=1;k<labs.length;k++)if(labs[k][0]-labs[k-1][0]<14)labs[k][0]=labs[k-1][0]+14;
   x.font='bold 11.5px "PingFang SC","Microsoft YaHei",sans-serif';x.textAlign="left";x.textBaseline="middle";labs.forEach(l=>{x.fillStyle=l[1];x.fillText(l[2],Math.min(l[3]+8,w-pad.r+6),l[0])});}
  {const {x,w,h}=fit($("distChart"));const pad={l:10,r:10,t:22,b:20},B=40;
   const valid=Array.from(A.sorted).filter(v=>v>-.5),lo=Math.min(...valid),hi=Math.max(...valid),bins=new Array(B).fill(0);
   valid.forEach(v=>bins[Math.min(B-1,Math.floor((v-lo)/(hi-lo)*B))]++);const mx=Math.max(...bins),bw=(w-pad.l-pad.r)/B;
   const X=v=>pad.l+(w-pad.l-pad.r)*(v-lo)/(hi-lo);
   bins.forEach((c,i)=>{x.fillStyle=(lo+(i+.5)*(hi-lo)/B)>=0?"#BFD8C6":"#F2C6BC";const bh=(h-pad.t-pad.b)*c/mx;x.fillRect(pad.l+i*bw+1,h-pad.b-bh,bw-2,bh)});
   x.font="11px ui-monospace, Menlo, monospace";x.fillStyle="#A39684";x.textBaseline="top";x.textAlign="left";x.fillText(pct(lo),pad.l,h-pad.b+4);x.textAlign="right";x.fillText(pct(hi),w-pad.r,h-pad.b+4);
   const mark=(v,c,t,row)=>{const px=Math.max(pad.l,Math.min(w-pad.r,X(v)));x.strokeStyle=c;x.lineWidth=2;x.beginPath();x.moveTo(px,pad.t-2+row*14);x.lineTo(px,h-pad.b);x.stroke();x.fillStyle=c;x.textAlign=px>w*.8?"right":px<w*.2?"left":"center";x.textBaseline="bottom";x.font='bold 11px "PingFang SC",sans-serif';x.fillText(t,px,pad.t-4+row*14)};
   mark(A.sorted[A.N>>1],"#A39684","中位数",1);if(me>-.5)mark(me,"#E3A33B","你 "+pct(me),0);}
}
addEventListener("keydown",e=>{if(!G||e.target.tagName==="INPUT"||(e.target.classList&&e.target.classList.contains("q")))return;
  if(e.code==="Space"){e.preventDefault();if(!$("ov").hidden){const b=$("ov").querySelector(".go");if(b)b.click()}else runYear()}
  else if(/^[1-3]$/.test(e.key)&&$("ov").hidden&&!G.busy){G.choice=+e.key-1;render()}});
addEventListener("resize",()=>drawChart());
document.fonts&&document.fonts.ready.then(()=>drawChart());
decorate();newRun();
</script>
</body>
</html>
