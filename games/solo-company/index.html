ze:12px;color:var(--muted)}.upgrade-grid button{width:100%}.locked{padding:60px 20px;text-align:center;color:var(--muted)}dialog{border:1px solid #dbd9cc;border-radius:18px;background:var(--white);color:var(--ink);padding:0;max-width:580px;width:calc(100% - 32px);max-height:90vh;box-shadow:0 30px 100px #20362a30}dialog::backdrop{background:#25372c66;backdrop-filter:blur(4px)}.modal-body{padding:30px}.modal-body h2{font:30px/1.4 Georgia,'Songti SC',serif;margin:10px 0 14px}.modal-body p{font-size:13px;color:#6f796d}.modal-body .actions{display:flex;gap:10px;margin-top:23px}.modal-body .actions button{flex:1}.welcome-art{background:#e9eddf;height:130px;display:flex;justify-content:center;align-items:center;gap:22px;font:55px Georgia,serif;color:#748663;border-bottom:1px solid #d9dfce}.intro-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.intro-steps div{padding:12px;background:#f2f1e7;border-radius:7px;font-size:11px}.intro-steps b{display:block;font-size:13px;margin-bottom:4px}.report-values{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.report-values div{background:#f0f1e8;padding:13px;border-radius:8px;font-size:11px;color:var(--muted)}.report-values strong{display:block;font-size:23px;color:var(--ink);font-family:Georgia,serif}.event{padding:10px 0;border-bottom:1px solid #e7e5da;font-size:12px}.modal-close{float:right}.save-status{font-size:10px;color:var(--muted)}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);border-radius:9px;background:#293d34;color:white;padding:12px 20px;z-index:20;font-size:12px;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s}#toast.show{opacity:1}.spark{width:100%;height:65px;margin-top:10px}.checkline{display:flex;align-items:center;gap:7px;font-size:11px;margin-top:13px}details{font-size:12px;margin:12px 0}summary{cursor:pointer;color:var(--green)}details p{color:var(--muted)}@media(min-width:1000px){.sidebar{align-self:start;position:sticky;top:2 </style></head><body><div id="app"></div><div id="toast" role="status" aria-live="polite"></div><dialog id="modal"></dialog><script>const TYPES={web:{name:'标准网页',price:3600,work:[4,20,4],lag:1,span:1,deposit:.5,desc:'给小店做一个好用的展示页。需求明确，回款快。'},custom:{name:'定制看板',price:9000,work:[8,48,12],lag:2,span:2,deposit:.3,desc:'梳理数据并制作经营看板。金额高，也更占时间。'},care:{name:'维护周包',price:1800,work:[2,6,2],lag:1,span:0,deposit:.5,desc:'一次性的维护服务周包。老客户需求，做完后可另签下一期。'}};
const CLIENTS=['山间咖啡','慢慢花店','橘子书屋','晴天面包房','拾光工作室','小岛杂货','木木设计','南风摄影'];
const money=n=>'¥'+Math.round(n).toLocaleString('zh-CN');
function fresh(){return {v:1,week:1,cash:6000,revenue:0,expenses:0,draws:0,payable:0,rep:60,fatigue:0,staff:0,staffSince:0,tools:false,template:false,research:0,orders:[],offers:[offer(1,0,'web')],receivables:[],ledger:[],history:[],completed:0,webDone:0,onTime:0,ended:false,started:false,help:true,guide:0,plan:{orders:{},sales:0,research:0,overtime:false},last:null};}
function offer(w,i,type){type ||= w<3?'web':(['web','care','custom'][(w+i)%3]); return {id:`w${w}-${i}`,client:CLIENTS[(w+i-1)%CLIENTS.length],type,expires:w};}
function active(s){return s.orders.filter(o=>!o.done);}
function terms(s,o){let t=TYPES[o.type];return {...t,work:[...t.work.slice(0,1),t.work[1]-(s.template&&o.type==='web'?8:0),t.work[2]]};}
function addLedger(s,label,cash=0,revenue=0,expense=0){s.cash+=cash;s.revenue+=revenue;s.expenses+=expense;s.ledger.push({week:s.week,label,cash,revenue,expense});}
function accept(s,id){if(s.ended||s.payable||active(s).length>=3)return false;let i=s.offers.findIndex(o=>o.id===id);if(i<0)return false;let o=s.offers.splice(i,1)[0],t=terms(s,o);s.orders.push({...o,price:t.price,total:[...t.work],left:[...t.work],deposit:t.price*t.deposit,due:s.week+t.span,lag:t.lag,done:false,late:false});addLedger(s,`${o.client} · 订金`,t.price*t.deposit);s.guide=Math.max(s.guide,1);return true;}
function capacity(s){return (s.plan.overtime?48:40)-(s.staff*4);}
function used(s){return Object.values(s.plan.orders).reduce((a,b)=>a+b,0)+s.plan.sales+s.plan.research;}
function factor(s){return Math.max(.65,1-s.fatigue/200);}
function recurring(s){return 600+s.staff*1200+(s.tools?180:0);}
function allocate(s,key,delta){if(s.ended)return false;let isTask=!['sales','research'].includes(key);let old=isTask?s.plan.orders[key]||0:s.plan[key];let n=Math.max(0,old+delta);if(used(s)+n-old>capacity(s))return false;if(isTask)s.plan.orders[key]=n;else s.plan[key]=n;return true;}
function suggest(s){s.plan.orders={};s.plan.sales=0;s.plan.research=0;let remain=capacity(s),speed=factor(s);for(let o of active(s)){let need=o.left[0]/speed+o.left[1]/(speed*(s.tools?1.25:1))+o.left[2]/speed;let h=Math.min(remain,Math.ceil(need/4)*4);s.plan.orders[o.id]=h;remain-=h;}if(s.week>1&&remain>=4)s.plan.sales=Math.min(8,Math.floor(remain/4)*4);s.guide=Math.max(s.guide,2);}
function upgrade(s,id){if(s.week<3||s.ended||s.payable)return false;let price=id==='template'?1200:id==='tools'?600:500;if(s.cash<price)return false;if(id==='template'){if(s.template||s.webDone<2||s.research<8)return false;s.template=true;}else if(id==='tools'){if(s.tools)return false;s.tools=true;}else if(id==='staff'){if(s.staff>=2||used(s)>capacity(s)-4)return false;s.staff++;s.staffSince=s.week;}else return false;addLedger(s,id==='template'?'建立网页模板':id==='tools'?'工具配置费':'招募与培训费',-price,0,price);return true;}
function production(s){let staffHours=s.staff*(s.staffSince===s.week?20:32),eff=factor(s),workRate=s.tools?1.25:1,events=[],actual=0;for(let o of active(s)){let h=s.plan.orders[o.id]||0,initial=h;
 let use=Math.min(h,o.left[0]/eff);o.left[0]=Math.max(0,o.left[0]-use*eff);h-=use;
 if(o.left[0]<1e-7){let e=Math.min(staffHours,o.left[1]/workRate);o.left[1]=Math.max(0,o.left[1]-e*workRate);staffHours-=e;use=Math.min(h,o.left[1]/(eff*workRate));o.left[1]=Math.max(0,o.left[1]-use*eff*workRate);h-=use;if(o.left[1]<1e-7){use=Math.min(h,o.left[2]/eff);o.left[2]=Math.max(0,o.left[2]-use*eff);h-=use;}}
 actual+=initial-h;
 if(o.left.every(x=>x<1e-7)){o.done=true;o.finished=s.week;s.completed++;if(o.type==='web')s.webDone++;let onTime=s.week<=o.due;if(onTime)s.onTime++;s.rep=Math.min(100,s.rep+(onTime?4:0));addLedger(s,`${o.client} · 验收确认收入`,0,o.price);s.receivables.push({id:o.id,client:o.client,amount:o.price-o.deposit,due:s.week+o.lag});events.push(`${o.client}已验收，确认收入${money(o.price)}；尾款${money(o.price-o.deposit)}在第${s.week+o.lag}周末到账。`);}else if(s.week>=o.due&&!o.late){o.late=true;s.rep=Math.max(0,s.rep-6);events.push(`${o.client}未按期交付，口碑 −6。剩余工作会保留，下周继续。`);}}
 return {events,actual};}
function settle(s){if(s.ended||used(s)>capacity(s))return false;let week=s.week,startCash=s.cash,startRev=s.revenue,startExp=s.expenses,oldPayable=s.payable;let {events,actual}=production(s);
 for(let r of s.receivables.filter(r=>!r.paid&&r.due<=week)){addLedger(s,`${r.client} · 尾款到账`,r.amount);r.paid=true;events.push(`${r.client}尾款 ${money(r.amount)} 已到账。`);}
 s.research+=s.plan.research;let fee=recurring(s);s.expenses+=fee;let owed=oldPayable+fee,payment=Math.min(s.cash,owed);s.cash-=payment;s.payable=owed-payment;s.ledger.push({week,label:'周经营费用 / 支付欠款',cash:-payment,revenue:0,expense:fee});
 let draw=s.payable?0:Math.min(400,s.cash);s.cash-=draw;s.draws+=draw;if(draw)s.ledger.push({week,label:'创始人生活提取（不计费用）',cash:-draw,revenue:0,expense:0});
 let hours=actual+s.plan.sales+s.plan.research+s.staff*4;s.fatigue=Math.min(100,Math.max(0,s.fatigue+(hours>40?16:hours<=32?-12:-5)));
 let leads=Math.min(3,Math.floor(s.plan.sales/4));if(s.rep<40)leads=Math.max(0,leads-1);let next=week+1;s.offers=Array.from({length:leads},(_,i)=>offer(next,i));if(week===1&&s.completed)s.offers=[offer(2,0,'web')];
 if(s.payable){events.push(`到期费用还差${money(s.payable)}。下周有一次回款自救机会；危机期间不能接新单或升级。`);if(oldPayable>0){s.ended=true;s.reason='连续两周无法付清到期费用';}}
 if(week===2)events.push('成长与团队已解锁。先看订单量，再考虑增加固定支出。');
 s.last={week,startCash,endCash:s.cash,received:s.ledger.filter(x=>x.week===week&&x.cash>0&&x.label.includes('尾款')).reduce((a,x)=>a+x.cash,0),revenue:s.revenue-startRev,expense:s.expenses-startExp,draw,hours,events,leads:s.offers.length};s.history.push(s.last);s.week++;s.plan={orders:{},sales:0,research:0,overtime:false};s.guide=Math.max(s.guide,3);if(week>=12){s.ended=true;s.reason='十二周经营完成';}return s.last;}
function forecast(s){let clone=structuredClone(s);return settle(clone);}
function balance(s){let ar=s.receivables.filter(r=>!r.paid).reduce((a,r)=>a+r.amount,0);let advance=active(s).reduce((a,o)=>a+o.deposit,0);return {ar,advance,profit:s.revenue-s.expenses,equity:s.cash+ar-advance-s.payable};}

const KEY='xiaoli-company-v1';let s=fresh(),tab='desk',saveOK=true;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved?.v===1&&Array.isArray(saved.orders)&&saved.plan)s=saved;}catch{}
const $=q=>document.querySelector(q), btn=(label,action,cls='',disabled=false)=>`<button class="${cls}" data-action="${action}" ${disabled?'disabled':''}>${label}</button>`;
function save(){try{localStorage.setItem(KEY,JSON.stringify(s));saveOK=true;}catch{saveOK=false;}}
function toast(msg){$('#toast').textContent=msg;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),3500);}
function modal(html){$('#modal').innerHTML=html;$('#modal').showModal();}
function close(){$('#modal').close();}
function office(){return `<div class="office"><svg viewBox="0 0 310 174" aria-label="阳光里的小小工作室" role="img"><rect x="196" y="22" width="72" height="76" rx="2" fill="#d4dfc7" stroke="#a8b59a"/><path d="M232 22v76M196 60h72" stroke="#f8f6ed" stroke-width="5"/><circle cx="250" cy="42" r="11" fill="#f2d09b"/><path d="M0 139h310M31 0v139" stroke="#d3d5c5"/><path d="M57 109h147v8H57z" fill="#b79f7f"/><path d="M67 117v37M193 117v37" stroke="#a18d72" stroke-width="6"/><rect x="95" y="68" width="66" height="39" rx="3" fill="#465e4d"/><rect x="99" y="72" width="58" height="31" fill="#d1dcbc"/><path d="M107 94l11-9 11 5 17-11" fill="none" stroke="#718768" stroke-width="2"/><path d="M123 107v4M113 111h24" stroke="#465e4d" stroke-width="3"/><rect x="173" y="96" width="12" height="12" rx="2" fill="#d99970"/><path d="M185 98q10 0 0 7" fill="none" stroke="#d99970" stroke-width="2"/><rect x="244" y="118" width="23" height="30" rx="3" fill="#c1ac89"/><path d="M255 120V80" stroke="#73885b" stroke-width="3"/><ellipse cx="245" cy="96" rx="13" ry="6" transform="rotate(35 245 96)" fill="#8ea374"/><ellipse cx="264" cy="85" rx="13" ry="6" transform="rotate(-35 264 85)" fill="#a5b785"/><rect x="82" y="124" width="35" height="9" rx="4" fill="#b0ba9a"/><path d="M89 133v21M110 133v21" stroke="#97a184" stroke-width="3"/><rect x="52" y="36" width="26" height="30" fill="#fbf8ee" stroke="#d0cfbd"/><path d="M61 56q-5-9 4-11 10 0 6 11z" fill="#b5bd77"/></svg><div class="caption">${s.staff?'有伙伴，也有新的责任。':s.template?'把重复的工作，交给好流程。':'一张桌子，一点勇气。'}</div></div>`;}
function guide(){let step=s.completed===0?(active(s).length?(used(s)?2:1):0):s.week<=2?3:4;let titles=['先接下你的第一笔订单','为第一笔订单留出时间','看看预览，再开始工作','做完了，不代表钱全到账','现在，选择你的经营节奏'];let desc=['山间咖啡想做一个小网页。点击“查看并签约”，先读清楚工作量、订金和期限。','这单需要沟通 4h、制作 20h、审核 4h。点击“一键安排”，为它预留 28h；你每周共有 40h。','「执行前预览」会提前算出交付和费用。点击“执行第 1 周”，看看劳动如何变成收入。','验收后确认全部收入，尾款下周末才到账。先读周报，再安排第二周；别把订金当利润。','工作台管订单，成长页建能力，账本查每笔钱。先找出当前瓶颈，再决定要不要花钱。'];return `<section class="guide"><div class="guide-label"><span class="pear" style="width:17px;height:20px"></span> 小梨陪你开业 <span style="margin-left:auto">${step<4?`${step+1} / 4`:'经营提示'}</span></div><h3>${titles[step]}</h3><p>${desc[step]}</p>${step<4?`<div class="steps">${[0,1,2,3].map(i=>`<i class="${i<=step?'done':''}"></i>`).join('')}</div>`:''}${step===1?btn('帮我安排第一周 →','suggest','primary'):step===0?btn('去看第一笔订单 ↓','first','primary'):step===3?btn('再看一眼上周周报','report','small'):btn('随时查阅经营手册','help','small')}</section>`;}
function contract(o){let t=terms(s,o);return `<article class="card contract"><span class="stamp">${o.type==='web'?'需求明确':o.type==='custom'?'长账期':'轻量交付'}</span><div class="client">${o.client} · 客户来信</div><h3>${t.name}</h3><p class="description">${t.desc}</p><div class="contract-data"><div><small>合同金额</small><strong>${money(t.price)}</strong></div><div><small>预计工作量</small><strong>${t.work.reduce((a,b)=>a+b)}h</strong></div><div><small>签约订金</small><strong>${money(t.price*t.deposit)}</strong></div><div><small>尾款账期</small><strong>${t.lag} 周</strong></div></div><div class="contract-footer"><p>第 ${s.week+t.span} 周末前交付 · 本周有效<br>${s.template&&o.type==='web'?'已应用网页模板，制作节省 8h。':'签约前可以看完整条款。'}</p>${btn('查看并签约 ↗',`contract:${o.id}`,'primary small',active(s).length>=3||s.ended||s.payable>0)}</div></article>`;}
function project(o){let percent=Math.round((1-o.left.reduce((a,b)=>a+b)/o.total.reduce((a,b)=>a+b))*100);return `<article class="card"><div class="project-head"><div><div class="client">${o.client}</div><h3>${TYPES[o.type].name}</h3></div><span class="pill ${o.due<s.week?'warn':''}">${o.due<s.week?'已延期':`第 ${o.due} 周末交付`}</span></div><div class="progress">${['需求沟通','制作','审核验收'].map((name,i)=>`<div class="phase">${name}<div class="bar"><i style="width:${100*(1-o.left[i]/o.total[i])}%"></i></div>剩 ${Math.ceil(o.left[i])} 标准工时</div>`).join('')}</div><div class="section-title" style="margin:0"><small>整体进度 ${percent}% · 订金已收 ${money(o.deposit)}</small><small>在「时间安排」中分配工时</small></div></article>`;}
function desk(){return `${active(s).length?`<div class="section-title"><h2>正在进行 <small>${active(s).length} / 3</small></h2><small>进度保留，按列表顺序推进</small></div>${active(s).map(project).join('')}`:''}<div class="section-title"><h2>${s.week===1?'第一封客户来信':'本周客户机会'}</h2><small>${s.offers.length} 个机会 · 每周更新</small></div>${s.offers.length?s.offers.map(contract).join(''):`<div class="empty">暂时没有新的客户来信。<br>本周安排至少 4h 拓客，下周会出现新机会。${s.rep<40?'当前口碑偏低，会减少 1 个机会。':''}</div>`}<div class="hint">${s.week===1?'先把第一件小事做好。完成第一次交付后，新的能力会陆续出现。':'签约只收到订金；沟通、制作、审核全部完成后才确认收入。'}</div>`;}
function growth(){if(s.week<3)return `<div class="locked">第三周解锁成长与团队。<br>先完成一笔订单，认识公司的钱和时间。</div>`;let data=[['template','▧','网页模板','完成 2 个标准网页，并投入 8h 流程建设。新签标准网页的制作从 20h 降为 12h。',`一次性 ${money(1200)} · 无周费`,s.template,s.webDone<2||s.research<8||s.cash<1200],['tools','⌘','自动化工具','仅制作环节提速 25%。沟通与审核仍由人完成，工作少时也要付订阅费。',`配置 ${money(600)} ＋ ${money(180)}/周`,s.tools,s.cash<600],['staff','♧',`交付伙伴 ${s.staff} / 2`,'员工只负责制作。入职当周每人 20h，此后 32h；创始人每周为每人预留 4h 管理。第二名加入时团队一起带教。',`招募 ${money(500)} ＋ ${money(1200)}/人/周`,s.staff>=2,s.cash<500||used(s)>capacity(s)-4]];return `<div class="section-title"><h2>让公司慢慢长大</h2><small>每一种能力，都有成本</small></div><div class="hint" style="margin:0 0 16px">已完成标准网页 ${s.webDone} / 2 · 已投入流程建设 ${s.research} / 8h<br>模板只影响升级后签约的订单；本版员工入职后持续任职到本局结束。</div><div class="upgrade-grid">${data.map(([id,icon,title,desc,cost,owned,disabled])=>`<article class="card"><div class="upgrade-icon">${icon}</div><h3>${title}</h3><p>${desc}</p><p style="color:var(--ink)">${cost}</p>${btn(owned?'已建立':id==='staff'?'查看招聘方案':'查看升级方案',`upgrade:${id}`,'small',owned||disabled||s.ended||s.payable>0)}</article>`).join('')}</div>`;}
function ledger(){let b=balance(s);return `<div class="section-title"><h2>每一笔钱，都有去处</h2><small>点击手册查看口径</small></div><div class="card"><div class="contract-data" style="border:0;padding:0"><div><small>累计收入</small><strong>${money(s.revenue)}</strong></div><div><small>累计费用</small><strong>${money(s.expenses)}</strong></div><div><small>经营利润</small><strong>${money(b.profit)}</strong></div><div><small>生活提取</small><strong>${money(s.draws)}</strong></div></div></div><div class="hint" style="margin-bottom:16px">待收尾款 ${money(b.ar)} · 未履约预收款 ${money(b.advance)} · 未付费用 ${money(s.payable)}<br>勾稽：现金＋应收－预收－欠款＝初始本金 6,000＋利润－生活提取。</div><div class="card" style="overflow:auto"><table class="ledger"><thead><tr><th>周</th><th>事项</th><th>现金变化</th><th>确认收入</th><th>费用</th></tr></thead><tbody>${s.ledger.length?s.ledger.slice().reverse().map(x=>`<tr><td>${x.week}</td><td>${x.label}</td><td>${x.cash>0?'+':''}${money(x.cash)}</td><td>${x.revenue?money(x.revenue):'—'}</td><td>${x.expense?money(x.expense):'—'}</td></tr>`).join(''):'<tr><td colspan="5">开业本金 ¥6,000，尚无经营流水。</td></tr>'}</tbody></table></div>`;}
function counter(key,label,n,note=''){return `<div class="allocation"><div><p>${label}</p><small>${note}</small></div><div class="counter">${btn('−',`minus:${key}`,'',s.ended||n===0)}<b>${n}h</b>${btn('+',`plus:${key}`,'',s.ended||used(s)+4>capacity(s))}</div></div>`;}
function plan(){let f=forecast(s),u=used(s),c=capacity(s);return `<section class="planbox"><div class="section-title"><h3>本周时间安排</h3>${btn('一键安排','suggest','small',s.ended)}</div><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted)"><span>${u} / ${c}h 已安排</span><span>${c-u}h 未安排</span></div><div class="bar"><i style="width:${100*u/c}%"></i></div>${s.staff?`<p class="plan-note">另有 ${s.staff*4}h 固定管理；员工制作池 ${s.staff*(s.week===s.staffSince?20:32)}h 自动按项目顺序分配。</p>`:''}${active(s).map(o=>counter(o.id,o.client,s.plan.orders[o.id]||0,'沟通 → 制作 → 审核')).join('')}${s.week>1?counter('sales','寻找新客户',s.plan.sales,'每 4h 带来 1 个机会，最多 3 个'):''}${s.week>=3?counter('research','流程建设',s.plan.research,'积累至 8h，可建立网页模板'):''}${!active(s).length&&s.week===1?'<p class="plan-note">先签下第一笔订单，就能安排工作。</p>':''}${s.week>=3?`<label class="checkline"><input type="checkbox" id="overtime" ${s.plan.overtime?'checked':''} ${s.ended?'disabled':''}> 临时加班到 48h</label><p class="plan-note">实际工作超过 40h：疲劳 +16。当前疲劳 ${s.fatigue}，个人效率 ${Math.round(factor(s)*100)}%。</p>`:''}<div class="forecast"><div><strong>执行前预览</strong><span>仅按当前安排</span></div><div><span>预计完成订单</span><b>${f?.events.filter(x=>x.includes('已验收')).length||0} 单</b></div><div><span>本周经营费用</span><b>−${money(recurring(s))}</b></div><div><span>生活提取</span><b>−${money(f?.draw||0)}</b></div><div><span>预计周末现金</span><b class="${f&&f.endCash<1000?'warn':''}">${money(f?.endCash??s.cash)}</b></div></div>${f?.events.some(x=>x.includes('未按期'))?'<div class="hint warn">按此安排，有订单将延期。增加工时或接受延期后果。</div>':''}${btn(s.ended?'查看十二周战报':`执行第 ${s.week} 周 →`,s.ended?'ending':'execute','primary execute',!s.ended&&s.week===1&&!active(s).length)}<p class="plan-note" style="text-align:center;margin-bottom:0">${s.ended?'本局已结束，可保存战报或重新开业。':'确认后才推进一周 · 关闭网页不会继续扣费'}</p></section>`;}
function render(){save();let b=balance(s);$('#app').innerHTML=`<div class="shell"><header class="topbar"><div class="brand"><span class="pear"></span><div><strong>小梨王国</strong><small>A LITTLE COMPANY</small></div></div><div class="top-right"><span class="save-status">${saveOK?'● 进度已保存在当前浏览器':'存储不可用，请保持页面打开'}</span><span class="tag">试玩版 0.1</span>${btn('经营手册','help','quiet small')}${btn('重新开业','restart','quiet small')}</div></header><section class="hero"><div><div class="eyebrow">YOUR FIRST TWELVE WEEKS / 从一张桌子开始</div><h1>一个人的公司<span style="color:var(--orange)">。</span></h1><p>接下一份信任，做好一笔生意。慢慢找到自己的节奏。</p></div><div class="weekbox"><div class="weeknum">${String(Math.min(s.week,12)).padStart(2,'0')}<span> / 12</span></div><div><div class="weektext">${s.ended?'本季经营已结束':s.week<=2?'开业初期 · 先做好第一单':s.week<=6?'积累阶段 · 找到自己的节奏':'稳定阶段 · 让业务持续运转'}</div><div class="weekdots">${Array.from({length:12},(_,i)=>`<i class="${i+1<s.week?'past':i+1===s.week?'now':''}"></i>`).join('')}</div></div></div></section><section class="stats"><div class="stat"><div class="stat-label">手头现金 <span>01</span></div><div class="stat-value">${money(s.cash)}</div><small>真正可以用于支付的钱</small></div><div class="stat"><div class="stat-label">待收尾款 <span>02</span></div><div class="stat-value">${money(b.ar)}</div><small>已验收，还没到账</small></div><div class="stat"><div class="stat-label">累计经营利润 <span>03</span></div><div class="stat-value">${money(b.profit)}</div><small>确认收入 − 已发生费用</small></div><div class="stat"><div class="stat-label">交付口碑 <span>04</span></div><div class="stat-value">${s.rep}<span style="font-size:14px;color:var(--muted)"> / 100</span></div><small>按期 +4 · 每单首次延期 −6</small></div></section>${s.payable?`<div class="warning">经营危机：到期费用尚欠 ${money(s.payable)}。${s.ended?'本局已结束。':'请在本周完成已有订单、等待到期尾款；连续两周欠款会停业。'}</div>`:''}<div class="layout"><main class="main"><nav class="tabs" aria-label="经营页面">${['desk','growth','ledger'].map((id,i)=>btn(['工作台','成长与团队','经营账本'][i]+(id==='growth'&&s.week<3?'<span>第三周解锁</span>':''),`tab:${id}`,tab===id?'active':'',id==='growth'&&s.week<3)).join('')}</nav>${s.ended?`<div class="warning">${s.reason}。${btn('查看完整战报 →','ending','quiet small')}</div>`:''}${tab==='desk'?desk():tab==='growth'?growth():ledger()}</main><aside class="sidebar">${s.ended?'':guide()}${plan()}${office()}</aside></div><footer class="footer"><span>小梨 / 凶猛铁梨 · 一个小小的创业实验</span><span>原创简化经营模拟 · 灵感：Evolve 的资源与渐进解锁机制</span></footer></div>`;}
function welcome(){modal(`<div class="welcome-art"><span class="pear" style="width:65px;height:75px"></span><span>＋</span><span style="font-size:65px">▱</span></div><div class="modal-body"><div class="eyebrow">欢迎来到你的第一家公司</div><h2>不懂经营，也可以从这里开始。</h2><p>你有 <b>¥6,000</b> 开业本金、一台电脑和每周 <b>40 小时</b>。接下来十二周，试着把一份手艺做成可持续的生意。</p><div class="intro-steps"><div><b>01 接一笔订单</b>先读需求与付款条件</div><div><b>02 安排工作</b>预览结果，再执行一周</div><div><b>03 看钱回家</b>分清收入与现金</div></div><p>小梨会带你完成第一单。新功能逐步出现，随时可以看手册；进度自动保存在当前浏览器。</p><div class="actions">${btn('好，从第一笔订单开始 →','start','primary')}</div></div>`);}
function help(){modal(`<div class="modal-body">${btn('关闭 ×','close','quiet modal-close')}<div class="eyebrow">随时回来翻一翻</div><h2>经营手册</h2><details open><summary>我现在应该做什么？</summary><p>先签约，在时间安排里给项目分配工时，再执行一周。每周最多安排 40h；“一键安排”优先现有项目，再用余量拓客。它只是便捷排班，不保证最优。</p></details><details><summary>为什么有收入，却没有那么多现金？</summary><p>订金先进入现金，但不算收入。完整交付并验收后才确认合同收入；尾款于验收后 1 或 2 周的周末到账。尾款到账不会重复记收入。</p></details><details><summary>工作如何推进？员工会做什么？</summary><p>项目依次经过沟通、制作、审核。创始人可以做全部环节，员工只负责制作，按项目列表顺序分配。图上的工时是标准工作量；疲劳降低个人效率，工具只提升制作效率。未用完的安排不会存到下周。</p></details><details><summary>没有客户怎么办？</summary><p>第二周起可分配拓客工时。每 4h 带来下周 1 个机会，最多 3 个；口碑低于 40 时减少 1 个。机会只保留当周。首单完成后有一次固定转介绍。</p></details><details><summary>为什么每周都花钱？</summary><p>基础经营费用 ¥600/周，员工 ¥1,200/人/周，工具 ¥180/周。另有最多 ¥400 创始人生活提取，它减少现金但不是经营费用。本版不含贷款、税务、折旧或离职机制，员工持续任职到本局结束。</p></details><details><summary>什么时候会停业？最后怎么算？</summary><p>当周经营费用先计入，再用现金付款。付不清的部分记欠款，暂停接单和升级；连续两周未付清则停业。结算同时列出应收款、未完成订单的预收款和欠款，不把订金当盈利。</p></details><details><summary>加班、休息和进度保存</summary><p>正常周 40h，加班周 48h。实际工作超过 40h 疲劳 +16；不超过 32h 恢复 12，其他正常周恢复 5。关闭页面后时间暂停，进度仅保存在当前设备浏览器；清理浏览器数据会删除存档。</p></details><div class="actions">${btn('明白，回到工作台','close','primary')}</div></div>`);}
function report(){let r=s.last;if(!r)return toast('完成第一周后，就会有第一份周报。');modal(`<div class="modal-body"><div class="eyebrow">WEEK ${String(r.week).padStart(2,'0')} / 一周的努力，看得见</div><h2>第 ${r.week} 周，辛苦了。</h2><div class="report-values"><div>本周确认收入<strong>${money(r.revenue)}</strong></div><div>周末手头现金<strong>${money(r.endCash)}</strong></div><div>本周经营费用<strong>${money(r.expense)}</strong></div><div>本周生活提取<strong>${money(r.draw)}</strong></div></div>${r.events.map(x=>`<div class="event">${x}</div>`).join('')}<div class="event">创始人实际工作 ${Math.round(r.hours*10)/10}h · 下周 ${r.leads} 个客户机会。</div>${r.week===1?'<div class="hint">第一课：订金早已进了现金，验收才确认收入。尾款下周末到账，因此“收入”和“现金”不会同时增长。</div>':''}<div class="actions">${btn(s.ended?'查看本季战报 →':`安排第 ${s.week} 周 →`,s.ended?'ending':'close','primary')}</div></div>`);}
function ending(){if($('#modal').open)close();let b=balance(s),title=s.payable?'这一次，现金没跟上。':b.profit>15000?'小小公司，稳稳向前。':b.profit>0?'你把第一门生意做起来了。':'开业十二周，有收获也有学费。';modal(`<div class="modal-body"><div class="eyebrow">小梨的创业实验 / 本季经营战报</div><h2>${title}</h2><p>${s.reason} · 完成 ${s.completed} 单 · ${s.staff?s.staff+' 位交付伙伴':'保持一人经营'}</p><div class="report-values"><div>累计经营利润<strong>${money(b.profit)}</strong></div><div>期末现金<strong>${money(s.cash)}</strong></div><div>按期交付<strong>${s.completed?Math.round(s.onTime/s.completed*100):0}%</strong></div><div>累计工作时间<strong>${Math.round(s.history.reduce((a,r)=>a+r.hours,0))}h</strong></div></div><p>待收尾款 ${money(b.ar)} · 未履约预收款 ${money(b.advance)} · 欠款 ${money(s.payable)}。尚有 ${active(s).length} 单未完成，以上并非清算估值。</p><div class="hint">${active(s).length?'你承诺的工作还没有全部完成。下一次，签约前先给交付留出空间。':s.staff&&b.profit<0?'人手增加了，固定支出也增加了。下一次可以先积累订单，再扩张。':s.history.filter(r=>r.hours>40).length>2?'你多次依靠加班完成工作。下一次试着用模板或工具换回自己的时间。':'你走完了从接单到回款的循环。换一种工具和用人策略，看看能否用更少的时间得到更稳的结果。'}</div><div class="actions">${btn('保存战报图片','download','primary')}${btn('回到公司','close')}</div><div style="text-align:center;margin-top:12px">${btn('重新开业，再试一次','restart','quiet small')}</div></div>`);}
function download(){let b=balance(s),canvas=document.createElement('canvas');canvas.width=900;canvas.height=1100;let ctx=canvas.getContext('2d');ctx.fillStyle='#f5f2ea';ctx.fillRect(0,0,900,1100);ctx.fillStyle='#355b46';ctx.fillRect(50,60,800,8);ctx.font='24px sans-serif';ctx.fillText('小梨王国 / 经营实验 01',65,120);ctx.font='bold 54px sans-serif';ctx.fillText('一个人的公司',65,210);ctx.font='28px sans-serif';ctx.fillText('我的十二周经营战报',65,270);let rows=[['经营利润',money(b.profit)],['期末现金',money(s.cash)],['交付订单',s.completed+' 单'],['按期交付',s.completed?Math.round(s.onTime/s.completed*100)+'%':'0%'],['累计工作',Math.round(s.history.reduce((a,r)=>a+r.hours,0))+'h'],['团队规模','我 + '+s.staff+' 位伙伴']];rows.forEach(([a,v],i)=>{ctx.font='24px sans-serif';ctx.fillStyle='#788078';ctx.fillText(a,65,360+i*90);ctx.fillStyle='#293d34';ctx.font='34px sans-serif';ctx.fillText(v,480,360+i*90);});ctx.font='20px sans-serif';ctx.fillText(`应收 ${money(b.ar)} / 预收 ${money(b.advance)} / 欠款 ${money(s.payable)}`,65,950);ctx.fillText('原创经营模拟 · 试玩版 0.1 · 不代表真实经营收益',65,1010);let a=document.createElement('a');a.download='我的十二周经营战报.png';a.href=canvas.toDataURL('image/png');a.click();toast('战报图片已生成。');}
document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(!el||el.disabled)return;let [cmd,id]=el.dataset.action.split(':');if(cmd==='close')return close();if(cmd==='start'){s.started=true;close();return render();}if(cmd==='help')return help();if(cmd==='tab'){tab=id;return render();}if(cmd==='first'){tab='desk';render();$('.contract')?.scrollIntoView({behavior:'smooth',block:'center'});return;}if(cmd==='suggest'){suggest(s);render();return toast('已优先安排现有项目。你仍可以调整每项时间。');}if(cmd==='plus'||cmd==='minus'){allocate(s,id,cmd==='plus'?4:-4);return render();}if(cmd==='contract'){let o=s.offers.find(o=>o.id===id);if(!o)return;let t=terms(s,o);return modal(`<div class="modal-body"><div class="eyebrow">${o.client} / 签约前看清楚</div><h2>${t.name}</h2><p>${t.desc}</p><div class="report-values"><div>合同金额<strong>${money(t.price)}</strong></div><div>现在到账的订金<strong>${money(t.price*t.deposit)}</strong></div></div><p>工作量：沟通 ${t.work[0]}h ＋ 制作 ${t.work[1]}h ＋ 审核 ${t.work[2]}h。<br>交付期限：第 ${s.week+t.span} 周末。<br>尾款 ${money(t.price*(1-t.deposit))}：验收后第 ${t.lag} 周末到账。</p><div class="hint">签约表示承诺交付。本版不支持撤单；未按期完成会损失 6 点口碑。订金不等于利润。</div><div class="actions">${btn('再想想','close')}${btn('确认签约，收到订金',`accept:${id}`,'primary')}</div></div>`);}if(cmd==='accept'){let ok=accept(s,id);close();render();if(ok)toast('订金到账。下一步：为这笔订单安排工作时间。');return;}if(cmd==='execute'){let f=forecast(s);return modal(`<div class="modal-body"><div class="eyebrow">执行前，最后看一眼</div><h2>让第 ${s.week} 周开始吧。</h2><p>计划分配 ${used(s)}h，${capacity(s)-used(s)}h 未安排。实际未使用的时间会作为休息，不会累积到下周。</p><div class="report-values"><div>预计周末现金<strong>${money(f.endCash)}</strong></div><div>经营费用<strong>${money(recurring(s))}</strong></div></div>${f.events.filter(x=>x.includes('未按期')||x.includes('还差')).map(x=>`<div class="warning">${x}</div>`).join('')}<p>一周结算顺序：交付验收 → 到期尾款到账 → 支付经营费用 → 生活提取。</p><div class="actions">${btn('返回调整','close')}${btn('确认执行这一周','settle','primary')}</div></div>`);}if(cmd==='settle'){settle(s);close();render();return report();}if(cmd==='report')return report();if(cmd==='upgrade'){return modal(`<div class="modal-body"><div class="eyebrow">成长需要投入</div><h2>${id==='staff'?'邀请一位交付伙伴':id==='tools'?'启用自动化工具':'建立网页模板'}</h2><p>${id==='staff'?'立即支付 ¥500 招募费用；从本周起每周增加 ¥1,200 工资，并占用创始人 4h 管理时间。入职当周制作能力 20h，之后 32h。本局暂不提供离职功能。':id==='tools'?'立即支付 ¥600 配置费，从本周起每周支付 ¥180。仅制作阶段提速 25%，不改变沟通和审核要求。':'立即支付 ¥1,200。升级后签约的标准网页，制作工作量减少 8h。已有合同仍按原工作量执行。'}</p><div class="actions">${btn('暂时不需要','close')}${btn('确认投入',`buy:${id}`,'primary')}</div></div>`);}if(cmd==='buy'){let ok=upgrade(s,id);close();render();return toast(ok?'新能力已建立，请重新检查本周安排。':'条件不足，尚未扣款。');}if(cmd==='ending')return ending();if(cmd==='download')return download();if(cmd==='restart'){if($('#modal').open)close();return modal(`<div class="modal-body"><h2>重新开业？</h2><p>这会清除当前浏览器里的本局进度，从 ¥6,000 本金和第一笔订单重新开始。</p><div class="actions">${btn('保留当前进度','close')}${btn('确认重新开始','reset','primary')}</div></div>`);}if(cmd==='reset'){s=fresh();tab='desk';close();render();welcome();}});
document.addEventListener('change',e=>{if(e.target.id==='overtime'){let next=e.target.checked;if(!next&&used(s)>40-s.staff*4){e.target.checked=true;return toast('请先减少已分配工时，再关闭加班。');}s.plan.overtime=next;render();}});
$('#modal').addEventListener('cancel',e=>{if(!s.started)e.preventDefault();});
render();if(!s.started)welcome();
</script></body></html>
