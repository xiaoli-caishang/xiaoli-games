<style>
/* Layout: 小梨王国 series look (cream studio, as in 量化基金生存录) — brand strip, key slots that unlock per dimension, a swipe card, two answer buttons.
   Result: a screenshot-ready persona card with a pixel character, then 复盘, 小梨的建议 and the 16-persona gallery. Single deliberate light look. */
:root{
  --bg:#F6EFE4; --s1:#FFFBF4; --s2:#F3EADB; --line:#E8DCC8; --fg:#3E3833; --mut:#958A7C; --inkm:#6B6157;
  --gold:#E3A33B; --gold-d:#C98A2A; --gain:#4F9A70; --loss:#D9695A; --pear:#B8CC6E; --paper:#FFF6E6;
  --f-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --f-num:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(circle at 8% 12%,#FBE3D6 0,transparent 28%),radial-gradient(circle at 92% 30%,#E6EFD8 0,transparent 26%),radial-gradient(circle at 70% 95%,#F7E7C4 0,transparent 30%);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.app{height:100%;max-width:440px;margin:0 auto;padding-inline:16px;padding-block:12px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:8px}
.brand img{width:30px;height:30px}
.brand b{font-size:16px;font-weight:900;letter-spacing:.02em}
.brand small{display:block;color:var(--mut);font-size:11px}
.brand .count{margin-left:auto;font-family:var(--f-num);font-size:13px;color:var(--mut)}
.brand .count b{font-size:13px;color:var(--fg)}
.prog{height:6px;border-radius:4px;background:var(--s2);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--gold);border-radius:4px;transition:width .35s}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.key{background:var(--s1);border:1.5px dashed var(--line);border-radius:14px;padding:6px 4px;display:grid;justify-items:center;align-content:center;gap:2px;min-height:54px}
.key img{width:26px;height:26px;opacity:.45}
.key span{font-size:12.5px;font-weight:900;color:var(--fg);min-height:16px}
.key.on{border-style:solid;border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--s1))}
.key.on img{opacity:1}
.key.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.8)}100%{transform:scale(1)}}
.toast{min-height:20px;font-size:12.5px;color:var(--gold-d);font-weight:700;opacity:0;transition:opacity .3s;display:flex;justify-content:center;align-items:center;gap:6px}
.toast img{width:16px;height:16px}
.toast.show{opacity:1}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.card{position:relative;width:100%;max-width:350px;background:var(--s1);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 26px rgba(160,125,80,.14);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;display:flex;flex-direction:column;gap:10px;padding:12px 12px 14px;overflow:hidden;will-change:transform}
.card.nudge{transition:transform .4s ease-in-out}
.sceneimg{position:relative;width:100%;aspect-ratio:2/1;max-height:24vh;border-radius:14px;overflow:hidden;flex:none}
.sceneimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.card img{pointer-events:none;-webkit-user-drag:none;user-select:none}
.card .scene,.card .q{margin-inline:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;align-items:center;gap:6px;background:var(--s2);border:1.5px solid var(--line);border-radius:14px;padding:10px;min-height:56px;font-size:14px;font-weight:700;line-height:1.35;text-align:left;transition:background .15s,border-color .15s,transform .15s}
.opt.r{justify-content:flex-end;text-align:right}
.opt .ln,.stamp .ln{display:block}
.cl{display:inline-block}
.opt .arr{font-size:18px;font-weight:900;color:var(--gold-d);flex:none}
.opt.hot{background:color-mix(in srgb,var(--gold) 22%,var(--s1));border-color:var(--gold);transform:scale(1.03)}
.hand{position:absolute;width:40px;height:40px;left:50%;bottom:22px;margin-left:-20px;pointer-events:none;transition:transform .4s ease-in-out;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.card.dragging{cursor:grabbing}
.card.fly{transition:transform .3s ease-in,opacity .3s}
.card.back{transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.card.enter{animation:enter .32s cubic-bezier(.3,1.3,.5,1)}
@keyframes enter{from{transform:translateY(16px) scale(.96);opacity:0}}
.scene{display:inline-flex;align-self:flex-start;font-size:12px;font-weight:700;color:var(--gold-d);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.q{font-size:19px;line-height:1.5;font-weight:900;text-wrap:pretty}
.stamp{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;background:color-mix(in srgb,var(--s1) 85%,transparent)}
.stamp span{font-size:19px;font-weight:900;padding:10px 16px;border:3px solid var(--gold);color:var(--gold-d);border-radius:12px;transform:rotate(-5deg);max-width:82%;text-align:center;line-height:1.35}
.hint{font-size:12.5px;color:var(--inkm);text-align:center;line-height:1.6}
.hint b{color:var(--gold-d);font-size:15px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answers button{background:var(--s1);border:1.5px solid var(--line);border-radius:16px;padding:12px 10px;min-height:58px;font-size:14.5px;font-weight:700;line-height:1.35}
.answers button:hover{border-color:color-mix(in srgb,var(--gold) 60%,var(--line))}
.answers .l::before{content:"← ";color:var(--mut)}
.answers .r::after{content:" →";color:var(--mut)}
.foot{font-size:11px;color:var(--mut);text-align:center}

/* overlays */
.ov{position:fixed;inset:0;z-index:5;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);background-image:inherit}
.box{max-width:430px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:14px;min-height:100%}
.start{justify-content:center;text-align:center;align-items:center;gap:16px}
.start .mascot{width:84px;height:84px}
.eyebrow{font-size:12px;color:var(--gold-d);font-weight:700;letter-spacing:.06em}
.title{font-size:42px;font-weight:900;line-height:1.15;margin:0}
.title em{font-style:normal;background:linear-gradient(transparent 58%,#F7DFAE 58%);padding-inline:2px}
.lead{font-size:15px;line-height:1.75;color:var(--inkm);margin:0;text-wrap:balance}
.crowd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.crowd div{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:6px 4px 5px;display:grid;justify-items:center;align-content:start;gap:2px;font-size:11px;line-height:1.35;color:var(--inkm);text-wrap:balance}
.crowd img{width:56px;height:56px}
.go{border:0;border-radius:999px;box-shadow:0 4px 0 var(--gold-d);padding:14px 18px;background:var(--gold);color:var(--fg);font-weight:900;font-size:17px;width:100%}
.ghost{border:1.5px solid var(--line);background:var(--s1);border-radius:999px;padding:12px 18px;font-weight:700;font-size:15px;width:100%}

/* result */
.pcard{background:var(--s1);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 26px rgba(160,125,80,.14);overflow:hidden}
.pc-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px dashed var(--line);font-size:12px;color:var(--mut)}
.pc-head img{width:22px;height:22px}
.code{margin-left:auto;display:flex;gap:5px}
.code span{font-family:var(--f-num);font-weight:800;font-size:14px;width:26px;height:26px;display:grid;place-items:center;border-radius:8px;background:var(--fg);color:var(--paper)}
.hero{display:grid;grid-template-columns:132px minmax(0,1fr);gap:14px;align-items:center;padding:16px}
.portrait{width:132px;height:132px;border-radius:20px;display:grid;place-items:center}
.portrait img{width:120px;height:120px}
.pname{font-size:30px;font-weight:900;line-height:1.2;margin:0;text-wrap:balance}
.prole{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:700;color:var(--gold-d);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.scenebox{margin:0 16px;background:var(--paper);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.6;color:var(--inkm)}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px 0}
.tags span{font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--s2);color:var(--fg)}
.bars{display:grid;gap:9px;padding:14px 16px 4px}
.brow{display:grid;grid-template-columns:18px 34px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:12.5px;color:var(--mut)}
.brow img{width:18px;height:18px}
.brow .r{text-align:right}
.brow b{color:var(--fg)}
.bbar{position:relative;height:10px;border-radius:6px;background:var(--s2)}
.bbar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1.5px;background:var(--line)}

  const parts=DIMS.map(part),code=parts.map(p=>p.win.code).join(''),t=TYPES[code],him=mode==='him';
  const who=him?'他':'你',lv=levelOf(code);
  STORE[mode]=code;saveStore();const hasPair=STORE.me&&STORE.him;
  const bars=parts.map(p=>{const w=Math.abs(p.pa-50),st=p.aWin?`right:50%;width:${w}%`:`left:50%;width:${w}%`;
    return `<div class="brow"><img class="px" src="${icon(p.d.key)}" alt="${p.d.name}"><span>${p.aWin?`<b>${p.d.a.label}</b>`:p.d.a.label}</span><div class="bbar"><i style="${st}"></i></div><span class="r">${!p.aWin?`<b>${p.d.b.label}</b>`:p.d.b.label}</span></div>`}).join('');
  const salad=icon('salad');
  const ext=[...parts].sort((a,b)=>b.pct-a.pct)[0],A=ADVICE[ext.win.code];
  const legend=parts.map(p=>{const ex=CARDS.find(c=>c.dim===p.d.key);
    const side=(o,isA)=>`<div class="lg-c${(isA===p.aWin)?' me':''}" data-who="${who}"><div class="lg-l">${o.code}</div><div class="lg-en">${o.en}</div><div class="lg-zh">${o.label}</div><div class="lg-m">${cl(o.mean)}</div><div class="lg-ex">比如选<br>${lines(isA?ex.a:ex.b)}</div></div>`;
    return `<div class="lg"><div class="lg-h"><img class="px" src="${icon(p.d.key)}" alt=""><span>${p.d.name}</span></div><div class="lg-row">${side(p.d.a,true)}<span class="lg-vs">vs</span>${side(p.d.b,false)}</div></div>`}).join('');
  const gallery=CODES.map(k=>`<div data-k="${k}" class="${k===code?'me':''}"><img class="px" src="${persona(k)}" alt="${TYPES[k].name}"><b>${TYPES[k].name}</b><code>${k}</code></div>`).join('');
  $('result').innerHTML=`
    <div class="pcard">
      <div class="pc-head"><img class="px" src="${pearLogo()}" alt=""><span>金融男图鉴 · ${him?'鉴定结果':'我是'}</span><div class="code">${code.split('').map(ch=>`<span>${ch}</span>`).join('')}</div></div>
      <div class="hero"><div class="portrait" style="background:${t.look.bg}"><img class="px" src="${persona(code)}" alt="${t.name}"></div>
        <div><div class="pre">${him?'他是':'你是'}</div><h2 class="pname" style="font-size:${t.name.length<=5?30:t.name.length<=7?25:22}px">${t.name}</h2><span class="lvl">${lv}</span></div></div>
      <div class="jobs"><span>最常出没</span><b>${t.roles.map(r=>ROLES[r].name).join(' · ')}</b></div>
      <div class="viewbox"><small>别人眼中的${who}</small><p>${cl(t.view)}</p></div>
      <div class="quote">“${t.quote}”</div>
      <div class="bars">${bars}</div>
      <div class="pc-foot"><span>@小梨🍐 有价值的财商分享</span><span>纯属玩梗，非投资建议</span></div>
    </div>
    <div class="shotbtn"><button class="go" id="mkPoster" type="button">${him?'生成海报，甩给他看':'生成海报，晒出我的代码'}</button><p>${him?'海报写着“我鉴定了你”，发给他或姐妹群':'长按保存，发朋友圈或评论区'}</p></div>
    ${hasPair?pairHTML():pairCTA(him)}
    <div class="sect" id="salSec"><h2>${who}这种人，在哪拿多少沙拉</h2>
      <p class="sub"><img class="px inl" src="${salad}" alt="">1 份沙拉 = 月薪 ¥1k<br>${SALARY_META.level} · 三地统一折成人民币</p>
      ${SALARY_DEMO?'<div class="demo">示例数字，仅供看效果 · 待替换为真实招聘数据</div>':''}
      <div id="salBody">${salHTML(code,code,who)}</div>
      <div class="peek"><b>其他金融男拿多少？点一个看看</b><div class="peek-row" id="peekRow">${CODES.map(k=>`<button type="button" data-k="${k}" class="${k===code?'on':''}"><img class="px" src="${persona(k)}" alt=""><span>${TYPES[k].name}</span></button>`).join('')}</div></div>
      <p class="follow">想知道这些岗位怎么入行？关注 @小梨🍐 有价值的财商分享，职业路线一期一期讲。</p>
      <div class="src"><p><b>数据来源</b>${SALARY_META.src}${SALARY_META.n?`（${SALARY_META.date}，样本 ${SALARY_META.n} 条）`:`（${SALARY_META.date}）`}。取月薪中位数，不含年终奖；${SALARY_META.fx}。</p>
        <p><b>免责声明</b>纯科普娱乐，仅供参考。不代表任何具体机构或个人的真实薪酬，实际收入因机构、业绩和个人差异很大，也不构成求职或投资建议。</p></div></div>
    <div class="sect"><h2>${who}的登级：${lv}</h2><div class="lvls">${Object.keys(LEVELS).map(k=>`<div class="${k===lv?'on':''}"><b>${k}</b><span>${LEVELS[k]}</span></div>`).join('')}</div></div>
    ${him?`<div class="sect advice"><h2>姐妹须知</h2><p class="tipline">${cl(t.tip)}</p><p class="disc">纯属玩梗，请勿对号入座。</p></div>`
         :`<div class="sect advice"><h2>小梨的建议</h2><div class="adv"><h3>${A[0]}</h3><p>${A[1]}</p></div><div class="adv"><h3>想入行，先去接触，而不是去猜</h3><p>找一位做${ROLES[t.roles[0]].name}的人聊半小时，问问他每天最花时间、最痛苦的事是什么。能接受那份痛苦，才是真的适合。</p></div><p class="disc">以上是对决策风格的分析，不构成任何投资建议。</p></div>`}
    <div class="sect"><h2>代码 ${code} 是什么意思</h2><p class="sub">四个字母各代表一个维度的一端，金色那一边是${who}。</p>${legend}</div>
    <div class="sect"><h2>金融男图鉴 · 16 种</h2><p class="sub">发给姐妹，鉴定一下身边那位。点任意一位，看他拿多少沙拉。</p><div class="gallery" id="gal">${gallery}</div></div>
    <div class="next"><button class="go" id="again" type="button">${him?'再鉴定一个':'再测一次'}</button><button class="ghost" id="switch" type="button">${him?'测测我自己':'帮姐妹鉴定他'}</button></div>`;
  $('mkPoster').addEventListener('click',()=>openPoster('one',code,him));
  if(hasPair){$('pairPoster').addEventListener('click',()=>openPoster('pair'));
    document.querySelectorAll('[data-redo]').forEach(b=>b.addEventListener('click',()=>start(b.dataset.redo)));}
  else $('ctaPair').addEventListener('click',()=>start(him?'me':'him'));
  const peek=k=>{$('salBody').innerHTML=salHTML(k,code,who);
    document.querySelectorAll('#peekRow button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
    const btn=document.querySelector(`#peekRow button[data-k="${k}"]`);btn.scrollIntoView({block:'nearest',inline:'center'});};
  $('salBody').addEventListener('click',e=>{const b=e.target.closest('.back-me');if(b)peek(b.dataset.k)});
  $('peekRow').addEventListener('click',e=>{const b=e.target.closest('button');if(b)peek(b.dataset.k)});
  $('gal').addEventListener('click',e=>{const d=e.target.closest('[data-k]');if(!d)return;peek(d.dataset.k);$('salSec').scrollIntoView({behavior:'smooth',block:'start'})});
  $('again').addEventListener('click',()=>start(mode));
  $('switch').addEventListener('click',()=>start(him?'me':'him'));
  $('resultView').hidden=false;$('resultView').scrollTop=0;busy=false;
}

// drag
let sx=0,dx=0,dragging=false;
let downSide=null;
card.addEventListener('pointerdown',e=>{if(busy)return;const o=e.target.closest('.opt');downSide=o?(o.id==='btnL'?'l':'r'):null;dragging=true;sx=e.clientX;dx=0;card.setPointerCapture(e.pointerId);card.className='card dragging';$('hand').hidden=true});
card.addEventListener('pointermove',e=>{if(!dragging)return;dx=e.clientX-sx;card.style.transform=`translateX(${dx}px) rotate(${dx/24}deg)`;preview(dx)});
function endDrag(){if(!dragging)return;dragging=false;if(Math.abs(dx)>80)choose(dx<0?'l':'r');else if(Math.abs(dx)<8&&downSide)choose(downSide);else{card.className='card back';card.style.transform='';preview(0)}}
card.addEventListener('pointerup',endDrag);card.addEventListener('pointercancel',endDrag);
$('btnL').addEventListener('click',e=>{if(e.detail===0)choose('l')});$('btnR').addEventListener('click',e=>{if(e.detail===0)choose('r')});
document.addEventListener('keydown',e=>{if(!$('startView').hidden||!$('resultView').hidden)return;if(e.key==='ArrowLeft')choose('l');if(e.key==='ArrowRight')choose('r')});
$('go').addEventListener('click',()=>start('me'));$('goHim').addEventListener('click',()=>start('him'));

// 海报弹窗
$('closeM').addEventListener('click',()=>{$('modal').hidden=true});
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')$('modal').hidden=true});
if(/xiaolipearl\.com$/.test(location.hostname))$('backhall').hidden=false;
// first paint
$('logo').src=pearLogo();$('mascot').src=pearLogo();
$('crowd').innerHTML=['RDLM','SDLM','SILC','RITM','RITC','SDTM','SILM','RDTC'].map(k=>`<div><img class="px" src="${persona(k)}" alt="${TYPES[k].name}">${TYPES[k].name}</div>`).join('');
deck=CARDS.map(c=>({...c,flip:false}));score=Object.fromEntries(DIMS.map(d=>[d.key,0]));buildKeys();show();
</script>
</body>
</html>
