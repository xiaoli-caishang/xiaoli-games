<style>
#imp{position:fixed;right:16px;bottom:50px;z-index:60;border:0;background:#161514;color:#F7F5F0;font:700 13px 'Noto Sans SC';padding:12px 18px;border-radius:99px;box-shadow:0 6px 20px rgba(0,0,0,.2);cursor:pointer}

<div id="banner"></div>
<button id="imp">导入我的数据</button>
<div id="modal"><div class="bx"><h4>导入我的数据</h4><p>把 AI 输出的 JSON 整段粘贴到下面，或者选择 data.json 文件。数据只保存在这台设备的浏览器里，不会上传到任何地方。</p>
<textarea id="ta" placeholder='{"period": "...", "total": ...}'></textarea><input type="file" id="fi" accept=".json,.txt" style="margin-top:10px;font-size:12px">
<div id="err"></div><div class="row"><button class="sub" id="demo">恢复演示数据</button><button class="go" id="ok">生成我的报告</button></div>
<div class="row"><button class="sub" id="cx">取消</button></div></div></div>
<script>
const REQ=['period','total','n','days','span','per_month','per_day','per_day_nh','median_day','top10','median','raw_out','refund','moves','cats','val','nec_pd','nec_nh_pd','rent_pd','mon','heat_n','heat_s','daily','top','dd','band','pareto','cumd','bigs','dom','wd_s','hab','rel','night_n','night_s','night_buy','zero_days','weekday_avg','weekend_avg'];
const M=document.getElementById('modal');document.getElementById('imp').onclick=()=>{M.style.display='flex'};document.getElementById('cx').onclick=()=>{M.style.display='none'};
document.getElementById('fi').onchange=e=>{const r=new FileReader();r.onload=()=>document.getElementById('ta').value=r.result;r.readAsText(e.target.files[0])};
document.getElementById('demo').onclick=()=>{localStorage.removeItem('bill5d');location.href=location.pathname};
document.getElementById('ok').onclick=()=>{const err=document.getElementById('err');let t=document.getElementById('ta').value;const a=t.indexOf('{'),b=t.lastIndexOf('}');
 if(a<0||b<0){err.textContent='没有找到 JSON 内容，请把 AI 输出的整段 JSON 粘进来。';return}
 let d;try{d=JSON.parse(t.slice(a,b+1))}catch(e){err.textContent='JSON 格式有误：'+e.message+'\n可以让 AI"只输出合法 JSON，不要注释"，再粘贴一次。';return}
 const miss=REQ.filter(k=>!(k in d));if(miss.length){err.textContent='缺少这些字段：'+miss.join('、')+'\n把这句话发给 AI，让它补齐后重新输出。';return}
 localStorage.setItem('bill5d',JSON.stringify(d));location.href=location.pathname};
if(window.__IMPORTED){const bn=document.getElementById('banner');bn.style.display='block';bn.innerHTML='正在查看：你导入的数据 · <a href="#" id="bk" style="color:#161514">换回演示数据</a>';document.getElementById('bk').onclick=e=>{e.preventDefault();document.getElementById('demo').click()}}
else{const bn=document.getElementById('banner');bn.style.display='block';bn.innerHTML='这是演示数据（虚构人物），点击右下角“导入我的数据”生成你自己的报告。<a href="kit.zip" download>下载工具包</a>'}
const banner=document.getElementById('banner'),imp=document.getElementById('imp'),placeImportButton=()=>{imp.style.bottom=`calc(${Math.ceil(banner.getBoundingClientRect().height)+10}px + env(safe-area-inset-bottom))`};new ResizeObserver(placeImportButton).observe(banner);placeImportButton();

// hist
(()=>{document.querySelectorAll('#hist div').forEach(el=>el.onclick=()=>{const d=D.dd[+el.dataset.i];const tv=D.dd.reduce((s,x)=>s+x.v,0);document.querySelectorAll('#hist div').forEach(x=>x.style.opacity=x===el?1:.4);
 $('histd').innerHTML=`每天 <b>${d.k}</b> 元的有 <b class="num">${d.n}</b> 天，占全年 ${pct(d.n,D.span)}% 的天数，花掉了 <b class="num">¥${f(d.v)}</b>，占 <b style="color:${P.s2.acc}">${pct(d.v,tv)}%</b> 的钱。`})})();
// calendar
(()=>{const st=DAT(0);const pad=(st.getDay()+6)%7;let s='';for(let i=0;i<pad;i++)s+='<i style="visibility:hidden"></i>';
const lv=v=>v==0?'rgba(255,255,255,.75)':v<200?'#F7EDC4':v<500?'#FEDE7B':v<2000?'#A9A28E':'#8B7250';
D.daily.forEach((d,i)=>{s+=`<i data-i="${i}" style="background:${lv(d[0])}"></i>`});$('cal').innerHTML=s;
bindTip('#cal i[data-i]',el=>{const i=+el.dataset.i,d=D.daily[i],dt=new Date(st.getTime()+i*864e5);return `${dt.getFullYear()}.${dt.getMonth()+1}.${dt.getDate()} · 周${'日一二三四五六'[dt.getDay()]}<br><b>¥${f(d[0])}</b> · ${d[1]} 笔${d[2]?' · 主要是'+d[2]:''}`})})();
// heat
(()=>{const draw=k=>{const M=k=='n'?D.heat_n:D.heat_s;const mx=Math.max(...M.flat());const c=v=>{const t=Math.pow(v/mx,.6);return t<.02?'rgba(255,255,255,.7)':t<.3?'#F7EDC4':t<.55?'#FEDE7B':t<.8?'#A9A28E':'#8B7250'};
 let s='';M.forEach((r,w)=>{s+=`<span style="align-self:center">${'一二三四五六日'[w]}</span>`+r.map((v,h)=>`<i data-w="${w}" data-h="${h}" style="background:${c(v)}"></i>`).join('')});$('heat').innerHTML=s;
 bindTip('#heat i',el=>{const w=+el.dataset.w,hh=+el.dataset.h;return `周${'一二三四五六日'[w]} ${hh}:00–${hh+1}:00<br><b>${D.heat_n[w][hh]} 笔</b> · ¥${f(D.heat_s[w][hh])}`})};draw('n');seg('s3',draw)})();
// cumulative
(()=>{const W=340,Hh=180,cd=D.cumd,N=cd.length,span=D.span;const bigCum=[];let acc=0,bi=0;const sb=[...D.bigs].sort((a,b)=>a.i-b.i);
for(let j=0;j<N;j++){const day=j*3;while(bi<sb.length&&sb[bi].i<=day){acc+=sb[bi].v;bi++}bigCum.push(cd[j]-acc)}
const mxv=cd[N-1]*1.05,X=j=>j/(N-1)*W,Y=v=>Hh-v/mxv*Hh;
const path=arr=>arr.map((v,j)=>(j?'L':'M')+X(j).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
const draw=k=>{const arr=k=='a'?cd:bigCum;const dots=k=='a'?sb.map(b=>{const j=Math.min(N-1,Math.floor(b.i/3));return `<circle cx="${X(j)}" cy="${Y(cd[j])}" r="${3+Math.sqrt(b.v)/22}" fill="${CC[b.g]||'#7191AA'}" stroke="#fff" stroke-width="1" data-v="${b.v}" data-g="${b.g}" data-i="${b.i}"/>`}).join(''):'';
 $('cum').innerHTML=`<path d="${path(arr)} L${W} ${Hh} L0 ${Hh}Z" fill="#AABDCC" opacity=".45"/><path d="${path(arr)}" fill="none" stroke="#4F6F88" stroke-width="2.5"/>${k=='b'?`<path d="${path(cd)}" fill="none" stroke="#161514" stroke-opacity=".25" stroke-dasharray="4 4"/>`:''}${dots}
 <line x1="0" x2="${W}" y1="${Hh}" y2="${Hh}" stroke="#161514" stroke-opacity=".5"/>${LAB(1).map((t,i)=>`<text x="${i/4*W}" y="${Hh+16}" text-anchor="${i==0?'start':i==4?'end':'middle'}" font-family="Archivo" font-size="10" fill="#8C877F">${t}</text>`).join('')}
 <text x="${W}" y="${Y(arr[N-1])-8}" text-anchor="end" font-family="Archivo" font-weight="800" font-size="16" fill="#161514">¥${wan(arr[N-1])}万</text>`;
 $('cumd').innerHTML=k=='a'?`每个圆点是一笔千元以上的消费，圆越大金额越高。曲线上每一次"台阶"，基本都对应一个大决定。`:`去掉这 ${sb.length} 笔之后，全年从 ¥${wan(cd[N-1])}万 降到 <b style="color:#4F6F88">¥${wan(bigCum[N-1])}万</b>，曲线也几乎变成一条平稳的直线。`;
 if(k=='a')bindTip('#cum circle',el=>{const dt=DAT(+el.dataset.i);return `${dt.getMonth()+1}.${dt.getDate()} · ${el.dataset.g}<br><b>¥${f(+el.dataset.v)}</b>`})};draw('a');seg('s4',draw)})();
// bands + pareto
(()=>{$('band').innerHTML=D.band.map(b=>`<div style="display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;gap:8px;margin:7px 0"><div style="display:flex;justify-content:flex-end;align-items:center;gap:6px"><span class="num" style="font-size:11px">${pct(b.n,nhN)}%</span><i style="height:18px;width:${Math.max(1.5,b.n/nhN*100*1.4)}%;background:#AABDCC;border-radius:5px 2px 2px 5px"></i></div><div class="cap" style="text-align:center;letter-spacing:0;color:#161514">${b.k}<br><span style="font-weight:400;color:#8C877F">${b.n} 笔</span></div><div style="display:flex;align-items:center;gap:6px"><i style="height:18px;width:${b.v/nhT*100*1.4}%;background:#4F6F88;border-radius:2px 5px 5px 2px"></i><span class="num" style="font-size:11px">${pct(b.v,nhT)}%</span></div></div>`).join('')+
`<div style="display:flex;justify-content:space-between;margin-top:8px" class="cap"><span>■ 笔数</span><span style="color:#4F6F88">金额 ■</span></div>`;
const P2=D.pareto,W=340,Hh=180;const d=`M0 ${Hh} `+P2.map((v,i)=>`L${(i+1)/100*W} ${Hh-v*Hh}`).join(' ');
$('par').innerHTML=`<line x1="0" y1="${Hh}" x2="${W}" y2="0" stroke="#161514" stroke-opacity=".2" stroke-dasharray="4 5"/><path d="${d} L${W} ${Hh}Z" fill="#AABDCC" fill-opacity=".5"/><path d="${d}" fill="none" stroke="#4F6F88" stroke-width="3"/><line id="pl" y1="0" y2="${Hh}" stroke="#161514"/><circle id="pc" r="6" fill="#161514"/><line x1="0" x2="${W}" y1="${Hh}" y2="${Hh}" stroke="#161514"/>`;
const upd=()=>{const p=+$('pr').value,y=P2[p-1];const X=p/100*W,Y=Hh-y*Hh;$('pl').setAttribute('x1',X);$('pl').setAttribute('x2',X);$('pc').setAttribute('cx',X);$('pc').setAttribute('cy',Y);
 $('prt').innerHTML=`最贵的 <span class="num">${p}%</span>（${Math.round(nhN*p/100)} 笔）= <span class="num" style="color:#4F6F88">${Math.round(y*100)}%</span> 的钱`};$('pr').oninput=upd;upd()})();
// family months
(()=>{const E=Object.entries(R.fmon),m=Math.max(...E.map(e=>e[1]));$('fam').innerHTML=E.map(([k,v],i)=>`<div data-i="${i}" style="flex:1;height:${Math.max(3,v/m*100)}%;background:${v>10000?P.s4.acc:'#F3D5CF'};border-radius:5px 5px 2px 2px;cursor:pointer"></div>`).join('');
document.querySelectorAll('#fam div').forEach(el=>el.onclick=()=>{const [k,v]=E[+el.dataset.i];document.querySelectorAll('#fam div').forEach(x=>x.style.opacity=x===el?1:.4);$('famd').innerHTML=`${k.replace('-','.')} 给家人 <b class="num">¥${f(v)}</b>${v>10000?' · 这个月有一笔大额支持':''}`})})();
// value
(()=>{const div={d:D.span,m:12,y:1},u={d:'/天',m:'/月',y:'/年'};const draw=k=>{$('val').innerHTML=`<div class="day" style="height:46px">${VV.map(v=>`<div style="flex:${v.v};background:${VC[v.k]};color:${v.k=='必要'?'#fff':'#161514'}">${pct(v.v,T)}%</div>`).join('')}</div>`+
 VV.map(v=>`<div class="vrow"><i style="background:${VC[v.k]}"></i><div><b>${v.k}</b><small>${Object.keys(v.sub).slice(0,4).join(' · ')}</small></div><span class="n">¥${f(v.v/div[k])}<small style="font:400 10px 'Noto Sans SC';display:inline">${u[k]}</small></span></div>`).join('')};draw('d');seg('s5',draw);
const mx=Math.max(...D.hab.map(h=>h.n));$('hab').innerHTML=D.hab.map((h,i)=>`<div class="r"><span class="k">${h.k}</span><div><div class="bar" style="width:${Math.max(4,h.n/mx*100)}%;background:${['#43201A','#8FB3C9','#B7D3E4','#EBD8CE','#EBD8CE','#B7D3E4'][i]}"></div></div><span class="v">${h.n}<small style="font:400 10px 'Noto Sans SC'"> 次</small></span></div><div style="font-size:11px;color:rgba(22,21,20,.55);margin:-4px 0 6px 86px">¥${f(h.v)} · 每次 ¥${f(h.v/h.n)} · 每周 ${(h.n/52).toFixed(1)} 次</div>`).join('')})();

(()=>{const cx=170,cy=170,R0=118;let cur=0,auto;const sv=$('orb');const pos=DX.map((d,i)=>{const a=-Math.PI/2+i*2*Math.PI/5;return [cx+R0*Math.cos(a),cy+R0*Math.sin(a)]});
sv.innerHTML=pos.map((p,i)=>`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#161514" stroke-opacity=".12"/>`).join('')+pos.map((p,i)=>`<line x1="${p[0]}" y1="${p[1]}" x2="${pos[(i+1)%5][0]}" y2="${pos[(i+1)%5][1]}" stroke="#161514" stroke-opacity=".08"/>`).join('')+
`<circle cx="${cx}" cy="${cy}" r="46" fill="#161514"/><text x="${cx}" y="${cy-4}" text-anchor="middle" font-family="Archivo" font-weight="800" font-size="20" fill="#FEDE7B">¥1</text><text x="${cx}" y="${cy+16}" text-anchor="middle" font-family="Noto Sans SC" font-size="10" fill="#F7F5F0" opacity=".7">一笔钱</text>`+
DX.map((d,i)=>`<g class="nd" data-i="${i}" style="transform-origin:${pos[i][0]}px ${pos[i][1]}px"><circle cx="${pos[i][0]}" cy="${pos[i][1]}" r="40" fill="${d[2]}" stroke="#161514" stroke-width="0"/><text x="${pos[i][0]}" y="${pos[i][1]-2}" text-anchor="middle" font-family="Noto Sans SC" font-weight="900" font-size="17" fill="#161514">${d[0]}</text><text x="${pos[i][0]}" y="${pos[i][1]+16}" text-anchor="middle" font-family="Instrument Serif" font-style="italic" font-size="13" fill="#161514" opacity=".6">${d[1]}</text></g>`).join('');
const sel=i=>{cur=i;const d=DX[i];sv.querySelectorAll('.nd').forEach(g=>{const on=+g.dataset.i===i;g.style.transform=on?'scale(1.14)':'scale(1)';g.querySelector('circle').setAttribute('stroke-width',on?3:0)});
 $('ans').style.background=d[2];$('ans').innerHTML=`<div class="w">${d[0]}<em>${d[1]}</em></div><div class="s">${d[3]}？${d[4]}。</div><div class="n">${d[5]}</div><div class="t">${d[6]}</div>`};
sel(0);sv.querySelectorAll('.nd').forEach(g=>g.addEventListener('click',()=>{clearInterval(auto);sel(+g.dataset.i)}));
auto=setInterval(()=>{const r=$('dec').getBoundingClientRect();if(r.top<innerHeight*.5&&r.bottom>innerHeight*.5)sel((cur+1)%5)},2600)})();
document.querySelectorAll('.l3').forEach(el=>el.addEventListener('click',()=>el.classList.toggle('open')));
addEventListener('scroll',hideTip,{passive:true});document.addEventListener('touchstart',e=>{if(!e.target.closest('#cal,#heat,#cum'))hideTip()},{passive:true});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');e.target.querySelectorAll('[data-to]').forEach(c=>{const to=+c.dataset.to,t0=performance.now();const st=t=>{const p=Math.min(1,(t-t0)/1400);c.textContent=f(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(st)};requestAnimationFrame(st)})}}),{threshold:.12});
document.querySelectorAll('.rv').forEach(e=>io.observe(e));
if(location.search.includes('static')){document.querySelectorAll('.rv').forEach(e=>e.classList.add('in'));document.querySelectorAll('[data-to]').forEach(c=>c.textContent=f(+c.dataset.to))}
const secs=[...document.querySelectorAll('section')];addEventListener('scroll',()=>{let k=0;secs.forEach((s,i)=>{if(s.getBoundingClientRect().top<120)k=i});document.querySelectorAll('#nav a').forEach((a,i)=>a.classList.toggle('on',i===k))});
</script></body></html>
