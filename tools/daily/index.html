<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>今天还能花多少 · 小梨工具坊</title>
<style>
:root{--paper:#F4F3EE;--ink:#1E201D;--ink-2:#5A5D57;--mute:#9A9C95;--hair:#E3E2DB;--juice-top:#B5D38A;--juice-bot:#4E8A62;--gold:#E3A33B;--bite:#D9695A;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--paper:#121412;--ink:#ECEDE6;--ink-2:#C8CABF;--hair:#2A2D28;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{height:100vh;height:100dvh;background:var(--paper);color:var(--ink);font:13px/1.4 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.08em;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button,textarea{font:inherit;color:inherit;letter-spacing:.08em}
button{cursor:pointer;touch-action:manipulation;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
.app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);overflow:hidden}
header{height:44px;flex:0 0 44px;display:flex;align-items:center;gap:8px;padding:0 14px}
.mark{width:16px;height:18px;image-rendering:pixelated;flex:0 0 auto}
.brand{font-weight:600}
.when{margin-left:auto;text-align:right;line-height:1.15}
.when small{display:block;color:var(--mute);font-size:13px}
#setup,#home{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.say{margin:6px 16px;line-height:2}
.say.dim{color:var(--mute)}
.say button{border:1px solid var(--hair);border-radius:8px;padding:2px 8px;min-height:32px}
.say button.on{border-color:var(--ink)}
.stage{flex:1 1 auto;min-height:0;max-height:38vh;position:relative;display:flex;align-items:center;justify-content:center}
@media(max-height:700px){.stage{max-height:30vh}}
.pearbox{position:relative;height:100%;aspect-ratio:.78;max-width:92vw}
.pearbox svg{height:100%;width:auto;display:block;overflow:visible}
.figure{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;padding:0 4px}
.hero{font-size:clamp(64px,22vw,96px);font-weight:250;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap;transform-origin:center}
.hero .to{color:var(--ink-2)}
.lbl{color:var(--mute);margin-top:4px;text-align:center}
.cap,.sub{margin:0;text-align:center;padding:0 12px;min-height:1.3em}
.cap{color:var(--ink-2)}
.sub{color:var(--mute)}
.hintbad{color:var(--ink-2)}
.dock,#setupPad{margin-top:auto;flex:0 0 auto}
.cats{display:flex;justify-content:center;gap:4px;height:0;opacity:0;overflow:hidden;pointer-events:none}
.cats.show{height:36px;opacity:1;pointer-events:auto}
.cats button{padding:4px 8px;border-radius:99px;border:1px solid transparent;color:var(--mute)}
.cats button.on{border-color:var(--ink);color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--hair)}
.pad button{min-height:56px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);font-size:22px;letter-spacing:0;font-variant-numeric:tabular-nums;color:var(--ink)}
.pad button:nth-child(3n){border-right:0}
.pad button:active{background:var(--hair)}
.actions{display:flex;gap:10px;align-items:center;padding:8px 14px}
.incbtn{width:88px;height:48px;color:var(--ink)}
.incbtn.on{font-weight:600}
.go{flex:1;height:48px;border-radius:10px;background:var(--juice-bot);color:#F4F3EE}
.go:disabled{opacity:.4}
.go.block{margin:0 14px 8px;flex:none;width:auto}
nav{display:flex;border-top:1px solid var(--hair);height:44px;padding-bottom:env(safe-area-inset-bottom);box-sizing:content-box}
nav button{flex:1;color:var(--ink-2)}
.undo{position:absolute;top:2px;left:50%;transform:translateX(-50%);z-index:2;border:1px solid var(--hair);background:var(--paper);border-radius:99px;padding:4px 12px;pointer-events:auto}
#rip.go{animation:rip .7s ease-out}
@keyframes rip{from{opacity:.7}to{opacity:0}}
#pearBody.pop{animation:ka .18s ease-out;transform-origin:80px 110px}
@keyframes ka{from{transform:scale(.96)}to{transform:scale(1)}}
#mask{position:fixed;inset:0;z-index:40;background:rgba(30,32,29,.28);display:flex;align-items:flex-end}
#sheet{background:var(--paper);color:var(--ink);width:min(480px,100%);margin:0 auto;max-height:92%;display:flex;flex-direction:column;border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom)}
.shead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--hair);flex:0 0 auto}
.sbody{overflow:auto;padding:8px 16px 12px;-webkit-overflow-scrolling:touch}
.sbody p{margin:8px 0}
.rowbtn{display:flex;width:100%;justify-content:space-between;align-items:center;min-height:44px;border-bottom:1px solid var(--hair)}
.fx{display:flex;align-items:center;gap:8px;min-height:44px;border-bottom:1px solid var(--hair)}
.fx span{flex:1;min-width:0}
.fx button.on{border:1px solid var(--ink);border-radius:8px;padding:4px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0}
.chips button{border:1px solid var(--hair);border-radius:99px;padding:6px 10px;color:var(--ink-2)}
textarea{width:100%;min-height:120px;border:1px solid var(--hair);background:transparent;border-radius:8px;padding:8px;resize:none;user-select:text;-webkit-user-select:text;letter-spacing:0}
.err{color:var(--bite)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(prefers-reduced-motion:no-preference){.cats{transition:opacity .2s}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="mark" viewBox="0 0 12 14"><path fill="#94744c" d="M6 0h1v3H6z"/><path fill="#8bae6d" d="M7 1h3v1H7z"/><path fill="#c8d98b" d="M5 2h2v1h1v2h1v1h1v1h1v2h1v3h-1v1H9v1H3v-1H1v-1H0V9h1V7h1V6h1V5h1V3h1z"/><path fill="#3e3b2f" d="M3 7h1v1H3zM8 7h1v1H8z"/><path fill="#e9ab90" d="M2 8h1v1H2zM9 8h1v1H9z"/><path fill="#bc7460" d="M5 9h3v1H5z"/></symbol></svg>
<div class="app">
<header>
  <svg class="mark"><use href="#mark"/></svg>
  <a class="brand" href="https://xiaolipearl.com/?from=daily">小梨工具坊</a>
  <div class="when"><span id="date"></span><small id="leftDays"></small></div>
</header>
<div id="setup">
  <div data-sentence id="setupSentence"></div>
  <div id="setupPear" class="stage"></div>
  <p id="hint" class="sub"></p>
  <button type="button" id="plant" class="go block">种下第一颗梨</button>
  <div id="setupPad"></div>
</div>
<div id="home" hidden>
  <div id="stage" class="stage"></div>
  <p id="cap" class="cap" aria-live="polite"></p>
  <p id="sub" class="sub" aria-live="polite"></p>
  <div id="yest" hidden></div>
  <div id="cats" class="cats"></div>
  <div class="dock">
    <div id="homePad"></div>

      <button type="button" id="inc" class="incbtn">+收入</button>
      <button type="button" id="ok" class="go">记下</button>
    </div>

      <button type="button" data-nav="orchard">梨园</button>

</div>
</div>
<div id="mask" hidden><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="pearbox" class="pearbox" hidden>
  <button type="button" id="undo" class="undo" hidden>撤销</button>
  <svg id="pearSvg" viewBox="0 0 160 206" aria-hidden="true">
    <defs>
      <linearGradient id="jg" gradientUnits="userSpaceOnUse" x1="0" y1="74" x2="0" y2="198">
        <stop offset="0" stop-color="#B5D38A"/><stop offset="1" stop-color="#4E8A62"/>
      </linearGradient>
      <clipPath id="pearClip"><path d="M80 34C96 34 106 50 108 66C128 78 150 104 150 136C150 170 122 196 80 198C38 196 10 170 10 136C10 104 32 78 52 66C54 50 64 34 80 34Z"/></clipPath>
      <mask id="biteMask"><rect width="160" height="206" fill="#fff"/><circle id="bite" cx="124" cy="86" r="0" fill="#000"/></mask>
    </defs>
    <g id="pearBody" mask="url(#biteMask)">
      <g clip-path="url(#pearClip)"><path id="wave" fill="url(#jg)"/><line id="dash" x1="18" x2="142" y1="0" y2="0" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/></g>
      <path fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.85" d="M80 34C96 34 106 50 108 66C128 78 150 104 150 136C150 170 122 196 80 198C38 196 10 170 10 136C10 104 32 78 52 66C54 50 64 34 80 34Z"/>
    </g>
    <path fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.85" d="M80 34C82 24 90 16 98 8"/>
    <path fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.85" d="M92 14C112 4 138 16 124 34C110 30 98 22 92 14Z"/>
    <circle id="rip" cx="80" cy="130" r="46" fill="none" stroke="#E3A33B" stroke-width="2" opacity="0"/>
  </svg>
  <div class="figure"><div id="hero" class="hero"></div><div id="lbl" class="lbl">今天还能花</div></div>
</div>
<script>
/*core*/
const DAY=86400000;
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const payDate=(y,m,pd)=>new Date(y,m,Math.min(pd,dim(y,m)));
const keyOf=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const diff=(a,b)=>Math.round((b-a)/DAY);
function cycleOf(today,pd){
  let s=payDate(today.getFullYear(),today.getMonth(),pd);
  if(s>today)s=payDate(today.getFullYear(),today.getMonth()-1,pd);
  const e=payDate(s.getFullYear(),s.getMonth()+1,pd);
  return{start:s,end:e};
}
const sum=a=>a.reduce((x,y)=>x+y,0);
const fixedOf=st=>sum(st.fixed.map(f=>+f.a||0));
const availOf=st=>st.income-fixedOf(st)-st.save;
function compute(D,today){
  const st=D.setup,c=cycleOf(today,st.payday),sk=keyOf(c.start),ek=keyOf(c.end),tk=keyOf(today);
  const inCycle=D.entries.filter(e=>e.d>=sk&&e.d<ek&&e.src!=='save');
  const out=inCycle.filter(e=>e.a>0),income=-sum(inCycle.filter(e=>e.a<0).map(e=>e.a));
  const spentCycle=sum(out.map(e=>e.a));
  const spentToday=sum(out.filter(e=>e.d===tk).map(e=>e.a));
  const avail=availOf(st)+income;
  const daysLeft=Math.max(1,diff(today,c.end));
  const cycleDays=diff(c.start,c.end);
  const elapsed=cycleDays-daysLeft+1;
  const remainStart=avail-(spentCycle-spentToday);
  const allowance=Math.max(0,remainStart/daysLeft);
  const todayLeft=allowance-spentToday;
  const remain=avail-spentCycle;
  const tomorrow=daysLeft>1?Math.max(0,remain/(daysLeft-1)):null;
  const usingSince=D.since&&D.since>sk?D.since:sk;
  const usedDays=Math.max(1,diff(parse(usingSince),today)+1);
  const avg=sum(out.filter(e=>e.c!=='之前').map(e=>e.a))/usedDays;
  let pace=null;
  if(usedDays>=3&&avg>0&&remain>0){
    const proj=remain-avg*(daysLeft-1);
    if(proj<0){const last=new Date(today.getTime()+Math.floor(remain/avg)*DAY);pace={short:true,avg,last,early:diff(last,c.end)}}
    else pace={short:false,avg,extra:proj};
  }
  return{c,sk,ek,tk,avail,spentCycle,spentToday,daysLeft,cycleDays,elapsed,allowance,todayLeft,remain,tomorrow,pace,ref:availOf(st)/cycleDays,income,inCycle,remainStart};
}
function rollover(D,today){
  const c=cycleOf(today,D.setup.payday),sk=keyOf(c.start);
  if(D.cycle.start===sk)return null;
  let ended=null;
  if(D.cycle.start&&D.cycle.start<sk){
    const prevStart=D.cycle.start;
    const spent=sum(D.entries.filter(e=>e.d>=prevStart&&e.d<sk&&e.src!=='save').map(e=>e.a));
    const avail=D.cycle.avail??availOf(D.setup);
    ended={start:prevStart,end:sk,avail,spent,left:Math.round((avail-spent)*100)/100,saved:D.cycle.saved?D.cycle.planSave:0};
    D.history.unshift(ended);D.history=D.history.slice(0,12);
  }
  D.cycle={start:sk,saved:false,avail:availOf(D.setup),planSave:D.setup.save};
  const cut=keyOf(new Date(today.getTime()-120*DAY));
  D.entries=D.entries.filter(e=>e.d>=cut);
  return ended;
}
function preview(D,today,amount,isIncome){
  const C=JSON.parse(JSON.stringify(D));
  C.entries=C.entries||[];
  C.entries.push({d:keyOf(today),a:isIncome?-Math.abs(+amount):Math.abs(+amount)});
  const R=compute(C,today);
  return{todayLeft:R.todayLeft,tomorrow:R.tomorrow,level:R.allowance>0?R.todayLeft/R.allowance:0};
}
function ensure(D){
  if(!D||typeof D!=='object')return D;
  if(!Array.isArray(D.entries))D.entries=[];
  if(!Array.isArray(D.history))D.history=[];
  if(!D.cycle||typeof D.cycle!=='object')D.cycle={start:null};
  if(typeof D.savedTotal!=='number')D.savedTotal=0;
  if(!D.days||typeof D.days!=='object')D.days={};
  if(!D.ui||typeof D.ui!=='object')D.ui={lastOpen:null,a2hsDismissed:false,hideAmounts:true};
  else{if(D.ui.a2hsDismissed==null)D.ui.a2hsDismissed=false;if(D.ui.hideAmounts==null)D.ui.hideAmounts=true}
  if(D.setup){
    if(!Array.isArray(D.setup.fixed))D.setup.fixed=[];
    if(typeof D.setup.save!=='number')D.setup.save=0;
    if(typeof D.setup.payday!=='number')D.setup.payday=10;
    if(typeof D.setup.income!=='number')D.setup.income=0;
  }
  return D;
}
/*end*/
const $=s=>document.querySelector(s);
const KEY='xl_daily_v1';
const CATS=['吃饭','交通','购物','娱乐','其他'];
const PRESET=['房租','房贷','话费网费','交通卡','会员订阅','保险','给家里','还信用卡'];
const qd=new URLSearchParams(location.search).get('d');
const TODAY=(()=>{if(qd&&/^\d{4}-\d{2}-\d{2}$/.test(qd))return parse(qd);const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())})();
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const YT=74,YB=190,PEAR_W=140;
let seq=0;const uid=()=>Date.now()*10+(seq++%10);
const fmt=n=>{const r=Math.round(n*100)/100;if(Math.abs(r-Math.round(r))<1e-9)return Math.round(r).toLocaleString('zh-CN');return r.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})};
const ym=n=>(n<0?'-':'')+'¥'+fmt(Math.abs(n));
function pick(arr,salt){const s=keyOf(TODAY)+'|'+salt;let h=0;for(let i=0;i<s.length;i++)h=(h*33+s.charCodeAt(i))>>>0;return arr[h%arr.length]}
function fillCopy(t,map){return t.replace(/\{(\w+)\}/g,(_,k)=>map[k]??'')}
const COPY={
  morning:['早，今天这颗梨 ¥{n}。','新的一颗，¥{n}。','今天的份到了：¥{n}。'],
  left:['稳，还剩 ¥{n}。','还剩 ¥{n}，节奏刚好。','记下了，还剩 ¥{n}。'],
  even:['今天刚好吃完，正好。','正好花完今天的份。','今天这颗梨吃完了。'],
  over:['咬多了一口，明天小一点就好。','超了 ¥{n}，已经摊到后面了。','明天的梨小一点，就补上了。']
};
let D=null,setupMode=true,buf='',incMode=false,cat=null,field='income',raw='';
let payday=10,income=0,savePct=10,already=0,fixed=[];
let sheetName=null,sheetFrom=null,clearArmed=false,undoTimer=0,lastR=null,biteOn=false,booted=false;
let target=0,level=0,vel=0,amp=3,phase=0,raf=0,running=false,lastT=0,started=false,previewY=null;
const wave=$('#wave'),dash=$('#dash'),bite=$('#bite');
function yOf(L){const c=Math.max(0,Math.min(1,L));return YB-(YB-YT)*c}
function waveD(y,a,ph){
  const L=16,R=144,B=206;let d='M'+L+' '+y.toFixed(2);
  for(let i=1;i<=24;i++){const x=L+(R-L)*i/24;const yy=y+Math.sin(ph+i/24*Math.PI*2)*a;d+='L'+x.toFixed(2)+' '+yy.toFixed(2)}
  return d+'L'+R+' '+B+'L'+L+' '+B+'Z';
}
function draw(){
  wave.setAttribute('d',waveD(yOf(level),reduced?0:amp,phase));
  if(previewY==null)dash.setAttribute('visibility','hidden');
  else{dash.setAttribute('visibility','visible');dash.setAttribute('y1',previewY.toFixed(2));dash.setAttribute('y2',previewY.toFixed(2))}
}
function setTarget(t,kick){
  const n=Math.max(0,Math.min(1,t));
  if(!started){target=level=n;vel=0;started=true;draw();return}
  if(Math.abs(n-target)<1e-4&&!kick)return;
  target=n;
  if(kick&&!reduced)amp=10;
  if(reduced){level=target;vel=0;draw()}
}
function loop(now){
  raf=requestAnimationFrame(loop);
  if(!lastT)lastT=now;
  const dt=Math.min(0.032,(now-lastT)/1000);lastT=now;
  if(reduced){level=target;amp=0}
  else{
    vel+=(-170*(level-target)-18*vel)*dt;level+=vel*dt;
    if(level>1.12){level=1.12;vel*=.2}if(level<-.05){level=-.05;vel*=.2}
    phase+=.6*Math.PI*2*dt;
    if(amp>3)amp=3+(amp-3)*Math.exp(-dt/.4);
  }
  draw();
}
function startLoop(){if(reduced){draw();return}if(running)return;running=true;lastT=0;raf=requestAnimationFrame(loop)}
document.addEventListener('visibilitychange',()=>{if(document.hidden){running=false;cancelAnimationFrame(raf)}else startLoop()});
function placePear(slot){const p=$('#pearbox');p.hidden=false;slot.appendChild(p)}
function padHTML(){const keys=['1','2','3','4','5','6','7','8','9','.','0','bs'];return `<div class="pad">${keys.map(k=>`<button type="button" data-k="${k}" ${k==='bs'?'aria-label="删除"':''}>${k==='bs'?'⌫':k}</button>`).join('')}</div>`}
function sentenceHTML(withAlready){
  return `<p class="say">我每月 <button type="button" data-field="payday"></button> 号发工资，到手 <button type="button" data-field="income"></button>，</p>
  <p class="say">固定要付 <button type="button" data-field="fixed"></button>，想先存 <button type="button" data-field="pct"></button>。</p>
  ${withAlready?'<p class="say dim">这次发工资后已经花了 <button type="button" data-field="already"></button></p>':''}`;
}
function draftSetup(){
  const pd=payday>=1&&payday<=31?payday:10;
  const save=Math.round((+income||0)*(+savePct||0)/100);
  return{payday:pd,income:+income||0,fixed:fixed.map(f=>({n:f.n,a:+f.a||0})),save};
}
function draftResult(){
  const st=draftSetup();
  const entries=[];
  if(already>0)entries.push({d:keyOf(cycleOf(TODAY,st.payday).start),a:already,c:'之前'});
  const fake={setup:st,entries,cycle:{start:null},since:keyOf(TODAY)};
  const av=availOf(st);
  if(!(st.income>0)||!(payday>=1&&payday<=31))return{st,av,R:null};
  return{st,av,R:compute(fake,TODAY)};
}
function fieldText(name){
  const active=field===name;
  if(name==='payday')return active&&raw!==''?raw:(payday?String(payday):'几');
  if(name==='income')return active?(raw===''?'¥':('¥'+raw)):'¥'+fmt(income||0);
  if(name==='pct')return (active&&raw!==''?raw:String(savePct||0))+'%';
  if(name==='already')return active?(raw===''?'¥':('¥'+raw)):'¥'+fmt(already||0);
  if(name==='fixed')return '¥'+fmt(sum(fixed.map(f=>+f.a||0)))+' ▸';
  return '';
}
function fillSentence(root){
  root.querySelectorAll('[data-field]').forEach(b=>{b.textContent=fieldText(b.dataset.field);b.classList.toggle('on',field===b.dataset.field||(field.indexOf('fx')===0&&b.dataset.field==='fixed'))});
}
function paintSentences(){document.querySelectorAll('[data-sentence]').forEach(fillSentence)}
function paintHeader(R){
  const wd='日一二三四五六'[TODAY.getDay()];
  $('#date').textContent=`${TODAY.getMonth()+1}月${TODAY.getDate()}日 周${wd}`;
  $('#leftDays').textContent=R?R.daysLeft===1?'明天发工资':`还有 ${R.daysLeft} 天发工资`:'';
}
function setHero(main,label,alt){
  const h=$('#hero');
  if(alt==null)h.textContent=main;
  else h.innerHTML=`${main}<span class="to"> → ${alt}</span>`;
  $('#lbl').textContent=label;
  requestAnimationFrame(fitHero);
}
function fitHero(){
  const el=$('#hero'),slot=el.closest('.stage')||el.parentElement;
  const box=(slot.clientWidth||300)-8;
  el.style.transform='';
  if(el.scrollWidth>box&&el.scrollWidth>0)el.style.transform='scale('+(box/el.scrollWidth)+')';
}
function loadFieldsFromD(){
  payday=D.setup.payday;income=D.setup.income;fixed=D.setup.fixed.map(f=>({n:f.n,a:+f.a||0}));
  savePct=income?Math.round(D.setup.save/income*100):0;already=0;field='income';raw='';
}
function writeThrough(){
  if(!D||!D.setup)return;
  const st=draftSetup();
  const prev=D.setup.save,moved=st.payday!==D.setup.payday;
  D.setup=st;
  if(moved)D.cycle.start=keyOf(cycleOf(TODAY,st.payday).start);
  if(D.cycle.saved&&prev!==st.save)D.savedTotal+=st.save-prev;
  D.cycle.avail=availOf(st);D.cycle.planSave=st.save;
  store();
}
function focusField(name){
  if(name==='fixed'){openFixed();return}
  field=name;
  if(name==='payday')raw=payday?String(payday):'';
  else if(name==='income')raw=income?String(income):'';
  else if(name==='pct')raw=savePct?String(savePct):'';
  else if(name==='already')raw=already?String(already):'';
  else if(name.indexOf('fx')===0){const i=+name.slice(2);raw=fixed[i]&&fixed[i].a?String(fixed[i].a):''}
  paintSentences();renderFixed();if(setupMode)paintSetup();else if(sheetName==='settings'){writeThrough();render()}
}
function nudgeMoney(s,k,max){
  if(k==='bs')return s.slice(0,-1);
  if(k==='.'){if(s.includes('.'))return s;return(s||'0')+'.'}
  if(!/^\d$/.test(k))return s;
  let next=s==='0'?k:s+k;
  const p=next.split('.');
  if(p[0].length>6||(p[1]&&p[1].length>2))return s;
  if(+next>max)return s;
  return next;
}
function nudgeInt(s,k,max){
  if(k==='bs')return s.slice(0,-1);
  if(k==='.'||!/^\d$/.test(k))return s;
  const next=(s==='0'?k:s+k).replace(/^0+(\d)/,'$1');
  if(+next>max)return s;
  return next;
}
function applyRaw(){
  if(field==='payday')payday=+raw||0;
  else if(field==='income')income=Math.round((+raw||0)*100)/100;
  else if(field==='pct')savePct=+raw||0;
  else if(field==='already')already=Math.round((+raw||0)*100)/100;
  else if(field.indexOf('fx')===0){const i=+field.slice(2);if(fixed[i])fixed[i].a=Math.round((+raw||0)*100)/100}
}
function editingFigure(){return setupMode||sheetName==='settings'||sheetName==='fixed'}
function press(k){
  if(!editingFigure()){buf=nudgeMoney(buf,k,99999);render();return}
  if(field.indexOf('fx')===0||field==='income'||field==='already')raw=nudgeMoney(raw,k,999999);
  else if(field==='payday')raw=nudgeInt(raw,k,31);
  else if(field==='pct')raw=nudgeInt(raw,k,100);
  else return;
  applyRaw();paintSentences();renderFixed();
  if(setupMode&&sheetName!=='fixed')paintSetup();
  else if(!setupMode){writeThrough();render()}
  else paintSetup();
}
function amt(){if(!buf||buf==='.')return 0;const n=Math.round(parseFloat(buf)*100)/100;return n>0?n:0}
function levelOf(R){return R.allowance>0?R.todayLeft/R.allowance:(R.todayLeft>0?1:0)}
function updateBite(R){
  let r=0;
  if(R.todayLeft<-0.009)r=R.allowance>0?Math.min(.35*PEAR_W,(-R.todayLeft)/R.allowance*PEAR_W):.35*PEAR_W;
  bite.setAttribute('r',r.toFixed(2));
  const show=r>0.8;
  if(show&&!biteOn&&booted){const g=$('#pearBody');g.classList.remove('pop');void g.getBoundingClientRect();g.classList.add('pop')}
  biteOn=show;
}
function render(){
  if(!D||!D.setup)return;
  const R=compute(D,TODAY);lastR=R;paintHeader(R);paintSentences();
  const v=amt();
  $('#cats').classList.toggle('show',v>0&&!incMode);
  $('#cats').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.cat===cat));
  $('#inc').classList.toggle('on',incMode);
  if(v>0){
    const pv=preview(D,TODAY,v,incMode);
    previewY=yOf(pv.level);
    setHero(ym(Math.max(0,R.todayLeft)),incMode?'记下收入':'记下后',ym(pv.todayLeft));
    const tom=pv.tomorrow==null?'发工资':ym(pv.tomorrow);
    $('#sub').textContent=pv.todayLeft<-0.009?`记下后：超了 ${ym(-pv.todayLeft)} · 明天 ${tom}`:`记下后：今天剩 ${ym(Math.max(0,pv.todayLeft))} · 明天 ${tom}`;
    $('#cap').textContent='';
  }else{
    previewY=null;
    setTarget(levelOf(R),false);
    setHero(ym(Math.max(0,R.todayLeft)),R.todayLeft<-0.009?'今天还能花':'今天还能花');
    const tom=R.tomorrow==null?'明天发工资':`明天 ${ym(R.tomorrow)}`;
    $('#sub').textContent=R.remain<-0.009?`${tom} · 本期超了 ${ym(-R.remain)}`:`${tom} · 本期还剩 ${ym(R.remain)}`;
    let cap='';
    if(R.todayLeft<-0.009)cap=fillCopy(pick(COPY.over,'over'),{n:fmt(-R.todayLeft)});
    else if(R.spentToday>0&&R.todayLeft<=0.009)cap=pick(COPY.even,'even');
    else if(R.spentToday>0)cap=fillCopy(pick(COPY.left,'left'),{n:fmt(R.todayLeft)});
    else cap=fillCopy(pick(COPY.morning,'morning'),{n:fmt(R.allowance)});
    $('#cap').textContent=cap;
  }
  updateBite(R);
  if(!booted)booted=true;
}
function paintSetup(){
  paintSentences();
  const d=draftResult();
  const hint=$('#hint'),btn=$('#plant');
  paintHeader(d.R);
  if(!(income>0)||!(payday>=1&&payday<=31)){hint.className='sub';hint.textContent='先填到手工资';btn.disabled=true;setTarget(0,false);setHero('¥0','每天');return}
  if(d.av<=0){hint.className='sub hintbad';hint.textContent='固定支出和存钱超过了工资，调一下';btn.disabled=true;setTarget(0,false);setHero('¥0','每天');return}
  hint.className='sub';hint.textContent='每天 ¥'+fmt(d.R.allowance);btn.disabled=false;
  const was=target;setTarget(1,started&&was<0.5);setHero('¥'+fmt(d.R.allowance),'每天');
}
function store(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
function commit(){
  const v=amt();if(!(v>0)||!D)return;
  const e={id:uid(),d:keyOf(TODAY),a:incMode?-v:v};
  if(incMode)e.c='收入';else if(cat)e.c=cat;
  D.entries.push(e);buf='';incMode=false;cat=null;store();
  if(e.a<0){const c=$('#rip');c.classList.remove('go');void c.getBoundingClientRect();c.classList.add('go')}
  try{if(navigator.vibrate)navigator.vibrate(12)}catch(err){}
  armUndo(e);
  const R=compute(D,TODAY);
  setTarget(levelOf(R),true);
  render();
}
function armUndo(e){
  const b=$('#undo');b.hidden=false;b.onclick=ev=>{ev.stopPropagation();D.entries=D.entries.filter(x=>x.id!==e.id);store();b.hidden=true;const R=compute(D,TODAY);setTarget(levelOf(R),true);render()};
  clearTimeout(undoTimer);undoTimer=setTimeout(()=>{b.hidden=true},4000);
}
function showSetup(){
  setupMode=true;field='income';raw='';payday=10;income=0;savePct=10;already=0;fixed=[];
  $('#setup').hidden=false;$('#home').hidden=true;$('#setupSentence').innerHTML=sentenceHTML(true);
  placePear($('#setupPear'));paintSetup();startLoop();
}
function showHome(){
  setupMode=false;ensure(D);
  const ended=rollover(D,TODAY);if(ended)D.ended=ended;
  loadFieldsFromD();store();
  $('#setup').hidden=true;$('#home').hidden=false;placePear($('#stage'));
  $('#cats').innerHTML=CATS.map(c=>`<button type="button" data-cat="${c}">${c}</button>`).join('');
  render();startLoop();
}
function plant(){
  const d=draftResult();if(!(d.st.income>0)||d.av<=0||!(payday>=1&&payday<=31))return;
  d.st.fixed=d.st.fixed.filter(f=>f.a>0);fixed=d.st.fixed.map(f=>({n:f.n,a:f.a}));
  D=ensure({setup:d.st,entries:[],savedTotal:0,history:[],cycle:{start:null},ended:null,since:keyOf(TODAY),days:{},ui:{lastOpen:null,a2hsDismissed:false,hideAmounts:true}});
  rollover(D,TODAY);
  if(already>0)D.entries.push({id:uid(),d:D.cycle.start,a:already,c:'之前'});
  store();buf='';incMode=false;cat=null;showHome();
}
function closeMask(){sheetName=null;sheetFrom=null;clearArmed=false;$('#mask').hidden=true;$('#sheet').innerHTML=''}
function closeTop(){
  if((sheetName==='fixed'||sheetName==='import')&&sheetFrom){
    fixed=fixed.filter(f=>f.a>0);
    const back=sheetFrom;sheetFrom=null;
    if(setupMode)paintSetup();else writeThrough();
    if(back==='settings'){openSettings();return}
    closeMask();if(!setupMode)render();return;
  }
  if(!setupMode){fixed=fixed.filter(f=>f.a>0);writeThrough();render()}
  closeMask();
}
function openSettings(){
  sheetName='settings';sheetFrom=null;field='income';raw=income?String(income):'';
  $('#mask').hidden=false;
  $('#sheet').innerHTML=`<div class="shead"><span>设置</span><button type="button" data-close>完成</button></div>
  <div class="sbody"><div data-sentence>${sentenceHTML(false)}</div>
  <button type="button" class="rowbtn" data-act="export">导出备份</button>
  <button type="button" class="rowbtn" data-act="import">导入备份</button>
  <button type="button" class="rowbtn" id="clearBtn" data-act="clear">清空数据</button>
  <p class="sub" style="text-align:left">数据只在这台手机里。换手机前先导出一段备份文字。</p></div>
  ${padHTML()}`;
  paintSentences();
}
function renderFixed(){
  const box=$('#fxList');if(!box)return;
  box.innerHTML=fixed.length?fixed.map((f,i)=>`<div class="fx"><span>${f.n.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</span><button type="button" data-field="fx${i}" class="${field==='fx'+i?'on':''}">¥${field==='fx'+i?(raw===''?'':raw):fmt(f.a||0)}</button><button type="button" data-del="${i}" aria-label="删除">×</button></div>`).join(''):'<p class="sub" style="text-align:left">还没有固定支出</p>';
}
function openFixed(){
  sheetFrom=sheetName==='settings'?'settings':(setupMode?'setup':null);
  sheetName='fixed';
  $('#mask').hidden=false;
  $('#sheet').innerHTML=`<div class="shead"><span>固定要付</span><button type="button" data-close>完成</button></div>
  <div class="sbody"><div class="chips">${PRESET.map(p=>`<button type="button" data-add="${p}">+ ${p}</button>`).join('')}<button type="button" data-add="其他">+ 其他</button></div><div id="fxList"></div></div>${padHTML()}`;
  renderFixed();
}
function openImport(){
  sheetFrom='settings';sheetName='import';
  $('#sheet').innerHTML=`<div class="shead"><span>导入备份</span><button type="button" data-close>取消</button></div>
  <div class="sbody"><p>粘贴之前导出的那段文字，核对无误后再覆盖。</p>
  <textarea id="imp" placeholder="把备份文字粘贴在这里"></textarea>
  <p id="impErr" class="err"></p>
  <button type="button" class="go block" data-act="doImport" style="margin:12px 0">覆盖本机数据</button></div>`;
}
function doImport(){
  const text=($('#imp')&&$('#imp').value||'').trim();let o,err='';
  try{o=JSON.parse(text)}catch(e){err='这段文字不是备份'}
  if(!err){
    if(!o||typeof o!=='object'||!o.setup||typeof o.setup.payday!=='number'||typeof o.setup.income!=='number'||!Array.isArray(o.setup.fixed)||!Array.isArray(o.entries))err='备份里缺了工资或记录';
  }
  const box=$('#impErr');if(box)box.textContent=err;if(err)return;
  D=ensure(o);store();closeMask();showHome();
}
function openSoon(title){
  sheetName=title;sheetFrom=null;
  $('#mask').hidden=false;
  $('#sheet').innerHTML=`<div class="shead"><span>${title}</span><button type="button" data-close>完成</button></div><div class="sbody"><p class="sub" style="text-align:left">先把今天记下来。</p></div>`;
}
document.body.addEventListener('click',ev=>{
  const k=ev.target.closest('[data-k]');if(k){press(k.dataset.k);return}
  const f=ev.target.closest('[data-field]');if(f){focusField(f.dataset.field);return}
  const catBtn=ev.target.closest('[data-cat]');if(catBtn){cat=cat===catBtn.dataset.cat?null:catBtn.dataset.cat;render();return}
  const nav=ev.target.closest('[data-nav]');if(nav){if(nav.dataset.nav==='settings')openSettings();else openSoon(nav.dataset.nav==='orchard'?'梨园':'梨罐');return}
  if(ev.target.id==='ok'){commit();return}
  if(ev.target.id==='inc'){incMode=!incMode;render();return}
  if(ev.target.id==='plant'){plant();return}
  if(ev.target.closest('[data-close]')){closeTop();return}
  if(ev.target.id==='mask'){closeTop();return}
  const add=ev.target.closest('[data-add]');
  if(add){if(fixed.length<12){fixed.push({n:add.dataset.add,a:0});field='fx'+(fixed.length-1);raw='';renderFixed()}return}
  const del=ev.target.closest('[data-del]');
  if(del){fixed.splice(+del.dataset.del,1);field='income';raw='';renderFixed();paintSentences();return}
  const act=ev.target.closest('[data-act]');
  if(!act)return;
  if(act.dataset.act==='export'){
    const text=JSON.stringify(D);
    sheetName='export';sheetFrom='settings';
    $('#sheet').innerHTML=`<div class="shead"><span>导出备份</span><button type="button" data-close>完成</button></div><div class="sbody"><p>复制备用文字，存在别处。导入时整段贴回来。</p><textarea id="exp" readonly></textarea></div>`;
    $('#exp').value=text;$('#exp').focus();$('#exp').select();
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).catch(()=>{});
  }else if(act.dataset.act==='import')openImport();
  else if(act.dataset.act==='doImport')doImport();
  else if(act.dataset.act==='clear'){
    if(!clearArmed){clearArmed=true;act.textContent='再点一次，确认清空';setTimeout(()=>{if(clearArmed&&act.isConnected){clearArmed=false;act.textContent='清空数据'}},4000)}
    else{localStorage.removeItem(KEY);location.reload()}
  }
});
document.addEventListener('keydown',ev=>{
  if(ev.target.tagName==='TEXTAREA')return;
  if(/^\d$/.test(ev.key)||ev.key==='.')press(ev.key==='.'?'.':ev.key);
  else if(ev.key==='Backspace')press('bs');
  else if(ev.key==='Enter'&&!setupMode)commit();
});
$('#setupPad').innerHTML=padHTML();
$('#homePad').innerHTML=padHTML();
try{D=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){D=null}
if(D&&D.setup){ensure(D);showHome()}else showSetup();
</script>
</body>
</html>
