<style>
:root{--paper:#F4F3EE;--ink:#1E201D;--ink-2:#5A5D57;--mute:#9A9C95;--hair:#E3E2DB;--juice-top:#B5D38A;--juice-bot:#4E8A62;--gold:#E3A33B;--bite:#D9695A;color-scheme:light}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{height:100vh;height:100dvh;background:var(--paper);color:var(--ink);font:13px/1.4 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.08em;user-select:none;-webkit-user-select:none;touch-action:manipulation}

a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
.app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);overflow:hidden}
header{height:44px;flex:0 0 44px;display:flex;align-items:center;gap:8px;padding:0 14px}
.mark{width:16px;height:18px;image-rendering:pixelated;flex:0 0 auto}

.say{margin:6px 16px;line-height:2}

.hero .to{color:var(--ink-2)}

textarea{width:100%;min-height:120px;border:1px solid var(--hair);background:transparent;border-radius:8px;padding:8px;resize:none;user-select:text;-webkit-user-select:text;letter-spacing:0}

#a2hs button{border:1px solid var(--hair);border-radius:99px;padding:4px 12px;margin-top:6px}
#sheet img{width:100%;height:auto;-webkit-touch-callout:default;user-select:auto}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mute);border-radius:8px}
.cell svg{width:26px;height:34px}
.cell.today{outline:1px solid var(--ink)}
.choice{display:block;width:100%;text-align:left;min-height:52px;border-bottom:1px solid var(--hair);padding:8px 0}
.choice b{font-weight:600}
#ritual{position:fixed;inset:0;z-index:60;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.rbody{flex:1;overflow:auto;padding:8px 20px 24px}
#jarTrack{position:relative;height:200px;width:36px;margin:18px auto;border:1px solid var(--gold);border-radius:18px;touch-action:none}
#handle{position:absolute;left:50%;width:44px;height:44px;border-radius:50%;background:var(--gold);transform:translate(-50%,50%)}
.fxrow{padding:8px 0;border-bottom:1px solid var(--hair);color:var(--ink-2)}
.split{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:16px 0}
.split i{width:16px;height:22px;border:1px solid var(--ink);border-radius:0 0 9px 9px;background:linear-gradient(#B5D38A,#4E8A62)}
.jarwrap{display:flex;justify-content:center;margin:8px 0}
@media(prefers-reduced-motion:no-preference){
  .cell.today{animation:breath 2.4s ease-in-out infinite}
  .fxrow{animation:slide .35s ease both}
  .split i{animation:fall .2s cubic-bezier(.2,.8,.2,1) both}
  .droping{animation:drop .42s cubic-bezier(.2,.8,.2,1.2)}
}
@keyframes breath{50%{outline-color:transparent}}
@keyframes slide{from{transform:translateX(12px);opacity:0}to{transform:none;opacity:1}}
@keyframes fall{from{transform:translateY(-18px);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{from{transform:translateY(-36vh)}to{transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(prefers-reduced-motion:no-preference){.cats{transition:opacity .2s}}
</style>

<script>
/*core*/
const DAY=86400000;
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const payDate=(y,m,pd)=>new Date(y,m,Math.min(pd,dim(y,m)));
const keyOf=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const diff=(a,b)=>Math.round((b-a)/DAY);
function cycleOf(today,pd){
  let s=payDate(today.getFullYear(),today.getMonth(),pd);
  if(s>today)s=payDate(today.getFullYear(),today.getMonth()-1,pd);
  const e=payDate(s.getFullYear(),s.getMonth()+1,pd);
  return{start:s,end:e};
}
const sum=a=>a.reduce((x,y)=>x+y,0);
const fixedOf=st=>sum(st.fixed.map(f=>+f.a||0));
const availOf=st=>st.income-fixedOf(st)-st.save;
function compute(D,today){
  const st=D.setup,c=cycleOf(today,st.payday),sk=keyOf(c.start),ek=keyOf(c.end),tk=keyOf(today);
  const inCycle=D.entries.filter(e=>e.d>=sk&&e.d<ek&&e.src!=='save');
  const out=inCycle.filter(e=>e.a>0),income=-sum(inCycle.filter(e=>e.a<0).map(e=>e.a));
  const spentCycle=sum(out.map(e=>e.a));
  const spentToday=sum(out.filter(e=>e.d===tk).map(e=>e.a));
  const avail=availOf(st)+income;
  const daysLeft=Math.max(1,diff(today,c.end));
  const cycleDays=diff(c.start,c.end);
  const elapsed=cycleDays-daysLeft+1;
  const remainStart=avail-(spentCycle-spentToday);
  const allowance=Math.max(0,remainStart/daysLeft);
  const todayLeft=allowance-spentToday;
  const remain=avail-spentCycle;
  const tomorrow=daysLeft>1?Math.max(0,remain/(daysLeft-1)):null;
  const usingSince=D.since&&D.since>sk?D.since:sk;
  const usedDays=Math.max(1,diff(parse(usingSince),today)+1);
  const avg=sum(out.filter(e=>e.c!=='之前').map(e=>e.a))/usedDays;
  let pace=null;
  if(usedDays>=3&&avg>0&&remain>0){
    const proj=remain-avg*(daysLeft-1);
    if(proj<0){const last=new Date(today.getTime()+Math.floor(remain/avg)*DAY);pace={short:true,avg,last,early:diff(last,c.end)}}
    else pace={short:false,avg,extra:proj};
  }
  return{c,sk,ek,tk,avail,spentCycle,spentToday,daysLeft,cycleDays,elapsed,allowance,todayLeft,remain,tomorrow,pace,ref:availOf(st)/cycleDays,income,inCycle,remainStart};
}
function rollover(D,today){
  const c=cycleOf(today,D.setup.payday),sk=keyOf(c.start);
  if(D.cycle.start===sk)return null;
  let ended=null;
  if(D.cycle.start&&D.cycle.start<sk){
    const prevStart=D.cycle.start;
    const spent=sum(D.entries.filter(e=>e.d>=prevStart&&e.d<sk&&e.src!=='save').map(e=>e.a));
    const avail=D.cycle.avail??availOf(D.setup);
    ended={start:prevStart,end:sk,avail,spent,left:Math.round((avail-spent)*100)/100,saved:D.cycle.saved?D.cycle.planSave:0};
    D.history.unshift(ended);D.history=D.history.slice(0,12);
  }
  D.cycle={start:sk,saved:false,avail:availOf(D.setup),planSave:D.setup.save};
  const cut=keyOf(new Date(today.getTime()-120*DAY));
  D.entries=D.entries.filter(e=>e.d>=cut);
  return ended;
}
function preview(D,today,amount,isIncome){
  const C=JSON.parse(JSON.stringify(D));
  C.entries=C.entries||[];
  C.entries.push({d:keyOf(today),a:isIncome?-Math.abs(+amount):Math.abs(+amount)});
  const R=compute(C,today);
  return{todayLeft:R.todayLeft,tomorrow:R.tomorrow,level:R.allowance>0?R.todayLeft/R.allowance:0};
}
function daySpent(D,k){
  return sum((D.entries||[]).filter(e=>e.d===k&&e.a>0&&e.src!=='save'&&e.c!=='之前').map(e=>e.a));
}
function dayStatus(D,k,today){
  const tk=today?(today instanceof Date?keyOf(today):String(today)):null;
  if(tk&&k>tk)return 'future';
  const rec=(D.days&&D.days[k])||{};
  const spent=daySpent(D,k);
  const has=spent>0.0000001;
  if(!has&&!rec.zero)return 'blank';
  if(rec.zero&&!has)return 'kept';
  if(typeof rec.allow!=='number')return has?'kept':'blank';
  if(Math.round(spent*100+1e-6)>Math.round(rec.allow*100+1e-6))return 'over';
  return 'kept';
}
function streak(D,today){
  let n=0;
  for(let i=1;i<400;i++){
    const k=keyOf(new Date(today.getTime()-i*DAY));
    if(dayStatus(D,k,today)==='kept')n++;
    else break;
  }
  return n;
}
function carryOver(D,amount){
  if(!D.entries)D.entries=[];
  D.entries.push({d:D.cycle&&D.cycle.start,a:-Math.abs(+amount),c:'结转'});
  return D;
}
function ensure(D){
  if(!D||typeof D!=='object')return D;
  if(!Array.isArray(D.entries))D.entries=[];
  if(!Array.isArray(D.history))D.history=[];
  if(!D.cycle||typeof D.cycle!=='object')D.cycle={start:null};
  if(typeof D.savedTotal!=='number')D.savedTotal=0;
  if(!D.days||typeof D.days!=='object')D.days={};
  if(!D.ui||typeof D.ui!=='object')D.ui={lastOpen:null,a2hsDismissed:false,hideAmounts:true};
  else{if(D.ui.a2hsDismissed==null)D.ui.a2hsDismissed=false;if(D.ui.hideAmounts==null)D.ui.hideAmounts=true}
  if(D.setup){
    if(!Array.isArray(D.setup.fixed))D.setup.fixed=[];
    if(typeof D.setup.save!=='number')D.setup.save=0;
    if(typeof D.setup.payday!=='number')D.setup.payday=10;
    if(typeof D.setup.income!=='number')D.setup.income=0;
  }
  return D;
}
/*end*/
const $=s=>document.querySelector(s);
const KEY='xl_daily_v1';
const CATS=['吃饭','交通','购物','娱乐','其他'];
const PRESET=['房租','房贷','话费网费','交通卡','会员订阅','保险','给家里','还信用卡'];
const qd=new URLSearchParams(location.search).get('d');
const TODAY=(()=>{if(qd&&/^\d{4}-\d{2}-\d{2}$/.test(qd))return parse(qd);const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())})();
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const YT=74,YB=190,PEAR_W=140;
let seq=0;const uid=()=>Date.now()*10+(seq++%10);
const fmt=n=>{const r=Math.round(n*100)/100;if(Math.abs(r-Math.round(r))<1e-9)return Math.round(r).toLocaleString('zh-CN');return r.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})};
const ym=n=>(n<0?'-':'')+'¥'+fmt(Math.abs(n));
function pick(arr,salt){const s=keyOf(TODAY)+'|'+salt;let h=0;for(let i=0;i<s.length;i++)h=(h*33+s.charCodeAt(i))>>>0;return arr[h%arr.length]}
function fillCopy(t,map){return t.replace(/\{(\w+)\}/g,(_,k)=>map[k]??'')}
const COPY={
  morning:['早，今天这颗梨 ¥{n}。','新的一颗，¥{n}。','今天的份到了：¥{n}。'],
  left:['稳，还剩 ¥{n}。','还剩 ¥{n}，节奏刚好。','记下了，还剩 ¥{n}。'],
  even:['今天刚好吃完，正好。','正好花完今天的份。','今天这颗梨吃完了。'],

  }else{

    let pears='';for(let i=0;i<n;i++)pears+=`<i style="animation-delay:${(i*step).toFixed(0)}ms"></i>`;
    body=`<p class="lbl">${ym(R.avail)} → ${n} 颗梨</p><div class="hero">${ym(R.allowance)}</div><div class="split">${pears}</div><button type="button" class="go block" data-act="finishRitual">开始用</button>`;
  }
  $('#ritual').innerHTML=`<div class="shead"><span>发工资</span><button type="button" data-act="skipRitual">跳过</button></div><div class="rbody">${body}</div>`;
  if(ritualStep==='save'){paintSaveReadout();bindTrack()}
}
function snaps(){
  const plan=D.setup.income?Math.round(D.setup.save/D.setup.income*100):0;
  return [...new Set([0,10,20,30,plan])].filter(x=>x>=0&&x<=100).sort((a,b)=>a-b);
}
function nearestPct(p){const pts=snaps();return pts.reduce((b,x)=>Math.abs(x-p)<Math.abs(b-p)?x:b,pts[0])}
function paintSaveReadout(){
  const save=Math.round(D.setup.income*ritualPct/100);
  const line=$('#saveNow');if(line)line.textContent=`每月 ${ym(save)}，一年 ${ym(save*12)}`;
  const h=$('#handle');if(h)h.style.bottom=ritualPct+'%';
}
function bindTrack(){
  const track=$('#jarTrack');if(!track)return;
  track.onpointerdown=ev=>{
    ev.preventDefault();
    const rect=track.getBoundingClientRect();
    const move=e=>{const y=(e.clientY==null?ev.clientY:e.clientY);ritualPct=Math.max(0,Math.min(100,Math.round((rect.bottom-y)/rect.height*100)));paintSaveReadout()};
    const up=()=>{ritualPct=nearestPct(ritualPct);paintSaveReadout();window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up)};
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);move(ev);
  };
}
function applyRitualSave(mark){
  savePct=Math.max(0,Math.min(100,Math.round(ritualPct)));
  const save=Math.round(D.setup.income*savePct/100);
  D.setup.save=save;D.cycle.planSave=save;D.cycle.avail=availOf(D.setup);
  if(mark){if(!D.cycle.saved)D.savedTotal=Math.round((D.savedTotal+save)*100)/100;D.cycle.saved=true;D.cycle.remind=false}
  else D.cycle.remind=true;
  store();
}
function miniPear(kind){
  const fill=kind==='kept'||kind==='over'?'#4E8A62':'none';
  const dash=kind==='blank'||kind==='future'?'stroke-dasharray="2 2"':'';
  const bite=kind==='over'?'<circle cx="17" cy="11" r="4.5" fill="var(--paper)"/>':'';
  return `<svg viewBox="0 0 24 32" aria-hidden="true"><path d="M12 6c2 0 3 2 3.2 4 2 .8 4.8 3 4.8 6.5C20 21 16.5 24 12 24.5 7.5 24 4 21 4 16.5 4 13 6.8 10.8 8.8 10 9 8 10 6 12 6z" fill="${fill}" stroke="currentColor" ${dash}/>${bite}<path d="M12 6c.2-2 1.2-3.2 2.4-4" fill="none" stroke="currentColor"/></svg>`;
}
function openOrchard(){
  sheetName='orchard';sheetFrom=null;const R=compute(D,TODAY);
  const days=[];for(let t=R.c.start.getTime();t<R.c.end.getTime();t+=DAY)days.push(new Date(t));
  const lead=(days[0].getDay()+6)%7;
  let keptN=0,longest=0,run=0;
  const proj=R.daysLeft?Math.max(0,R.remain)/R.daysLeft:0;
  const cells=Array(lead).fill('<i></i>').concat(days.map(d=>{
    const k=keyOf(d);const st=k>R.tk?'future':dayStatus(D,k,TODAY);
    if(st==='kept'){keptN++;run++;if(run>longest)longest=run}else if(k<R.tk)run=0;
    const sub=st==='future'?fmt(proj):String(d.getDate());
    return `<button type="button" class="cell${k===R.tk?' today':''}" data-day="${k}">${miniPear(st)}<span>${sub}</span></button>`;
  })).join('');
  const avg=R.elapsed?R.spentCycle/R.elapsed:0;
  let detail='';
  if(openDay){
    const list=D.entries.filter(e=>e.d===openDay);
    detail=`<p>${openDay}</p>`+(list.length?list.map(e=>`<div class="fx"><span>${esc(e.c||(e.a<0?'收入':'支出'))} ${e.a<0?'+':''}${ym(Math.abs(e.a))}</span><button type="button" data-act="drop" data-id="${e.id}">删除</button></div>`).join(''):'<p class="sub" style="text-align:left">这一天没有记录</p>');
  }
  $('#mask').hidden=false;
  const hide=D.ui.hideAmounts!==false;
  $('#sheet').innerHTML=`<div class="shead"><span class="gold">本月</span><button type="button" data-close>完成</button></div>
  <div class="sbody"><p>守住 ${keptN} 天 · 最长 ${longest} 天 · 平均每天 ${ym(avg)}</p>
  <button type="button" class="choice" data-act="share">生成梨园图</button>
  <button type="button" class="choice" data-act="toggleHide">隐藏金额 · ${hide?'开':'关'}</button>
  <div class="grid">${cells}</div>${detail}</div>`;
}
function openJar(){
  sheetName='jar';sheetFrom=null;
  const target=3*Math.max(0,D.setup.income-D.setup.save);
  const p=target>0?Math.min(1,D.savedTotal/target):0;
  const months=D.setup.save>0&&target>D.savedTotal?Math.ceil((target-D.savedTotal)/D.setup.save):0;
  const c=2*Math.PI*46,dash=(p*c).toFixed(1);
  const note=p>=1?pick(COPY.full,'full'):(months?`再存 ${months} 个月就够`: '先定一个每月要存的数');
  let pend='';
  if(D.ended&&D.ended.left>0.5)pend=`<button type="button" class="choice" data-act="toJar">上一期多出的 ${ym(D.ended.left)} 存进梨罐</button><button type="button" class="choice" data-act="toMonth">滚到这个月，每天多 ${ym(carryDelta(D.ended.left))}</button>`;
  else if(D.ended&&D.ended.left<-0.5)pend=`<p>上一期超了 ${ym(-D.ended.left)}，这一期已经重新开始</p><button type="button" class="choice" data-act="knew">知道了</button>`;
  const hist=D.history.slice(0,6).map(h=>{const s=parse(h.start);return `<div class="fx"><span>${s.getMonth()+1}月${s.getDate()}日起</span><span>${h.left>=0?'多出 '+ym(h.left):'超了 '+ym(-h.left)}</span></div>`}).join('')||'<p class="sub" style="text-align:left">还没有上一期</p>';
  const remind=D.cycle&&D.cycle.remind&&!D.cycle.saved?`<button type="button" class="go block" data-act="markSaved">我已转好 ${ym(D.setup.save)}</button>`:'';
  $('#mask').hidden=false;
  $('#sheet').innerHTML=`<div class="shead"><span>梨罐</span><button type="button" data-close>完成</button></div>
  <div class="sbody"><div class="jarwrap"><svg viewBox="0 0 120 140" width="150" height="175" aria-hidden="true">
    <defs><clipPath id="jarClip"><path d="M40 30h40v8c16 4 22 16 22 34v30c0 16-14 26-28 28H46c-14-2-28-12-28-28V72c0-18 6-30 22-34V30z"/></clipPath></defs>
    <g clip-path="url(#jarClip)"><rect x="18" y="${108-(p*70)}" width="84" height="${p*78}" fill="#E3A33B"/></g>
    <path d="M40 30h40v8c16 4 22 16 22 34v30c0 16-14 26-28 28H46c-14-2-28-12-28-28V72c0-18 6-30 22-34V30z" fill="none" stroke="#E3A33B" stroke-width="2"/>
    <path d="M46 22h28v8H46z" fill="none" stroke="#E3A33B" stroke-width="2"/>
  </svg></div>
  <div class="hero" style="text-align:center">${ym(D.savedTotal)}</div>
  <div class="jarwrap"><svg viewBox="0 0 120 120" width="120" height="120" aria-hidden="true"><circle cx="60" cy="60" r="46" fill="none" stroke="var(--hair)" stroke-width="6"/><circle cx="60" cy="60" r="46" fill="none" stroke="#E3A33B" stroke-width="6" stroke-linecap="round" stroke-dasharray="${dash} ${c.toFixed(1)}" transform="rotate(-90 60 60)"/></svg></div>
  <p class="sub">${note} · 目标 ${ym(target)}</p>${remind}${pend}<p>最近几期</p>${hist}</div>`;
}
function plant(){
  const d=draftResult();if(!(d.st.income>0)||d.av<=0||!(payday>=1&&payday<=31))return;
  d.st.fixed=d.st.fixed.filter(f=>f.a>0);fixed=d.st.fixed.map(f=>({n:f.n,a:f.a}));
  D=ensure({setup:d.st,entries:[],savedTotal:0,history:[],cycle:{start:null},ended:null,since:keyOf(TODAY),days:{},ui:{lastOpen:null,a2hsDismissed:false,hideAmounts:true}});
  rollover(D,TODAY);
  if(already>0)D.entries.push({id:uid(),d:D.cycle.start,a:already,c:'之前'});
  store();buf='';incMode=false;cat=null;showHome();
}
function closeMask(){if(picURL){URL.revokeObjectURL(picURL);picURL=''}sheetName=null;sheetFrom=null;clearArmed=false;$('#mask').hidden=true;$('#sheet').innerHTML=''}
function closeTop(){
  if((sheetName==='fixed'||sheetName==='import')&&sheetFrom){
    fixed=fixed.filter(f=>f.a>0);
    const back=sheetFrom;sheetFrom=null;
    if(setupMode)paintSetup();else writeThrough();
    if(back==='settings'){openSettings();return}
    closeMask();if(!setupMode)render();return;
  }
  if(!setupMode){fixed=fixed.filter(f=>f.a>0);writeThrough();render()}
  closeMask();
}
function openSettings(){
  sheetName='settings';sheetFrom=null;field='income';raw=income?String(income):'';
  $('#mask').hidden=false;
  $('#sheet').innerHTML=`<div class="shead"><span>设置</span><button type="button" data-close>完成</button></div>
  <div class="sbody"><div data-sentence>${sentenceHTML(false)}</div>
  <button type="button" class="rowbtn" data-act="export">导出备份</button>
  <button type="button" class="rowbtn" data-act="import">导入备份</button>
  <button type="button" class="rowbtn" id="clearBtn" data-act="clear">清空数据</button>
  <p class="sub" style="text-align:left">数据只在这台手机里。换手机前先导出一段备份文字。点一下首页的梨，水面会跟着手机轻轻倾斜。</p></div>
  ${padHTML()}`;
  paintSentences();
}
function renderFixed(){
  const box=$('#fxList');if(!box)return;
  box.innerHTML=fixed.length?fixed.map((f,i)=>`<div class="fx"><span>${f.n.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</span><button type="button" data-field="fx${i}" class="${field==='fx'+i?'on':''}">¥${field==='fx'+i?(raw===''?'':raw):fmt(f.a||0)}</button><button type="button" data-del="${i}" aria-label="删除">×</button></div>`).join(''):'<p class="sub" style="text-align:left">还没有固定支出</p>';
}
function openFixed(){
  sheetFrom=sheetName==='settings'?'settings':(setupMode?'setup':null);
  sheetName='fixed';
  $('#mask').hidden=false;
  $('#sheet').innerHTML=`<div class="shead"><span>固定要付</span><button type="button" data-close>完成</button></div>
  <div class="sbody"><div class="chips">${PRESET.map(p=>`<button type="button" data-add="${p}">+ ${p}</button>`).join('')}<button type="button" data-add="其他">+ 其他</button></div><div id="fxList"></div></div>${padHTML()}`;
  renderFixed();
}
function openImport(){
  sheetFrom='settings';sheetName='import';
  $('#sheet').innerHTML=`<div class="shead"><span>导入备份</span><button type="button" data-close>取消</button></div>
  <div class="sbody"><p>粘贴之前导出的那段文字，核对无误后再覆盖。</p>
  <textarea id="imp" placeholder="把备份文字粘贴在这里"></textarea>
  <p id="impErr" class="err"></p>
  <button type="button" class="go block" data-act="doImport" style="margin:12px 0">覆盖本机数据</button></div>`;
}
function doImport(){
  const text=($('#imp')&&$('#imp').value||'').trim();let o,err='';
  try{o=JSON.parse(text)}catch(e){err='这段文字不是备份'}
  if(!err){
    if(!o||typeof o!=='object'||!o.setup||typeof o.setup.payday!=='number'||typeof o.setup.income!=='number'||!Array.isArray(o.setup.fixed)||!Array.isArray(o.entries))err='备份里缺了工资或记录';
  }
  const box=$('#impErr');if(box)box.textContent=err;if(err)return;
  D=ensure(o);store();closeMask();showHome();
}
function shareGarden(){
  const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1350;
  const g=canvas.getContext('2d');if(!g||!D)return;
  const R=compute(D,TODAY),hide=D.ui.hideAmounts!==false;
  const cs=getComputedStyle(document.body);
  const paper=(cs.backgroundColor||'#F4F3EE');const ink=(cs.color||'#1E201D');
  g.fillStyle=paper;g.fillRect(0,0,1080,1350);
  const days=[];for(let t=R.c.start.getTime();t<R.c.end.getTime();t+=DAY)days.push(new Date(t));
  let kept=0;days.forEach(d=>{const k=keyOf(d);if(k<=R.tk&&dayStatus(D,k,TODAY)==='kept')kept++});
  const savedAmt=D.cycle&&D.cycle.saved?(+D.cycle.planSave||0):0;
  const title=hide?`${R.c.start.getMonth()+1} 月 · 守住 ${kept} 天`:`${R.c.start.getMonth()+1} 月 · 守住 ${kept} 天 · 存下 ${ym(savedAmt)}`;
  g.fillStyle=ink;g.font='56px -apple-system,PingFang SC,sans-serif';g.fillText(title,72,150);
  const lead=(days[0].getDay()+6)%7,cols=7,cw=120,ch=132,ox=72,oy=230;
  function drawPear(x,y,mode){
    g.save();g.translate(x,y);
    g.beginPath();g.moveTo(36,16);g.bezierCurveTo(52,16,62,32,64,48);g.bezierCurveTo(84,58,100,80,100,104);g.bezierCurveTo(100,128,78,146,36,148);g.bezierCurveTo(-6,146,-28,128,-28,104);g.bezierCurveTo(-28,80,-12,58,8,48);g.bezierCurveTo(10,32,20,16,36,16);g.closePath();
    if(mode==='kept'||mode==='over'){g.fillStyle='#4E8A62';g.fill()}
    g.strokeStyle=ink;g.lineWidth=3;g.setLineDash(mode==='blank'||mode==='future'?[6,6]:[]);g.stroke();
    g.beginPath();g.moveTo(36,16);g.quadraticCurveTo(40,4,52,-6);g.stroke();
    if(mode==='over'){g.fillStyle=paper;g.beginPath();g.arc(58,40,16,0,6.3);g.fill()}
    g.restore();
  }
  days.forEach((d,i)=>{
    const k=keyOf(d),st=k>R.tk?'future':dayStatus(D,k,TODAY);
    const col=(lead+i)%cols,row=Math.floor((lead+i)/cols);
    drawPear(ox+col*cw,oy+row*ch,st);
    if(k===R.tk){g.strokeStyle=ink;g.lineWidth=2;g.setLineDash([]);g.strokeRect(ox+col*cw-36,oy+row*ch-12,108,168)}
  });
  g.fillStyle=ink;g.font='32px -apple-system,PingFang SC,sans-serif';
  g.fillText('小梨',72,1288);g.fillText('xiaolipearl.com',180,1288);
  canvas.toBlob(blob=>{
    if(!blob)return;
    const file=new File([blob],'pear-garden.png',{type:'image/png'});
    const can=navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}));
    if(can)navigator.share({files:[file],title:'今天还能花'}).catch(err=>{if(!err||err.name!=='AbortError')showPic(blob)});
    else showPic(blob);
  },'image/png');
}
function showPic(blob){
  if(picURL)URL.revokeObjectURL(picURL);picURL=URL.createObjectURL(blob);sheetName='pic';
  $('#mask').hidden=false;
  $('#sheet').innerHTML='<div class="shead"><span>梨园</span><button type="button" data-close>完成</button></div><div class="sbody"><p>长按图片保存</p><img id="pic" alt="本期梨园"></div>';
  $('#pic').src=picURL;
}
document.body.addEventListener('click',ev=>{
  const k=ev.target.closest('[data-k]');if(k){press(k.dataset.k);return}
  const f=ev.target.closest('[data-field]');if(f){focusField(f.dataset.field);return}
  const catBtn=ev.target.closest('[data-cat]');if(catBtn){cat=cat===catBtn.dataset.cat?null:catBtn.dataset.cat;render();return}
  const dayBtn=ev.target.closest('[data-day]');if(dayBtn){openDay=openDay===dayBtn.dataset.day?null:dayBtn.dataset.day;openOrchard();return}
  const nav=ev.target.closest('[data-nav]');if(nav){if(nav.dataset.nav==='settings')openSettings();else if(nav.dataset.nav==='orchard')openOrchard();else openJar();return}
  if(ev.target.id==='ok'){commit();return}
  if(ev.target.id==='inc'){incMode=!incMode;render();return}
  if(ev.target.id==='plant'){plant();return}
  if(ev.target.closest('[data-close]')){closeTop();return}
  if(ev.target.id==='mask'){closeTop();return}
  const add=ev.target.closest('[data-add]');
  if(add){if(fixed.length<12){fixed.push({n:add.dataset.add,a:0});field='fx'+(fixed.length-1);raw='';renderFixed()}return}
  const del=ev.target.closest('[data-del]');
  if(del){fixed.splice(+del.dataset.del,1);field='income';raw='';renderFixed();paintSentences();return}
  const act=ev.target.closest('[data-act]');
  if(!act)return;
  if(act.dataset.act==='export'){
    const text=JSON.stringify(D);
    sheetName='export';sheetFrom='settings';
    $('#sheet').innerHTML=`<div class="shead"><span>导出备份</span><button type="button" data-close>完成</button></div><div class="sbody"><p>复制备用文字，存在别处。导入时整段贴回来。</p><textarea id="exp" readonly></textarea></div>`;
    $('#exp').value=text;$('#exp').focus();$('#exp').select();
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).catch(()=>{});
  }else if(act.dataset.act==='import')openImport();
  else if(act.dataset.act==='doImport')doImport();
  else if(act.dataset.act==='clear'){
    if(!clearArmed){clearArmed=true;act.textContent='再点一次，确认清空';setTimeout(()=>{if(clearArmed&&act.isConnected){clearArmed=false;act.textContent='清空数据'}},4000)}
    else{localStorage.removeItem(KEY);location.reload()}
  }else if(act.dataset.act==='large'){
    const v=largeV,mode=act.dataset.mode==='save'?'save':'spend';closeMask();doCommit(v,mode);
  }else if(act.dataset.act==='noSpend'){
    const k=keyOf(new Date(TODAY.getTime()-DAY));if(!D.days[k])D.days[k]={};D.days[k].zero=true;if(typeof D.days[k].allow!=='number'&&lastR)D.days[k].allow=lastR.allowance;store();render();
  }else if(act.dataset.act==='fillYest'){backfill=true;render()}
  else if(act.dataset.act==='skipRitual'||act.dataset.act==='finishRitual')finishRitual();
  else if(act.dataset.act==='toJar'){if(D.ended){D.savedTotal=Math.round((D.savedTotal+D.ended.left)*100)/100;D.ended=null;store()}if(ritualOn){ritualStep='pay';paintRitual()}else{render();openJar()}}
  else if(act.dataset.act==='toMonth'){if(D.ended){carryOver(D,D.ended.left);const added=D.entries[D.entries.length-1];if(added&&added.id==null)added.id=uid();D.ended=null;store()}if(ritualOn){ritualStep='pay';paintRitual()}else{render();openJar()}}
  else if(act.dataset.act==='knew'){D.ended=null;store();if(ritualOn){ritualStep='pay';paintRitual()}else{render();closeMask()}}
  else if(act.dataset.act==='toSave'){ritualStep='save';paintRitual()}
  else if(act.dataset.act==='didSave'){applyRitualSave(true);ritualStep='split';paintRitual()}
  else if(act.dataset.act==='later'){applyRitualSave(false);ritualStep='split';paintRitual()}
  else if(act.dataset.act==='markSaved'){if(D.cycle&&!D.cycle.saved){D.savedTotal=Math.round((D.savedTotal+D.setup.save)*100)/100;D.cycle.saved=true}if(D.cycle)D.cycle.remind=false;store();render();openJar()}
  else if(act.dataset.act==='dismissA2hs'){pendingA2hs=false;D.ui.a2hsDismissed=true;$('#a2hs').hidden=true;store()}
  else if(act.dataset.act==='toggleHide'){D.ui.hideAmounts=D.ui.hideAmounts===false;store();openOrchard()}
  else if(act.dataset.act==='share')shareGarden();
  else if(act.dataset.act==='drop'){
    const id=+act.dataset.id;const e=D.entries.find(x=>x.id===id);
    D.entries=D.entries.filter(x=>x.id!==id);if(e&&e.src==='save')D.savedTotal=Math.round((D.savedTotal+e.a)*100)/100;
    store();render();openOrchard();
  }
});
document.addEventListener('keydown',ev=>{
  if(ev.target.tagName==='TEXTAREA'||ritualOn)return;
  if(/^\d$/.test(ev.key)||ev.key==='.')press(ev.key==='.'?'.':ev.key);
  else if(ev.key==='Backspace')press('bs');
  else if(ev.key==='Enter'&&!setupMode)commit();
});
$('#pearbox').addEventListener('click',ev=>{if(!ev.target.closest('#undo'))enableTilt()});
$('#setupPad').innerHTML=padHTML();
$('#homePad').innerHTML=padHTML();
try{D=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){D=null}
if(D&&D.setup){ensure(D);showHome()}else showSetup();
</script>
